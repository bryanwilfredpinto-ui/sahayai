services:
  - type: web
    name: chitti-vaani-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: ALLOWED_ORIGINS
        value: https://sahayai.in,https://www.sahayai.in
      - key: VAANI_MAX_TOKENS
        value: "600"
      - key: VAANI_TEMPERATURE
        value: "0.4"
