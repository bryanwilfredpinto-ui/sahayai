# Render Blueprint for Chitti Shares (Phases 1-6)
# -----------------------------------------------
# Deploys backend + frontend + cron jobs in ONE go via Render Blueprint.
#
# Steps:
#   1. Push this chitti-shares/ folder to GitHub.
#   2. In Render: New + -> Blueprint -> point at the repo.
#   3. Render reads this file and creates everything below.
#
# Manual env vars (set after Blueprint creates services):
#   - FAST2SMS_API_KEY      (chitti-shares-api)
#   - KITE_API_KEY          (kept as provision; only needed if DATA_SOURCE=kite)
#   - KITE_API_SECRET       (same)
#   - DEEPSEEK_API_KEY      (required)
#   - ADMIN_MOBILE          (your 10-digit mobile, no +91)
#   - CRON_SECRET           (long random string, same value across all 4 services)
#   - TELEGRAM_BOT_TOKEN    (optional, for Kite re-auth alerts)
#   - TELEGRAM_CHAT_ID      (optional)
#
# DATA_SOURCE defaults to "yahoo" - free, no daily expiry. Switch to "kite"
# later by changing the env var (and re-running OAuth dance).

services:
  # ===== Backend API =====
  - type: web
    name: chitti-shares-api
    runtime: python
    plan: free
    rootDir: chitti-shares/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: chitti-shares-db
          property: connectionString
      - key: FAST2SMS_API_KEY
        sync: false           # You set this manually in dashboard
      - key: OTP_LENGTH
        value: "6"
      - key: OTP_EXPIRY_MINUTES
        value: "5"
      - key: FRONTEND_URL
        value: https://shares.sahayai.in
      - key: BACKEND_URL
        value: https://chitti-shares-api.onrender.com
      - key: DEV_MODE_FAKE_OTP
        value: "false"

      # ---- Phase 2: Market Data ----
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false
      - key: KITE_REDIRECT_URL
        value: https://chitti-shares-api.onrender.com/api/market/auth-callback
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ADMIN_MOBILE
        sync: false

      # ---- Phase 3-5: Data source + features ----
      - key: DATA_SOURCE
        value: "yahoo"
      - key: ALERTS_POLL_MINUTES
        value: "5"
      - key: MAX_WATCHLIST_ITEMS
        value: "50"
      - key: MAX_ALERTS_PER_USER
        value: "30"

      # ---- Phase 6: Quota caps + Telegram + Cron secret ----
      - key: DAILY_BUDGET_INR
        value: "50"
      - key: HARD_CAP_INR
        value: "100"
      - key: TELEGRAM_BOT_TOKEN
        sync: false           # Optional. From @BotFather
      - key: TELEGRAM_CHAT_ID
        sync: false           # Optional
      - key: CRON_SECRET
        sync: false           # Long random string. Same value as cron jobs below.

  # ===== Frontend Static Site =====
  - type: web
    name: chitti-shares-web
    runtime: static
    rootDir: chitti-shares/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://chitti-shares-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ===== Phase 6: Cron Jobs =====
  # NOTE: Render free tier allows 1 cron job. If you only have one slot,
  # prioritise chitti-alerts. The other two can be triggered manually.
  - type: cron
    name: chitti-alerts
    runtime: docker
    schedule: "*/5 3-10 * * 1-5"   # every 5 min, Mon-Fri 8:30-16:00 IST
    dockerCommand: |
      sh -c "curl -fsS -X POST 'https://chitti-shares-api.onrender.com/api/cron/alerts?secret=${CRON_SECRET}'"
    envVars:
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: chitti-track-calls
    runtime: docker
    schedule: "*/5 3-10 * * 1-5"
    dockerCommand: |
      sh -c "curl -fsS -X POST 'https://chitti-shares-api.onrender.com/api/cron/track-calls?secret=${CRON_SECRET}'"
    envVars:
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: chitti-kite-reauth
    runtime: docker
    schedule: "25 0 * * *"        # daily 5:55 AM IST
    dockerCommand: |
      sh -c "curl -fsS -X POST 'https://chitti-shares-api.onrender.com/api/cron/kite-reauth?secret=${CRON_SECRET}'"
    envVars:
      - key: CRON_SECRET
        sync: false

databases:
  - name: chitti-shares-db
    plan: free
    databaseName: chitti_shares
