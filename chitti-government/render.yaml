# Render Blueprint for Chitti Government
# ------------------------------------------------------------------
# We REUSE the chitti-shares Supabase Postgres (Render free tier permits
# only one free DB per workspace) and isolate every Chitti Government
# table under a dedicated `government` schema. See
# backend/models/_schema.py for the implementation.
#
# Net effect:
#   - chitti-shares tables   → public.*       (default schema)
#   - chitti-medupi tables   → medupi.*
#   - chitti-government rows → government.*   (this Blueprint)
# Zero risk of name collision; all share the same Supabase storage.

services:
  - type: web
    name: chitti-government-api
    runtime: python
    plan: free
    rootDir: chitti-government/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10

      # Supabase Postgres URL — paste in dashboard. Same one used by
      # chitti-shares and chitti-medupi; isolated by `government` schema.
      - key: DATABASE_URL
        sync: false

      # ── DeepSeek (eligibility coach + plain-language explainer) ──
      # If unset the service falls back to the deterministic rule-engine
      # reply, so the feature is never a coming-soon stub.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_URL
        value: https://api.deepseek.com/chat/completions
      - key: DEEPSEEK_MAX_TOKENS
        value: "700"
      - key: DEEPSEEK_TEMPERATURE
        value: "0.2"

      # ── CORS / self-URL ──
      - key: ALLOWED_ORIGINS
        value: "https://sahayai.in,https://www.sahayai.in"
      - key: BACKEND_URL
        value: https://chitti-government-api.onrender.com

      # ── Nominatim (Indian govt-office locator) ──
      # Nominatim usage policy: 1 req/s, real UA, contact email.
      - key: NOMINATIM_URL
        value: https://nominatim.openstreetmap.org
      - key: NOMINATIM_CONTACT_EMAIL
        value: chittigovernment@gmail.com
      - key: NOMINATIM_USER_AGENT
        value: ChittiGovernment/1.0 (https://sahayai.in/chitti_government.html)

      # ── PIB poller cadence (hours) ──
      - key: PIB_POLL_HOURS
        value: "6"
      - key: SCHEDULER_ENABLED
        value: "true"

# No `databases:` block — we reuse the existing chitti-shares Supabase
# instance. The startup hook in main.py runs
# `CREATE SCHEMA IF NOT EXISTS government` before any
# Base.metadata.create_all() call, so the schema appears the first time
# the service boots.
