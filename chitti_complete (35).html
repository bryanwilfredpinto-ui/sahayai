<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sahay AI — Chitti</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0a; --surface: #141414; --surface2: #1e1e1e;
  --border: #2a2a2a; --text: #f0f0f0; --text2: #a0a0a0; --text3: #555;
  --saffron: #ff6b00; --green: #22c55e; --red: #ef4444;
}
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

/* ONBOARDING */
#onboarding { display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:0; }
#ob-progress { width:100%; height:3px; background:var(--surface2); position:sticky; top:0; z-index:10; }
#ob-bar { height:100%; background:var(--saffron); width:0%; transition:width 0.4s ease; box-shadow:0 0 8px rgba(255,107,0,0.5); }
#ob-body { width:100%; max-width:420px; padding:20px 16px; display:flex; flex-direction:column; align-items:center; }

.ob-card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px; width:100%; margin-bottom:14px; animation:slideUp 0.3s ease; }
@keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
@keyframes popIn { from{opacity:0;transform:scale(0.7)} to{opacity:1;transform:scale(1)} }

.ob-label { font-size:11px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:6px; }
.ob-input { width:100%; background:var(--surface2); border:1.5px solid var(--border); border-radius:12px; padding:13px 14px; font-size:15px; color:var(--text); outline:none; transition:border-color 0.2s; }
.ob-input:focus { border-color:var(--saffron); }
.ob-select { width:100%; background:var(--surface2); border:1.5px solid var(--border); border-radius:12px; padding:13px 14px; font-size:14px; color:var(--text); outline:none; }

.btn-primary { width:100%; background:var(--saffron); border:none; border-radius:14px; padding:17px; font-size:16px; font-weight:800; color:#000; cursor:pointer; transition:all 0.2s; box-shadow:0 4px 20px rgba(255,107,0,0.3); }
.btn-primary:disabled { opacity:0.3; cursor:not-allowed; }
.btn-primary:not(:disabled):active { transform:scale(0.98); }
.btn-back { background:var(--surface2); border:1.5px solid var(--border); border-radius:14px; padding:17px 24px; font-size:14px; font-weight:600; color:var(--text2); cursor:pointer; }

.ob-nav { display:flex; gap:10px; width:100%; margin-top:4px; }
.ob-nav .btn-primary { flex:1; }

/* APP */
#app { display:none; flex-direction:column; height:100vh; max-width:480px; margin:0 auto; background:var(--bg); }
.app-header { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.app-avatar { width:38px; height:38px; background:linear-gradient(135deg,var(--saffron),#ff3d00); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; }
.app-name { font-weight:800; font-size:15px; }
.app-status { font-size:11px; color:var(--green); }
.lang-bar { display:flex; gap:6px; overflow-x:auto; padding:8px 16px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
.lang-pill { background:var(--surface2); border:1.5px solid var(--border); border-radius:20px; padding:5px 12px; font-size:12px; font-weight:600; color:var(--text2); cursor:pointer; white-space:nowrap; }
.lang-pill.active { background:rgba(255,107,0,0.15); border-color:var(--saffron); color:var(--saffron); }
.chat-area { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; background:var(--bg); }
.msg { max-width:85%; animation:slideUp 0.2s ease; }
.msg-chitti { align-self:flex-start; }
.msg-user { align-self:flex-end; }
.bubble { padding:12px 16px; border-radius:18px; font-size:14px; line-height:1.6; }
.bubble-chitti { background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px; }
.bubble-user { background:var(--saffron); color:#000; font-weight:600; border-bottom-right-radius:4px; }
.msg-time { font-size:10px; color:var(--text3); margin-top:4px; text-align:right; }
.typing { display:flex; gap:4px; align-items:center; padding:14px 16px; }
.dot { width:7px; height:7px; background:var(--text3); border-radius:50%; animation:bounce 1.2s infinite; }
.dot:nth-child(2) { animation-delay:0.2s; }
.dot:nth-child(3) { animation-delay:0.4s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-8px)} }
.input-area { padding:12px 16px; background:var(--surface); border-top:1px solid var(--border); display:flex; gap:8px; align-items:flex-end; flex-shrink:0; }
.msg-input { flex:1; background:var(--surface2); border:1.5px solid var(--border); border-radius:22px; padding:11px 16px; font-size:14px; color:var(--text); outline:none; resize:none; max-height:120px; font-family:inherit; }
.msg-input:focus { border-color:var(--saffron); }
.send-btn { width:44px; height:44px; background:var(--saffron); border:none; border-radius:50%; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.send-btn:disabled { opacity:0.4; }
.mic-btn { width:44px; height:44px; background:var(--surface2); border:1.5px solid var(--border); border-radius:50%; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; }
.mic-btn.listening { background:rgba(34,197,94,0.2); border-color:var(--green); animation:pulse 1s infinite; }
.mic-btn.listening::after { content:''; }
.mic-btn.error { background:rgba(239,68,68,0.15); border-color:var(--red); }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,0.5)} 50%{box-shadow:0 0 0 10px rgba(34,197,94,0)} }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.chip { background:var(--surface2); border:1.5px solid var(--border); border-radius:20px; padding:7px 14px; font-size:13px; cursor:pointer; transition:all 0.15s; }
.chip:active { background:rgba(255,107,0,0.1); border-color:var(--saffron); color:var(--saffron); }
</style>
</head>
<body>

    <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const DEEPSEEK_KEY = 'sk-372a74292a8c407abaaf673aab58c3f1';
const SARVAM_KEY = 'sk_v57r3zb4_VdkuYXHLwgThZRXwLokigP1O';
const STORE_KEY = 'chitti_master_v48';

let MASTER = null;
let currentLang = 'en';
let voiceEnabled = false;
let isWaiting = false;
let recognition = null;
let isListening = false;
let history = [];
let obStep = 0;
let obData = {};

// ── SPEAK — works on Android (same as confirmed working pattern) ──
function speak(text) {
  if (!voiceEnabled) return;
  speakForce(text);
}


// Pre-load voices on page load
if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

// ── ONBOARDING ──
function setProgress(pct) { document.getElementById('ob-bar').style.width = pct + '%'; }

function startOnboarding() {
  document.getElementById('onboarding').style.display = 'flex';
  showStep0();
}


// ── FEEDBACK WIDGET ──────────────────────────────────────
function feedbackWidget(page) {
  return `
    <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px">
      <div style="font-size:11px;color:var(--text3);margin-bottom:8px;text-align:center">
        💬 How is this page? (tap to send feedback)
      </div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        ${['👍 Good','🐛 Bug','😕 Confusing','💡 Idea'].map(f=>`
          <button onclick="sendPageFeedback('${page}','${f}',this)" style="
            background:var(--surface2);border:1.5px solid var(--border);
            border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;
            color:var(--text2);transition:all 0.15s
          ">${f}</button>
        `).join('')}
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="fb-text-${page}" placeholder="Tell us more... (optional)" style="
          flex:1;background:var(--surface2);border:1.5px solid var(--border);
          border-radius:20px;padding:8px 14px;font-size:12px;color:var(--text);outline:none
        ">
        <button onclick="submitFeedback('${page}')" style="
          background:var(--saffron);border:none;border-radius:20px;
          padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;color:#000
        ">Send</button>
      </div>
      <div id="fb-thanks-${page}" style="display:none;text-align:center;font-size:12px;color:var(--green);margin-top:8px">
        ✅ Thank you! Sire will review this.
      </div>
    </div>
  `;
}

let fbSelected = {};
function sendPageFeedback(page, type, btn) {
  fbSelected[page] = type;
  // Highlight selected
  btn.parentElement.querySelectorAll('button').forEach(b => {
    b.style.background = 'var(--surface2)';
    b.style.borderColor = 'var(--border)';
    b.style.color = 'var(--text2)';
  });
  btn.style.background = 'rgba(255,107,0,0.15)';
  btn.style.borderColor = 'var(--saffron)';
  btn.style.color = 'var(--saffron)';
}

function submitFeedback(page) {
  const type = fbSelected[page] || 'General';
  const text = document.getElementById('fb-text-' + page)?.value || '';
  const entry = {
    page, type, text,
    ts: new Date().toISOString(),
    user: MASTER?.nick || 'Onboarding'
  };
  const log = JSON.parse(localStorage.getItem('chitti_page_feedback') || '[]');
  log.push(entry);
  localStorage.setItem('chitti_page_feedback', JSON.stringify(log));
  console.log('Feedback saved:', entry);
  const thanks = document.getElementById('fb-thanks-' + page);
  if (thanks) { thanks.style.display = 'block'; }
  setTimeout(() => { if (thanks) thanks.style.display = 'none'; }, 3000);
}

function getAllFeedback() {
  return JSON.parse(localStorage.getItem('chitti_page_feedback') || '[]');
}

// STEP 0 — Welcome + Name
function showStep0() {
  obStep = 0; setProgress(10);
  const body = document.getElementById('ob-body');
  body.innerHTML = `
    <div style="text-align:center;margin-bottom:28px;animation:popIn 0.4s ease">
      <div style="width:70px;height:70px;background:linear-gradient(135deg,#ff6b00,#ff3d00);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;box-shadow:0 8px 24px rgba(255,107,0,0.35)">🤖</div>
      <div style="font-size:26px;font-weight:900;letter-spacing:-0.5px">Sahay AI</div>
      <div style="font-size:14px;color:var(--saffron);font-weight:700;margin-top:2px">Bharat ka apna Chitti</div>
      <div style="font-size:12px;color:var(--text3);margin-top:4px">PA · CA · Doctor · Guardian · 🇮🇳</div>
    </div>

    <div class="ob-card">
      <div style="font-size:16px;font-weight:800;margin-bottom:4px">Welcome to Sahay AI</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:16px">Sahay AI mein aapka swagat hai</div>

      <div class="ob-label">First Name / Pehla Naam *</div>
      <input class="ob-input" id="s0-fname" placeholder="First name" style="margin-bottom:10px" oninput="checkStep0()">

      <div class="ob-label">Middle Name / Beech ka Naam</div>
      <input class="ob-input" id="s0-mname" placeholder="Middle name (optional)" style="margin-bottom:10px">

      <div class="ob-label">Last Name / Surname *</div>
      <input class="ob-input" id="s0-lname" placeholder="Last name" style="margin-bottom:14px" oninput="checkStep0()">

      <div class="ob-label">How should Chitti address you? / Chitti aapko kya bulaye? *</div>
      <div style="position:relative">
        <input class="ob-input" id="s0-nick" placeholder="e.g. Bryan, Raju, Didi..." oninput="checkStep0()" style="padding-right:50px">
        <button onclick="micName()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--saffron);border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px" title="Speak your name">🎤</button>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:6px">Tap 🎤 to speak — Chitti will fill your name</div>
    </div>

    ${feedbackWidget("step0")}
    <button class="btn-primary" id="s0-next" onclick="doneStep0()" disabled style="margin-top:12px">Continue →</button>
  `;
}

function checkStep0() {
  const ok = document.getElementById('s0-fname').value.trim() &&
             document.getElementById('s0-lname').value.trim() &&
             document.getElementById('s0-nick').value.trim();
  const btn = document.getElementById('s0-next');
  if (btn) { btn.disabled = !ok; }
}

function micName() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Speech not supported. Please type your name.'); return; }
  const btn = document.querySelector('button[onclick="micName()"]');
  const r = new SR();
  r.lang = 'en-IN';
  r.continuous = false;
  r.interimResults = false;
  r.onstart = () => { if (btn) { btn.textContent = '🔴'; btn.style.background = '#e74c3c'; } };
  r.onresult = e => {
    // Get best transcript from any result
    let spoken = '';
    for (let i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal || e.results[i][0].transcript.length > spoken.length) {
        spoken = e.results[i][0].transcript.trim();
      }
    }
    if (!spoken) return;
    const parts = spoken.split(' ').filter(Boolean);
    const f = document.getElementById('s0-fname');
    const m = document.getElementById('s0-mname');
    const l = document.getElementById('s0-lname');
    const n = document.getElementById('s0-nick');
    if (f) { f.value = parts[0] || ''; f.dispatchEvent(new Event('input')); }
    if (m) m.value = parts.length === 3 ? parts[1] : '';
    if (l) { l.value = parts.length >= 2 ? parts[parts.length-1] : ''; l.dispatchEvent(new Event('input')); }
    if (n) { n.value = parts[0] || spoken; n.dispatchEvent(new Event('input')); }
    checkStep0();
    if (btn) { btn.textContent = '✅'; btn.style.background = 'var(--green)'; }
  };
  r.onerror = (e) => {
    if (btn) { btn.textContent = '🎤'; btn.style.background = 'var(--saffron)'; }
    if (e.error === 'not-allowed') alert('Microphone permission denied. Please allow mic and reload.');
  };
  r.onend = () => {
    setTimeout(() => { if (btn && btn.textContent === '🔴') { btn.textContent = '🎤'; btn.style.background = 'var(--saffron)'; } }, 200);
  };
  r.start();
}

function doneStep0() {
  obData.firstName = document.getElementById('s0-fname').value.trim();
  obData.middleName = document.getElementById('s0-mname').value.trim();
  obData.lastName = document.getElementById('s0-lname').value.trim();
  obData.nick = document.getElementById('s0-nick').value.trim();
  showStep1();
}

// STEP 1 — Language
function showStep1() {
  obStep = 1; setProgress(25);
  const langs = [
    {code:'en',script:'English',name:'English',ready:true},
    {code:'hi',script:'हिंदी',name:'Hindi',ready:true},
    {code:'mr',script:'मराठी',name:'Marathi',ready:true},
    {code:'te',script:'తెలుగు',name:'Telugu',ready:true},
    {code:'ta',script:'தமிழ்',name:'Tamil',ready:true},
    {code:'kn',script:'ಕನ್ನಡ',name:'Kannada',ready:true},
    {code:'bn',script:'বাংলা',name:'Bengali',ready:true},
    {code:'gu',script:'ગુજરાતી',name:'Gujarati',ready:true},
    {code:'pa',script:'ਪੰਜਾਬੀ',name:'Punjabi',ready:false},
    {code:'ml',script:'മലയാളം',name:'Malayalam',ready:false},
    {code:'or',script:'ଓଡ଼ିଆ',name:'Odia',ready:false},
    {code:'as',script:'অসমীয়া',name:'Assamese',ready:false},
  ];

  const body = document.getElementById('ob-body');
  body.innerHTML = `
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:20px;font-weight:900">Choose Your Language</div>
      <div style="font-size:12px;color:var(--text3);margin-top:4px">Apni bhasha chuniye</div>
    </div>
    <div style="width:100%;margin-bottom:8px">
      <button onclick="testAudio()" style="width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:600">🔊 Tap to test audio — Tap karke audio test karein</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-bottom:16px">
      ${langs.map(l => `
        <button onclick="pickLang('${l.code}',this)" data-code="${l.code}" style="background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:12px 6px;cursor:pointer;text-align:center;transition:all 0.15s;position:relative">
          <div style="font-size:18px;font-weight:800;color:var(--text)">${l.script}</div>
          <div style="font-size:10px;color:var(--text3);margin-top:2px">${l.name}</div>
          ${!l.ready ? '<div style="font-size:9px;color:var(--saffron);margin-top:1px">Coming soon</div>' : ''}
        </button>
      `).join('')}
    </div>
    <div class="ob-nav">
      <div style="width:100%">${feedbackWidget('step1')}</div>
      <button class="btn-back" onclick="showStep0()">← Back</button>
      <button class="btn-primary" id="s1-next" onclick="doneStep1()" disabled>Continue →</button>
    </div>
  `;
}

function testAudio() {
  if (!('speechSynthesis' in window)) { alert('Audio not supported'); return; }
  window.speechSynthesis.cancel();
  const go = () => {
    const u = new SpeechSynthesisUtterance('Welcome to Sahay AI. Bharat ka apna Chitti. Audio is working.');
    const vv = window.speechSynthesis.getVoices();
    const v = vv.find(x => x.lang.startsWith('en'));
    if (v) u.voice = v;
    u.lang = 'en-IN'; u.rate = 0.85;
    window.speechSynthesis.speak(u);
  };
  const vv = window.speechSynthesis.getVoices();
  if (vv.length) go(); else { window.speechSynthesis.onvoiceschanged = go; setTimeout(go, 500); }
}

let pickedLang = null;
function pickLang(code, btn) {
  const ready = ['en','hi','mr','te','ta','kn','bn','gu'];
  if (!ready.includes(code)) {
    const msgs = {pa:'ਚਿੱਟੀ ਪੰਜਾਬੀ ਸਿੱਖ ਰਿਹਾ ਹੈ — Coming soon!',ml:'ചിറ്റി മലയാളം പഠിക്കുന്നു — Coming soon!',or:'ଚିଟ୍ଟି ଓଡ଼ିଆ ଶିଖୁଛି — Coming soon!',as:'চিট্টি অসমীয়া শিকি আছে — Coming soon!'};
    alert(msgs[code] || 'Coming soon! Please choose another language for now.');
    return;
  }
  pickedLang = code;
  document.querySelectorAll('[data-code]').forEach(b => {
    b.style.background = 'var(--surface)';
    b.style.border = '1.5px solid var(--border)';
  });
  btn.style.background = 'rgba(255,107,0,0.12)';
  btn.style.border = '2px solid var(--saffron)';
  const nb = document.getElementById('s1-next');
  if (nb) nb.disabled = false;
}

function doneStep1() {
  if (!pickedLang) return;
  currentLang = pickedLang;
  obData.lang = pickedLang;
  showStep2();
}

// STEP 2 — Profile
function showStep2() {
  obStep = 2; setProgress(45);
  const lang = currentLang;
  const body = document.getElementById('ob-body');
  body.innerHTML = `
    <div style="margin-bottom:20px">
      <div style="font-size:20px;font-weight:900;margin-bottom:4px">${lang==='en'?'Tell me about yourself':'Apne baare mein bataiye'}</div>
      <div style="font-size:12px;color:var(--text3)">${lang==='en'?'Helps Chitti personalise for you':'Chitti aapke liye personalise karega'}</div>
    </div>

    <div class="ob-card" style="margin-bottom:12px">
      <div class="ob-label">${lang==='en'?'What do you do?':'Aap kya karte hain?'} *</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:0" id="prof-grid">
        ${[
          {v:'Salaried',e:'💼',en:'Salaried',hi:'Naukri'},
          {v:'Business',e:'🏪',en:'Business',hi:'Business'},

function checkStep2() {

function getLocation() {
  const btn = document.querySelector('button[onclick="getLocation()"]');
  if (!navigator.geolocation) {
    const el = document.getElementById('s2-city');
    if (el) { el.focus(); el.placeholder = 'Type your city name'; }
    return;
  }
  if (btn) { btn.textContent = '⏳'; btn.style.opacity = '0.7'; }
  // Try GPS first, fall back to IP location
  const tryIPLocation = async () => {
    try {
      const r = await fetch('https://ipapi.co/json/');
      const d = await r.json();
      const city = d.city || d.region || '';
      const el = document.getElementById('s2-city');
      if (el && city) {
        el.value = city + (d.region_code ? ', ' + d.country_name : '');
        el.style.borderColor = 'var(--green)';
      }
      if (btn) { btn.textContent = '✅'; btn.style.opacity = '1'; }
    } catch(e2) {
      if (btn) { btn.textContent = '📍'; btn.style.opacity = '1'; }
      const el = document.getElementById('s2-city');
      if (el) { el.focus(); el.placeholder = 'Type your city name'; }
    }
  };

  navigator.geolocation.getCurrentPosition(
    async pos => {
      try {
        const r = await fetch('https://nominatim.openstreetmap.org/reverse?lat=' + pos.coords.latitude + '&lon=' + pos.coords.longitude + '&format=json&accept-language=en');
        const d = await r.json();
        const city = d.address.city || d.address.town || d.address.village || d.address.county || '';
        const el = document.getElementById('s2-city');
        if (el && city) {
          el.value = city + (d.address.state ? ', ' + d.address.state : '');
          el.style.borderColor = 'var(--green)';
          if (btn) { btn.textContent = '✅'; btn.style.opacity = '1'; }
        } else { await tryIPLocation(); }
      } catch(e) { await tryIPLocation(); }
    },
    async err => { await tryIPLocation(); },
    { timeout: 8000, maximumAge: 60000, enableHighAccuracy: false }
  );
}

// speakForce — always works, no voiceEnabled check, direct user tap
async function speakForce(text) {
  if (!text || !text.trim()) return;
  window.speechSynthesis && window.speechSynthesis.cancel();
  // Try Sarvam -- Male Aditya, world class Indian voice
  try {
    const clean = text.replace(/[\u{1F000}-\u{1FFFF}]/gu,'').replace(/[\u2600-\u27BF]/g,'').trim().slice(0,500);
    if (clean) {
      const lc = {hi:'hi-IN',en:'en-IN',mr:'mr-IN',te:'te-IN',ta:'ta-IN',kn:'kn-IN',bn:'bn-IN',gu:'gu-IN'};
      const res = await fetch('https://api.sarvam.ai/text-to-speech', {
        method:'POST',
        headers:{'api-subscription-key':'sk_v57r3zb4_VdkuYXHLwgThZRXwLokigP1O','Content-Type':'application/json'},
        body:JSON.stringify({inputs:[clean],target_language_code:lc[currentLang]||'en-IN',speaker:'aditi',pitch:0,pace:0.9,loudness:1.3,speech_sample_rate:22050,enable_preprocessing:true,model:'bulbul:v1'})
      });
      if (res.ok) {
        const d = await res.json();
        if (d.audios && d.audios[0]) { new Audio('data:audio/wav;base64,'+d.audios[0]).play(); return; }
      }
    }
  } catch(e) {}
  // Browser TTS fallback
  if (!('speechSynthesis' in window)) return;
  const go = () => {
    const u = new SpeechSynthesisUtterance(text.slice(0,300));
    const vv = window.speechSynthesis.getVoices();
    const lc = {hi:'hi',en:'en',mr:'mr',te:'te',ta:'ta',kn:'kn',bn:'bn',gu:'gu'};
    const v = vv.find(x=>x.lang.startsWith(lc[currentLang]||'en'))||vv.find(x=>x.lang.startsWith('en'));
    if (v) u.voice=v; u.lang=v?v.lang:'en-IN'; u.rate=0.85; u.volume=1.0;
    window.speechSynthesis.speak(u);
  };
  const vv = window.speechSynthesis.getVoices();
  if (vv.length) go(); else { window.speechSynthesis.onvoiceschanged=go; setTimeout(go,500); }
}

// Engine Factory — detects topic for on-demand engines
function detectSpecialistTopic(message) {
  const patterns = [
    { pattern: /learn.*|teach.*|how to.*|help me.*|explain.*|understand.*/i, extract: (m) => {
      const match = m.match(/(?:learn|teach|how to|help me with|explain|understand)\s+(.{5,40})/i);
      return match ? match[1].trim() : null;
    }},
  ];
  for (const p of patterns) {
    if (p.pattern.test(message)) {
      const topic = p.extract(message);
      if (topic) return topic;
    }
  }
  return null;
}

function getAgentSystemPrompt(agentCode, profile, message='') {
  if (agentCode === 'FACTORY') {
    const topic = detectSpecialistTopic(message) || 'this topic';
    return engineFactory(topic, profile);
  }
  if (agentCode === 'PA' || !AGENTS[agentCode]) {
    return buildSystemPrompt();
  }
  return AGENTS[agentCode].prompt(profile);
}

async function askChitti(msg) {
  if (isWaiting) return;
  isWaiting = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('chitti-status').textContent = 'typing...';
  addTyping();

  try {
    const res = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer sk-372a74292a8c407abaaf673aab58c3f1'},
      body: JSON.stringify({
        model: 'deepseek-chat',
        max_tokens: 200,
        messages: [
          {role:'system', content: buildSystemPrompt()},
          ...history.slice(-8),
          {role:'user', content: msg}
        ]
      })
    });
    removeTyping();
    if (res.ok) {
      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || '';
      if (reply) {
        history.push({role:'user',content:msg});
        history.push({role:'assistant',content:reply});
        if (history.length > 20) history = history.slice(-20);
        addChittiMsg(reply);
      }
    } else {
      addChittiMsg(currentLang==='en'?'Sorry, something went wrong. Please try again.':'Kuch problem aayi. Dobara try karein.');
    }
  } catch(e) {
    removeTyping();
    addChittiMsg(currentLang==='en'?'Sorry, something went wrong. Please try again.':'Kuch problem aayi. Dobara try karein.');
  }

  isWaiting = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('chitti-status').textContent = '● Online';
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || isWaiting) return;
  input.value = ''; autoResize(input);
  addUserMsg(text);
  await askChitti(text);
}

function handleKey(e) { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }

function toggleVoice() {
  voiceEnabled = !voiceEnabled;
  const btn = document.getElementById('voice-btn');
  btn.textContent = voiceEnabled ? '🔊' : '🔇';
  btn.style.color = voiceEnabled ? 'var(--saffron)' : 'var(--text2)';
  if (voiceEnabled) speakForce(currentLang==='en'?'Voice is on.':'Awaaz on hai.');
}

function viewPageFeedback() {

}

function resetAll() {

}

function giveFeedback() {
  const text = prompt(currentLang==='en'?'What can be improved? (or press Cancel)':'Kya behtar ho sakta hai?');
  if (text && text.trim()) {
    const log = JSON.parse(localStorage.getItem('chitti_feedback_v48')||'[]');
    log.push({ts:new Date().toISOString(),feedback:text,user:MASTER?.nick});
    localStorage.setItem('chitti_feedback_v48', JSON.stringify(log));
    addChittiMsg(currentLang==='en'?'Thank you for the feedback! I will improve.':'Shukriya feedback ke liye! Main improve karunga.');
  }
}

// MIC
function toggleMic() {
  if (isListening) { if (recognition) recognition.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { 
    const mb = document.getElementById('mic-btn');
    mb.classList.add('error');
    setTimeout(()=>mb.classList.remove('error'), 2000);
    addChittiMsg(currentLang==='en'?'Voice not supported on this browser — please type.':'Yeh browser voice support nahi karta — please type karein.');
    return; 
  }
  recognition = new SR();
  recognition.lang = currentLang === 'en' ? 'en-IN' : currentLang + '-IN';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.onstart = () => { 
    isListening=true; 
    const mb = document.getElementById('mic-btn');
    mb.classList.remove('error');
    mb.classList.add('listening');
    mb.textContent = '🔴';
    document.getElementById('chitti-status').textContent = currentLang==='en'?'Listening...':'Sun raha hoon...';
  };
  recognition.onresult = e => {
    const t = Array.from(e.results).map(r=>r[0].transcript).join('');
    document.getElementById('msg-input').value = t;
    autoResize(document.getElementById('msg-input'));
    // Auto-send when final result
    if (e.results[e.results.length-1].isFinal) {
      recognition.stop();
      setTimeout(() => sendMessage(), 300);
    }
  };
  recognition.onend = () => { 
    isListening=false; 
    const mb = document.getElementById('mic-btn');
    mb.classList.remove('listening');
    mb.textContent = '🎤';
    document.getElementById('chitti-status').textContent = '● Online';
  };
  recognition.onerror = (e) => { 
    isListening=false; 
    const mb = document.getElementById('mic-btn');
    mb.classList.remove('listening');
    mb.classList.add('error');
    mb.textContent = '🎤';
    document.getElementById('chitti-status').textContent = '● Online';
    setTimeout(()=>mb.classList.remove('error'), 2000);
  };
  recognition.start();
}
