name        = "chitti-shares-api"
root        = "chitti-shares/backend"
runtime     = "python-3.11"
start       = "uvicorn main:app --host 0.0.0.0 --port $PORT"
health      = "/health"
scope       = "Technical + Fundamental + ETF + MF (FastAPI, async)"
config      = "chitti-shares/backend/railway.json"

