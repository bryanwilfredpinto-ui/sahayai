# Railway monorepo manifest — Sahay AI
# ------------------------------------------------------------------
# This file documents the 9 services that ship to Railway from this
# monorepo. Railway does not parse a single repo-root TOML to spawn
# multiple services automatically; each service is created once in
# the Railway dashboard pointing at the rootDirectory listed below,
# and Railway then reads the per-service railway.json living inside
# that directory on every push to `main`.
#
# Keep this file in sync with chitti-founder/backend/main.py:
#   - _DEFAULT_ENDPOINTS (self-ping list, line ~114)
#   - _FEEDBACK_API_PER_PAGE (feedback router map, line ~632)
# and with the URL constants in every chitti_*.html at repo root.
#
# Region note: Sire requested ap-south-1 (AWS Mumbai). Railway does
# NOT offer a Mumbai region as of 2026-05-19. The closest available
# Railway region to India is `asia-southeast1` (Singapore). Set this
# per-service in the Railway dashboard - Settings - Region.
#
# Restart policy: ALWAYS for every service (set in each
# backend/railway.json deploy block).
#
# Project: sahayai (Railway project name - create once)
# GitHub:  bryanwilfredpinto-ui/sahayai
# Branch:  main (auto-deploy on push)

project_name   = "sahayai"
github_repo    = "bryanwilfredpinto-ui/sahayai"
github_branch  = "main"
region_default = "asia-southeast1"   # closest to ap-south-1 (Mumbai unavailable on Railway)
restart_policy = "always"

# ------------------------------------------------------------------
# Services
# ------------------------------------------------------------------
# Each entry tells the operator: what to call the service in Railway,
# which rootDirectory to point it at, which language runtime to pick
# (Nixpacks auto-detects from requirements.txt), and which scope of
# work the service owns.

[[services]]
name        = "chitti-vaani-api"
root        = "chitti-vaani/backend"
runtime     = "python-3.11"
start       = "gunicorn main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
health      = "/health"
scope       = "Vaani - sole user interface, intent router, family-cascade emergency, gmail, admin products, feedback ingestion"
config      = "chitti-vaani/backend/railway.json"

