# Render Blueprint for Chitti 4-Wheeler
# -----------------------------------------------------------------
# Turso embedded-replica pattern (SAHAYAI_MASTER §2 row 2 — one DB per
# Chitti). Local SQLite file at /tmp/chitti_4wheeler.db; bg sync loop
# every 60 s. Render free tier wipes /tmp on each deploy — we re-sync
# from Turso on boot.
#
# Before first deploy:
#   1. turso db create chitti-4wheeler --group default
#   2. turso db show chitti-4wheeler --url
#   3. turso db tokens create chitti-4wheeler
#   4. Compose: libsql://<host>?authToken=<token>
#   5. Paste into DATABASE_URL in the Render dashboard.

services:
  - type: web
    name: chitti-4wheeler-api
    runtime: python
    plan: free
    rootDir: chitti-4wheeler/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10

      # ── Turso (one DB per Chitti) ──
      - key: DATABASE_URL
        sync: false
      - key: LIBSQL_REPLICA_PATH
        value: /tmp/chitti_4wheeler.db

      # ── DeepSeek ── sole LLM provider
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_URL
        value: https://api.deepseek.com/chat/completions
      - key: DEEPSEEK_MAX_TOKENS
        value: "700"
      - key: DEEPSEEK_TEMPERATURE
        value: "0.2"

      # ── CORS / self-URL ──
      - key: ALLOWED_ORIGINS
        value: "https://sahayai.in,https://www.sahayai.in"
      - key: BACKEND_URL
        value: https://chitti-4wheeler-api.onrender.com
