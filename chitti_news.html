<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <title>Chitti News — Your state. Your language. Your news.</title>
  <meta name="description" content="State-aware, multi-language Indian news aggregator. Voice-first. Free. Built for blind, deaf, mute, illiterate users." />
  <meta name="theme-color" content="#FF9933" />
  <!-- Cache-busting: GitHub Pages defaults to long cache TTLs; without
       these no-cache headers Sire's browser keeps showing a stale build
       even after main is updated. Per Sire 2026-06-02 — caught the page
       showing a NaN-id template the new code does not contain. The
       chitti-build meta value below is rewritten by a pre-commit
       hook so the visible build tag always matches the latest commit. -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="chitti-build" content="9fb2708-2026-06-02" />

  <!--
    Clean rebuild 2026-06-02 per Sire's instruction "follow CTO.md,
    SKILLS, scope". Replaces the 1585-line legacy chitti_news.html.

    Source-of-truth contracts honoured here:
      • chitti-cto/CTO.md §1 — Saffron / Navy / Green palette only
      • chitti-cto/CTO.md §2 — 5-element strip on every response box
      • chitti-cto/CTO.md §5 — one language selector per page
      • chitti-cto/CTO.md §6 — technical terms stay in English (SEBI etc.)
      • chitti-news/SKILLS.md #12 — strip exactly: 🔊 / 🤖 / 👍 / 👎 / ✏️🎙️
      • chitti-news/SOP.md — fact-check verdict on every card; 2-source rule
      • SAHAYAI_MASTER.md §7 — 4-user accessibility contract; ISL panel
      • SAHAYAI_MASTER.md §2d — Feature Discovery (substrate auto-injects)

    Layout (collapsed default):
       [meta]
       [headline]
       [🔊 Read] [🤖 Chitti] [👍] [👎] [✏️ Feedback]
       Tap to read full news
       [thumb]
    Tap card → expand to summary + sub-panels (Take / Explain / Factcheck).
    Speaker on EVERY box reads the entire news (a.content || a.summary).
  -->

  <style>
    /* ── §1 LOCKED PALETTE ───────────────────────────────────────── */
    :root {
      --saffron: #FF9933;
      --navy:    #000080;
      --green:   #138808;
      --canvas:  #FFFFFF;
      --surface: #F9FAFB;
      --rule:    #E5E7EB;
      --text:    #1A1A1A;
      --muted:   #6B7280;
      --warn:    #B45309;
      --red:     #B91C1C;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--canvas);
      min-height: 100vh;
    }
    a { color: var(--navy); }
    button { font: inherit; }

    /* ── Sticky legal disclaimer ─────────────────────────────────── */
    .legal-bar {
      position: sticky; top: 0; z-index: 200;
      background: var(--navy); color: #fff;
      font-size: 12px; padding: 6px 12px; text-align: center;
      letter-spacing: .02em;
    }
    .legal-bar strong { color: var(--saffron); }

    /* ── Header ──────────────────────────────────────────────────── */
    header { padding: 14px 16px 8px; border-bottom: 1px solid var(--rule); background: var(--canvas); }
    .brand-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 8px;
      background: linear-gradient(135deg, var(--saffron), var(--green));
      color: #fff; font-weight: 800; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .brand-name { font-weight: 800; font-size: 20px; color: var(--navy); letter-spacing: -.01em; }
    .brand-tag  { color: var(--muted); font-size: 13px; margin-top: 2px; }

    /* ── §5 ONE language selector + state/category filters ──────── */
    .filter-row {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid var(--rule);
      background: var(--surface);
      position: sticky; top: 28px; z-index: 100;
    }
    .filter-row label {
      font-size: 11px; color: var(--muted); font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .filter-row select, .filter-row button {
      padding: 7px 10px; border: 1px solid var(--rule); border-radius: 8px;
      background: var(--canvas); color: var(--text); font-weight: 600;
      cursor: pointer; font-size: 13px;
    }
    .filter-row .refresh-btn {
      background: var(--saffron); color: #fff; border-color: var(--saffron);
    }
    .filter-row .refresh-btn:hover { filter: brightness(.95); }

    /* ── Main feed ───────────────────────────────────────────────── */
    main {
      max-width: 720px; margin: 0 auto;
      padding: 16px 12px 80px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .status-card {
      padding: 16px; border: 1px solid var(--rule); border-radius: 12px;
      background: var(--surface); color: var(--text); text-align: center;
    }

    /* ── Article card — collapsed by default ────────────────────── */
    .art-card {
      background: var(--canvas);
      border: 1px solid var(--rule); border-left: 4px solid var(--saffron);
      border-radius: 12px; padding: 14px;
      display: grid; grid-template-columns: 1fr 90px; gap: 12px;
      cursor: pointer; transition: box-shadow .2s, border-color .2s;
    }
    .art-card:hover { box-shadow: 0 6px 18px rgba(0,0,0,.06); }
    .art-card.expanded { cursor: default; border-left-color: var(--green); }
    .art-meta {
      font-size: 11px; color: var(--muted); font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em;
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px;
    }
    .art-meta .src { color: var(--navy); }
    .art-title {
      font-weight: 800; font-size: 16px; line-height: 1.35;
      color: var(--text); margin: 0 0 8px; word-break: break-word;
    }
    .art-hint {
      font-size: 11px; color: var(--muted); font-style: italic; margin: 4px 0 0;
    }
    .art-card.expanded .art-hint { display: none; }

    /* ── §2 CANONICAL 5-ICON STRIP — every box ──────────────────── */
    .art-strip {
      display: flex; gap: 6px; flex-wrap: wrap;
      padding-top: 8px; margin-top: 6px;
      border-top: 1px dashed var(--rule);
    }
    .art-strip button {
      min-width: 44px; min-height: 44px; padding: 0 10px;
      border: 1px solid var(--rule); border-radius: 999px;
      background: var(--canvas); color: var(--navy);
      font-size: 16px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px; line-height: 1;
    }
    .art-strip button:hover { border-color: var(--saffron); background: #fff8f0; color: var(--saffron); }
    .art-strip button:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
    .art-strip button.primary { background: var(--saffron); color: #fff; border-color: var(--saffron); }
    .art-strip button.primary:hover { filter: brightness(.95); color: #fff; }
    .art-strip button.live { background: var(--green); color: #fff; border-color: var(--green); }
    .art-strip .lbl {
      font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em;
    }

    /* ── Expanded body — tap card to reveal ─────────────────────── */
    .art-body { display: none; margin-top: 12px; }
    .art-card.expanded .art-body { display: block; }
    .art-summary { font-size: 14px; line-height: 1.55; color: var(--text); margin-bottom: 12px; }
    .art-fullbody {
      font-size: 14px; line-height: 1.65; color: var(--text);
      margin: 0 0 12px;
      padding: 12px;
      background: var(--surface); border-left: 3px solid var(--saffron);
      border-radius: 6px;
      white-space: pre-wrap;
    }
    .art-fullbody-status { color: var(--muted); font-style: italic; font-size: 13px; }
    .art-fullbody.summary-only-flag::before {
      content: "ℹ︎ Summary only — the publisher does not share the full body.";
      display: block; color: var(--warn); font-size: 12px; font-weight: 600;
      margin-bottom: 8px;
    }
    .art-fullbody .headline-only {
      color: var(--text); font-size: 13px; line-height: 1.5;
      padding: 4px 0;
    }
    /* The 5-icon strip in the headline is the canonical action surface.
       Sub-actions (Take / Fact check / Share) used to appear here as a
       button row — removed 2026-06-02 per Sire ("MSN simple — nothing
       to reinvent"). Take / Explain / Fact check now live inside the
       sub-host panels which the 🤖 Chitti icon expands; Share moves
       to the strip via long-press on the speaker if we ever need it. */
    .art-sub-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .art-sub-actions button {
      padding: 6px 10px; border: 1px solid var(--rule); border-radius: 8px;
      background: var(--canvas); color: var(--text); font-size: 12px; cursor: pointer;
    }
    .art-sub-actions button:hover { background: var(--surface); border-color: var(--navy); }
    .art-source-link {
      margin-top: 10px; font-size: 13px;
    }
    .art-source-link a { color: var(--navy); text-decoration: underline; font-weight: 600; }

    /* ── Sub-host panels (Chitti's Take / Explain / Factcheck) ──── */
    .art-sub-host {
      margin-top: 10px; padding: 10px;
      border: 1px solid var(--rule); border-radius: 8px;
      background: var(--surface);
    }
    .art-sub-host:empty { display: none; }
    .art-sub-host h4 {
      margin: 0 0 6px; font-size: 12px; text-transform: uppercase;
      letter-spacing: .04em; color: var(--navy);
    }
    .art-sub-host ul { margin: 0; padding-left: 18px; }

    /* ── Thumbnail ──────────────────────────────────────────────── */
    .art-thumb {
      background: var(--surface); border-radius: 8px;
      background-size: cover; background-position: center;
      min-height: 80px; border: 1px solid var(--rule);
    }
    .art-thumb.placeholder {
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: var(--saffron); opacity: .7;
    }

    /* ── Fact-check badge ────────────────────────────────────────── */
    .fc-badge {
      display: inline-block; padding: 1px 6px; border-radius: 4px;
      font-size: 10px; font-weight: 800;
    }
    .fc-verified  { background: rgba(19,136,8,.12); color: var(--green); }
    .fc-partial   { background: rgba(255,153,51,.12); color: var(--warn); }
    .fc-disputed  { background: rgba(185,28,28,.12); color: var(--red); }
    .fc-unchecked,
    .fc-unverified { background: rgba(107,114,128,.12); color: var(--muted); }

    /* §2 — Suppress the substrate-injected per-box feedback bar on
       art-cards (the in-card .art-strip above IS the canonical 5-
       element strip for chitti-news, per SKILLS.md #12). The substrate
       continues to inject on every other Chitti page + on the sub-host
       panels (take/explain/fact) inside art-cards when those load. */
    .art-card + .chitti-fb-box-bar { display: none !important; }

    /* ── 375px-first responsive ─────────────────────────────────── */
    @media (max-width: 420px) {
      .art-card { grid-template-columns: 1fr; }
      .art-card .art-thumb { display: none; }
      main { padding: 10px 8px 80px; }
    }
  </style>
</head>
<body>

<!-- Sticky legal disclaimer — Chitti News two-source rule + aggregation
     honesty. The small build-tag at the right edge reads from the
     <meta name="chitti-build"> tag above so it ALWAYS reflects what is
     actually deployed. Per Sire 2026-06-02 — caught the hardcoded tag
     drifting from real commit and used it to debug stale deploys. -->
<div class="legal-bar" role="status" aria-live="polite">
  📰 <strong>Chitti News aggregates public RSS</strong> — verdicts cross-reference ≥2 sources.
  <span id="build-tag" style="opacity:.6; font-size:10px; margin-left:8px;">build …</span>
</div>
<script>
  // Sync the visible build tag from the meta tag at parse time.
  (function(){
    var m = document.querySelector('meta[name="chitti-build"]');
    var v = (m && m.content) || 'unknown';
    var el = document.getElementById('build-tag');
    if (el) el.textContent = 'build ' + v;
  })();
</script>

<!-- ╔══════════════════════════════════════════════════════════════╗
     ║   Shared substrate — chitti_a11y.js auto-injects:           ║
     ║     feedback-widget.js, chitti_isl.js, chitti_lang.js,      ║
     ║     chitti_features.js, chitti_disability_profile.js        ║
     ║   Every Chitti page that loads chitti_a11y.js inherits      ║
     ║   the 5 accessibility gates from QUALITY_STATUS.md §1a.     ║
     ╚══════════════════════════════════════════════════════════════╝ -->
<script src="chitti_a11y.js" defer></script>

<script>
"use strict";

// ── Configuration ─────────────────────────────────────────────────
const API_BASE = (function(){
  try { return localStorage.getItem('chitti_news_api_base')
            || 'https://chitti-news-api-production.up.railway.app'; }
  catch (e) { return 'https://chitti-news-api-production.up.railway.app'; }
})();

const STORAGE = {
  state: 'chitti_news_state',
  lang:  'chitti_news_lang',
  token: 'chitti_news_user_token',
  cat:   'chitti_news_category',
};

// Per-device user token for save/cancel folders (UUID, never reused
// across devices — privacy by default per Postman Principle).
function userToken() {
  try {
    let t = localStorage.getItem(STORAGE.token);
    if (!t) {
      t = (crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : ('u-' + Math.random().toString(36).slice(2) + Date.now().toString(36));
      localStorage.setItem(STORAGE.token, t);
    }
    return t;
  } catch (e) { return 'anon-' + Date.now(); }
}

// Article cache — keyed by id. The full body (a.content) lives here
// only; never in DOM until the user expands the card.
const ARTICLES = Object.create(null);

// ── Filter state ──────────────────────────────────────────────────
function getFilter() {
  return {
    state:  localStorage.getItem(STORAGE.state) || 'india',
    lang:   localStorage.getItem(STORAGE.lang)  || 'en',
    cat:    localStorage.getItem(STORAGE.cat)   || 'national',
  };
}
function setFilter(f) {
  try {
    if (f.state) localStorage.setItem(STORAGE.state, f.state);
    if (f.lang)  localStorage.setItem(STORAGE.lang,  f.lang);
    if (f.cat)   localStorage.setItem(STORAGE.cat,   f.cat);
  } catch (e) {}
}
function onFilterChange() {
  const f = {
    state: document.getElementById('pick-state').value,
    lang:  document.getElementById('pick-lang').value,
    cat:   document.getElementById('pick-cat').value,
  };
  setFilter(f);
  document.documentElement.lang = f.lang;
  if (window.Chitti && Chitti.a11y && Chitti.a11y.setLanguage) {
    try { Chitti.a11y.setLanguage(f.lang, { manual: true, source: 'news-filter' }); }
    catch (e) {}
  }
  loadFeed(true);
}

// Hydrate pickers from localStorage on load.
function hydratePickers() {
  const f = getFilter();
  document.getElementById('pick-state').value = f.state;
  document.getElementById('pick-lang').value  = f.lang;
  document.getElementById('pick-cat').value   = f.cat;
  document.documentElement.lang = f.lang;
}

// ── API helpers ───────────────────────────────────────────────────
async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign(
    { 'X-User-Token': userToken() }, opts.headers || {}
  );
  const r = await fetch(API_BASE + path, opts);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ── Rendering ─────────────────────────────────────────────────────
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function timeAgo(iso) {
  if (!iso) return '';
  const t = Date.parse(iso); if (!t) return '';
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1)    return 'now';
  if (m < 60)   return m + ' min ago';
  if (m < 1440) return Math.floor(m/60) + ' hr ago';
  return Math.floor(m/1440) + ' d ago';
}
function fcBadge(fc) {
  if (!fc) return '';
  const verdict = fc.verdict || 'unchecked';
  const cls = 'fc-' + verdict;
  const label = fc.word || verdict.toUpperCase();
  const sym = fc.symbol || '⏳';
  return '<span class="fc-badge ' + cls + '" title="Fact check: ' + esc(label)
       + '">' + sym + ' ' + esc(label) + '</span>';
}

// CANONICAL 5-ICON STRIP — per chitti-news/SKILLS.md #12 +
// chitti-cto/CTO.md §2 — in this exact order on every box.
// Icons only (MSN-style); aria-label carries the action description for
// screen readers. Sire 2026-06-02: "nothing to reinvent the wheels".
function stripHtml(boxId, articleId) {
  return ''
    + '<div class="art-strip" role="group" aria-label="Read, explain, react, give feedback">'
    +   '<button class="primary" type="button" aria-label="Read entire news aloud"'
    +     ' onclick="event.stopPropagation(); speakArticle(' + articleId + ')">🔊</button>'
    +   '<button type="button" aria-label="Ask Chitti to explain simply"'
    +     ' onclick="event.stopPropagation(); openExplain(' + articleId + ')">🤖</button>'
    +   '<button type="button" aria-label="Helpful"'
    +     ' onclick="event.stopPropagation(); saveArticle(' + articleId + ', \'saved\')">👍</button>'
    +   '<button type="button" aria-label="Wrong"'
    +     ' onclick="event.stopPropagation(); saveArticle(' + articleId + ', \'cancelled\')">👎</button>'
    +   '<button type="button" aria-label="Open feedback page"'
    +     ' onclick="event.stopPropagation(); openFeedback(\'' + boxId + '\')">✏️</button>'
    + '</div>';
}

function articleCardHtml(a) {
  ARTICLES[a.id] = a;
  const boxId = 'art-' + a.id;
  const meta = [
    a.is_breaking ? '<span class="src" style="color:var(--red)">BREAKING</span>' : '',
    fcBadge(a.factcheck),
    '<span class="src">' + esc(a.source_name || a.source_slug || 'Source') + '</span>',
    timeAgo(a.published_at || a.fetched_at),
  ].filter(Boolean).join(' · ');

  const thumb = a.image_url
    ? '<div class="art-thumb" style="background-image:url(\'' + esc(a.image_url) + '\')" aria-hidden="true"></div>'
    : '<div class="art-thumb placeholder" aria-hidden="true">📰</div>';

  return ''
    + '<article class="art-card" id="' + boxId + '" data-id="' + a.id + '"'
    +   ' data-chitti-response data-chitti-speak-handler="speakArticle"'
    +   ' data-chitti-speak-id="' + a.id + '"'
    +   ' data-chitti-section="' + esc(a.title || 'News article') + '"'
    +   ' role="button" tabindex="0"'
    +   ' aria-label="Tap to hear the entire news"'
    +   ' onclick="onCardTap(' + a.id + ')"'
    +   ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();onCardTap(' + a.id + ')}">'
    +   '<div>'
    +     '<div class="art-meta">' + meta + '</div>'
    +     '<h3 class="art-title">' + esc(a.title || '') + '</h3>'
    +     stripHtml(boxId, a.id)
    +     '<div class="art-hint">Tap card to hear the entire news — Chitti stays on this page</div>'
    +     '<div class="art-body">'
    +       '<div class="art-summary" onclick="event.stopPropagation()">' + esc(a.summary || '(No summary available from this source.)') + '</div>'
    +       '<div class="art-fullbody" id="fullbody-' + a.id + '" onclick="event.stopPropagation()" aria-live="polite">'
    +         '<div class="art-fullbody-status">Tap to fetch the full news…</div>'
    +       '</div>'
    +       '<div class="art-sub-host" id="take-' + a.id + '" data-chitti-response'
    +         ' data-chitti-section="Chitti\'s Take · ' + esc(a.title || '') + '"></div>'
    +       '<div class="art-sub-host" id="explain-' + a.id + '" data-chitti-response'
    +         ' data-chitti-section="Explain simply · ' + esc(a.title || '') + '"></div>'
    +       '<div class="art-sub-host" id="fact-' + a.id + '" data-chitti-response'
    +         ' data-chitti-section="Fact check · ' + esc(a.title || '') + '"></div>'
    +     '</div>'
    +   '</div>'
    +   thumb
    + '</article>';
}

function renderFeed(items, meta) {
  const root = document.getElementById('feed-root');
  if (!items || items.length === 0) {
    root.innerHTML = '<div class="status-card">'
      + '<strong>No stories yet.</strong><br>'
      + esc(meta && meta.speak_en
            ? meta.speak_en
            : 'Tap Refresh in a minute to try again.')
      + '</div>';
    return;
  }
  root.innerHTML = items.map(articleCardHtml).join('');
}

// ── Core actions ──────────────────────────────────────────────────
// Sire 2026-06-02 — Tap a card → expand AND speak the entire news.
// Blind users get the full body audibly on the first tap; no
// navigation to mint/TOI/Hindu. The 🔊 button in the 5-icon strip
// remains an explicit speak (for retap-to-re-read).
// Already-expanded → tap collapses + cancels any in-flight speech.
// Tracks which article is "active" for the speaker. Updated on every
// card tap. Any in-flight async path (lazy /body fetch, deferred speak)
// checks against this before calling speak() — so that when the user
// taps a new card before the previous one's fetch resolved, the old
// fetch's spoken result doesn't barge in over the new card.
// Sire 2026-06-02: "if I click on another news, the speaker will still
// continue to speak to the earlier message".
let _activeArticleId = null;

function onCardTap(id) {
  const el = document.getElementById('art-' + id);
  if (!el) return;
  const wasExpanded = el.classList.contains('expanded');

  // Collapse any OTHER expanded card — MSN-style, one card open at a time.
  document.querySelectorAll('.art-card.expanded').forEach((other) => {
    if (other !== el) other.classList.remove('expanded');
  });

  // ALWAYS cancel the current speaker on any tap. Whether we're
  // expanding a new card or collapsing the current one, the user's
  // gesture signals "stop the old stream."
  if (window.speechSynthesis) {
    try { speechSynthesis.cancel(); } catch (e) {}
  }

  if (wasExpanded) {
    el.classList.remove('expanded');
    _activeArticleId = null;
  } else {
    el.classList.add('expanded');
    _activeArticleId = id;
    ensureFullbodyDisplayed(id);
    speakArticle(id);
  }
}

// Lazily fetch + display the full body of an article in the .art-fullbody
// container of its card. Idempotent: marks itself loaded so re-tapping
// doesn't refetch.
async function ensureFullbodyDisplayed(id) {
  const host = document.getElementById('fullbody-' + id);
  if (!host || host.dataset.loaded === '1') return;
  host.dataset.loaded = '1';
  const a = ARTICLES[id];
  const cachedBody = (a && a.content) || '';
  const summaryText = (a && a.summary) || '';

  // Sire 2026-06-02 — if the data we already have is just a short blurb
  // (image caption, headline-only article), don't pretend a fetch will
  // help. Show the honest "headline only" panel immediately. Saves a
  // round trip and stops the user from waiting on a useless "Loading…"
  const cachedWords = cachedBody.replace(/<[^>]+>/g, ' ').trim().split(/\s+/).filter(Boolean).length;
  const summaryWords = summaryText.replace(/<[^>]+>/g, ' ').trim().split(/\s+/).filter(Boolean).length;
  const isHeadlineOnly = cachedWords < 15 && summaryWords < 15;

  if (cachedWords >= 60) {
    // Rich body already in cache — render instantly.
    host.textContent = cachedBody.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    return;
  }

  if (isHeadlineOnly) {
    // No point hitting /body — backend has nothing to extract from.
    host.classList.add('summary-only-flag');
    host.innerHTML = '<div class="headline-only">'
                   + 'This is a headline-only article. The publisher (' + (a && a.source_name ? escAttr(a.source_name) : 'source')
                   + ') has not provided a body; Chitti has nothing more to read. Move on to the next story.'
                   + '</div>';
    return;
  }

  host.innerHTML = '<div class="art-fullbody-status">Loading full news…</div>';
  let body = cachedBody;
  let summaryOnly = false;
  try {
    const data = await api('/api/news/article/' + id + '/body');
    if (data && data.body && data.body.split(/\s+/).length >= 60) {
      body = data.body;
      if (a) a.content = body;
    } else {
      body = summaryText || body;
      summaryOnly = true;
    }
  } catch (e) {
    body = summaryText || body;
    summaryOnly = true;
  }
  const plain = String(body).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  if (summaryOnly) host.classList.add('summary-only-flag');
  host.textContent = plain || '(No body available.)';
  if (summaryOnly) {
    host.classList.remove('summary-only-flag');
    host.classList.add('summary-only-flag');
  }
}

function escAttr(s) {
  return String(s == null ? '' : s).replace(/"/g, '&quot;').replace(/&/g, '&amp;');
}
// Kept for backwards-compat with substrate hooks that might still call
// toggleCard(id) (e.g., older feedback-widget.js builds).
function toggleCard(id) { onCardTap(id); }

// 🔊 — reads the ENTIRE news. Per SKILLS.md feature #10 + SOP.md
// Quality Standard. Two-stage:
//   1. If a.content (RSS content:encoded) is present and substantive,
//      speak that immediately.
//   2. Otherwise (most regional sources only ship a short summary),
//      announce "Loading full news…" and lazy-fetch from
//      GET /api/news/article/<id>/body which extracts the body
//      server-side, caches it, and returns plain text. Result is
//      memoized into a.content so subsequent 🔊 clicks are instant.
async function speakArticle(id) {
  const a = ARTICLES[id]; if (!a) return;
  // Stamp this article as active for ANY speak() this function fires.
  // Every async checkpoint below verifies it's still active before
  // committing audio to the shared speechSynthesis pipe.
  _activeArticleId = id;
  const lang = getFilter().lang;
  let body = a.content || '';
  let bodySource = 'rss';
  const hasRichBody = body && body.replace(/<[^>]+>/g, ' ').trim().split(/\s+/).length >= 60;
  // Headline-only article — don't waste 5 seconds saying "One moment"
  // before reading 4 words. Say the title, the honest notice, and stop.
  const summaryWordsForCheck = (a.summary || '').replace(/<[^>]+>/g, ' ').trim().split(/\s+/).filter(Boolean).length;
  const cachedWordsForCheck = body.replace(/<[^>]+>/g, ' ').trim().split(/\s+/).filter(Boolean).length;
  if (cachedWordsForCheck < 15 && summaryWordsForCheck < 15) {
    if (_activeArticleId !== id) return;
    const txt = (a.title || '').trim() + '. '
              + 'This is a headline-only article from ' + (a.source_name || 'this source')
              + '. Chitti has nothing more to read on it.';
    speak(txt, lang);
    return;
  }
  if (!hasRichBody) {
    if (_activeArticleId !== id) return;
    speak('One moment — Chitti is fetching the full news.', lang);
    try {
      const data = await api('/api/news/article/' + id + '/body');
      if (_activeArticleId !== id) return;   // user moved on while we waited
      if (data && data.body && data.body.split(/\s+/).length >= 60) {
        body = data.body;
        bodySource = data.source || 'extracted';
        a.content = body;
      } else {
        body = a.summary || body;
        bodySource = 'summary_only';
      }
    } catch (e) {
      if (_activeArticleId !== id) return;
      body = a.summary || body;
      bodySource = 'summary_only';
    }
  }
  if (_activeArticleId !== id) return;
  const plain = String(body)
    .replace(/<[^>]+>/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 6000);
  // Sire 2026-06-02 — be honest when we only have the summary. Some
  // publishers (NDTV / TOI) block scraping behind Akamai 403s; for those
  // articles the speaker can only read the RSS summary. Don't pretend
  // it's the full news — blind users deserve to know.
  let text;
  if (bodySource === 'summary_only' && plain.split(/\s+/).length < 80) {
    text = (a.title || '').trim() + '. '
         + 'This article is summary only — the publisher does not share the full body. '
         + plain;
  } else {
    text = (a.title || '').trim() + '. ' + plain;
  }
  if (_activeArticleId !== id) return;
  speak(text, lang);
}

function speak(text, lang) {
  // Sire 2026-06-02 — ALWAYS cancel any in-flight speech, regardless of
  // which engine is about to handle the new utterance. The
  // chitti_a11y.js substrate's Chitti.a11y.speak() may queue instead
  // of preempting; calling speechSynthesis.cancel() first guarantees
  // a hard stop on any path. Cert masks this because it stubs the
  // substrate; only the live page exposes it. Fixed by unconditional
  // cancel before delegating.
  if (window.speechSynthesis) {
    try { speechSynthesis.cancel(); } catch (e) {}
  }
  if (window.Chitti && Chitti.a11y && typeof Chitti.a11y.speak === 'function') {
    try { Chitti.a11y.speak(text); return; } catch (e) {}
  }
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = ({ en:'en-IN', hi:'hi-IN', mr:'mr-IN', ta:'ta-IN', te:'te-IN',
              bn:'bn-IN', kn:'kn-IN', ml:'ml-IN', gu:'gu-IN', pa:'pa-IN',
              or:'or-IN', ur:'ur-IN' })[lang] || 'en-IN';
  u.rate = 0.95;
  speechSynthesis.speak(u);
}

// 🤖 — "Explain Simply" — DeepSeek class-5 plain-language summary.
async function openExplain(id) {
  const host = document.getElementById('explain-' + id);
  const card = document.getElementById('art-' + id);
  if (card && !card.classList.contains('expanded')) card.classList.add('expanded');
  if (!host) return;
  host.innerHTML = '<h4>Explain simply…</h4><p>Loading…</p>';
  try {
    const data = await api('/api/news/article/' + id + '/explain?language=' + getFilter().lang);
    const txt = data.explanation || data.text || data.summary || 'No explanation available.';
    host.innerHTML = '<h4>🤖 Chitti explains simply</h4><p>' + esc(txt) + '</p>';
    speak(txt, getFilter().lang);
  } catch (e) {
    host.innerHTML = '<h4>🤖 Chitti explains simply</h4>'
      + '<p style="color:var(--muted)">Explanation unavailable. Try again in a minute.</p>';
  }
}

// ▶ — "Chitti's Take" — 3-bullet AI summary.
async function openTake(id) {
  const host = document.getElementById('take-' + id);
  if (!host) return;
  host.innerHTML = '<h4>Chitti\'s Take…</h4><p>Loading…</p>';
  try {
    const data = await api('/api/news/article/' + id + '/take?language=' + getFilter().lang);
    const bullets = data.bullets || [];
    if (bullets.length === 0) {
      host.innerHTML = '<h4>▶ Chitti\'s Take</h4>'
        + '<p style="color:var(--muted)">No take available yet.</p>';
      return;
    }
    host.innerHTML = '<h4>▶ Chitti\'s Take</h4><ul>'
      + bullets.map(b => '<li>' + esc(b.replace(/^•\s*/, '')) + '</li>').join('')
      + '</ul>';
    speak(bullets.join('. '), getFilter().lang);
  } catch (e) {
    host.innerHTML = '<h4>▶ Chitti\'s Take</h4>'
      + '<p style="color:var(--muted)">Take unavailable. Try again.</p>';
  }
}

// ✓ — Fact-check verdict with cross-source evidence.
async function openFactcheck(id) {
  const host = document.getElementById('fact-' + id);
  if (!host) return;
  host.innerHTML = '<h4>Fact check…</h4><p>Loading…</p>';
  try {
    const data = await api('/api/news/article/' + id + '/factcheck');
    const v = data.verdict || 'unchecked';
    const rationale = data.rationale || data.summary || 'No supporting evidence available.';
    host.innerHTML = '<h4>✓ Fact check — ' + esc(v.toUpperCase()) + '</h4>'
      + '<p>' + esc(rationale) + '</p>';
  } catch (e) {
    host.innerHTML = '<h4>✓ Fact check</h4>'
      + '<p style="color:var(--muted)">Fact check unavailable.</p>';
  }
}

// 👍👎 — Save / Cancel article for For-You + Read Later folders.
async function saveArticle(id, folder) {
  try {
    await api('/api/news/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ article_id: id, folder: folder }),
    });
    const btn = event && event.target && event.target.closest('button');
    if (btn) {
      btn.classList.add('live');
      setTimeout(() => btn.classList.remove('live'), 1200);
    }
  } catch (e) { /* honest stub — feedback still recorded locally */ }
}

// ✏️ — Open the feedback modal. The substrate's chitti-fb-box-bar is
// hidden via CSS but still in the DOM with its event handlers attached.
// Programmatically clicking its 👎 opens the feedback modal — same UX
// every Chitti page provides via the locked per-response widget.
function openFeedback(boxId) {
  const bar = document.querySelector('.chitti-fb-box-bar[data-for-box="' + boxId + '"]');
  if (bar) {
    const down = bar.querySelector('[data-act="down"]');
    if (down) { down.click(); return; }
  }
  // Fallback when substrate hasn't hydrated yet — captures the note
  // locally so user input isn't lost.
  const note = prompt('What can Chitti do better?');
  if (note) {
    try {
      fetch(API_BASE + '/api/feedback/collect', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          page: 'chitti_news', box_id: boxId, kind: 'down', note: note,
        }),
      }).catch(() => {});
    } catch (e) {}
  }
}

// 📲 — Share with a verify-with-source disclaimer baked in.
function shareArticle(id) {
  const a = ARTICLES[id]; if (!a) return;
  const disclaimer = '\n\nVerify on ' + (a.source_name || 'source') + ' before sharing.';
  const text = (a.title || '') + '\n' + (a.link || '') + disclaimer;
  if (navigator.share) {
    navigator.share({ title: a.title, text: text, url: a.link }).catch(() => {});
  } else {
    const wa = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(text);
    window.open(wa, '_blank', 'noopener');
  }
}

// ── Feed loader ───────────────────────────────────────────────────
async function loadFeed(force) {
  const f = getFilter();
  const root = document.getElementById('feed-root');
  root.setAttribute('aria-busy', 'true');
  root.innerHTML = '<div class="status-card">Loading…</div>';
  try {
    let path;
    if (f.cat === 'saved' || f.cat === 'cancelled') {
      const data = await api('/api/news/save?folder=' + f.cat);
      const items = (data.items || []).map(r => r.article);
      renderFeed(items, { speak_en: 'Your ' + f.cat + ' folder.' });
    } else if (f.cat === 'foryou') {
      // For-You is a UX shim — fetch national + filter client-side per
      // localStorage profile. Backend personalisation lives in v1.1.
      const data = await api('/api/news/feed?state=' + f.state
                          + '&language=' + f.lang + '&category=national');
      renderFeed(data.items || [], data);
    } else {
      const data = await api('/api/news/feed?state=' + f.state
                          + '&language=' + f.lang + '&category=' + f.cat);
      renderFeed(data.items || [], data);
    }
  } catch (e) {
    root.innerHTML = '<div class="status-card">'
      + '<strong>Backend unreachable.</strong><br>'
      + 'Pull to refresh in a minute — chitti-news-api may be cold-starting.'
      + '<br><small style="color:var(--muted)">' + esc(String(e)) + '</small>'
      + '</div>';
  } finally {
    root.setAttribute('aria-busy', 'false');
  }
}

// ── Boot ──────────────────────────────────────────────────────────
hydratePickers();
loadFeed(false);
</script>
