<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <title>Chitti News — Your state. Your language. Your news.</title>
  <meta name="description" content="State-aware, multi-language Indian news aggregator. Voice-first. Free. Built for blind, deaf, mute, illiterate users." />
  <meta name="theme-color" content="#FF9933" />
  <!-- Cache-busting: GitHub Pages defaults to long cache TTLs; without
       these no-cache headers Sire's browser keeps showing a stale build
       even after main is updated. Per Sire 2026-06-02 — caught the page
       showing a NaN-id template the new code does not contain. The
       chitti-build meta value below is rewritten by a pre-commit
       hook so the visible build tag always matches the latest commit. -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="chitti-build" content="ship-now-5-2026-06-04" />

  <!--
    Clean rebuild 2026-06-02 per Sire's instruction "follow CTO.md,
    SKILLS, scope". Replaces the 1585-line legacy chitti_news.html.

    Source-of-truth contracts honoured here:
      • chitti-cto/CTO.md §1 — Saffron / Navy / Green palette only
      • chitti-cto/CTO.md §2 — 5-element strip on every response box
      • chitti-cto/CTO.md §5 — one language selector per page
      • chitti-cto/CTO.md §6 — technical terms stay in English (SEBI etc.)
      • chitti-news/SKILLS.md #12 — strip exactly: 🔊 / 🤖 / 👍 / 👎 / ✏️🎙️
      • chitti-news/SOP.md — fact-check verdict on every card; 2-source rule
      • SAHAYAI_MASTER.md §7 — 4-user accessibility contract; ISL panel
      • SAHAYAI_MASTER.md §2d — Feature Discovery (substrate auto-injects)

    Layout (collapsed default):
       [meta]
       [headline]
       [🔊 Read] [🤖 Chitti] [👍] [👎] [✏️ Feedback]
       Tap to read full news
       [thumb]
    Tap card → expand to summary + sub-panels (Take / Explain / Factcheck).
    Speaker on EVERY box reads the entire news (a.content || a.summary).
  -->

  <link rel="stylesheet" href="sahayai_design_system.css">
  <style>
    .sahayai-tricolour{height:6px;background:linear-gradient(90deg,#FF6913 0 33.3%,#FFFFFF 33.3% 66.6%,#046A38 66.6% 100%)}
    button,.btn,input:not([type=checkbox]):not([type=radio]),select,textarea,a.btn{min-height:48px}
    /* ── §1 LOCKED PALETTE ───────────────────────────────────────── */
    :root {
      --saffron: #FF9933;
      --navy: #002366;
      --green:   #138808;
      --canvas:  #FFFFFF;
      --surface: #F9FAFB;
      --rule:    #E5E7EB;
      --text:    #1A1A1A;
      --muted:   #6B7280;
      --warn:    #B45309;
      --red:     #B91C1C;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-size:18px; background:#F7F7F4; }
    body {
      font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: #F7F7F4;
      min-height: 100vh;
    }
    a { color: var(--navy); }
    button { font: inherit; }

    /* ── Sticky legal disclaimer ─────────────────────────────────── */
    .legal-bar {
      position: sticky; top: 0; z-index: 200;
      background: var(--navy); color: #fff;
      font-size: 12px; padding: 6px 12px; text-align: center;
      letter-spacing: .02em;
    }
    .legal-bar strong { color: var(--saffron); }

    /* ── Header (slim, MSN-style) ────────────────────────────────── */
    header {
      padding: 10px 14px; border-bottom: 1px solid var(--rule);
      background: var(--canvas); display: flex; align-items: center;
      gap: 12px; flex-wrap: wrap;
      position: sticky; top: 28px; z-index: 110;
    }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--saffron), var(--green));
      color: #fff; font-weight: 800; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .brand-name { font-weight: 800; font-size: 18px; color: var(--navy); letter-spacing: -.01em; }
    header .filter-mini { display: flex; gap: 6px; margin-left: auto; align-items: center; }
    header .filter-mini select {
      padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px;
      background: var(--canvas); color: var(--text); font-weight: 600;
      cursor: pointer; font-size: 12px;
    }
    header .refresh-btn {
      padding: 6px 10px; border-radius: 999px; border: 0;
      background: var(--saffron); color: #fff; font-weight: 700;
      cursor: pointer; font-size: 13px;
    }
    header .refresh-btn:hover { filter: brightness(.95); }

    /* ── MSN-style sticky category tab strip ───────────────────── */
    .cat-tabs {
      position: sticky; top: 80px; z-index: 100;
      background: var(--canvas); border-bottom: 1px solid var(--rule);
      padding: 8px 14px;
      display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }
    .cat-tabs::-webkit-scrollbar { height: 4px; }
    .cat-tabs::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 2px; }
    .cat-tab {
      padding: 6px 14px; border: 0; border-radius: 999px;
      background: transparent; color: var(--muted); font-size: 13px;
      font-weight: 700; cursor: pointer; white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .cat-tab:hover { color: var(--navy); }
    .cat-tab.active { background: var(--saffron); color: #fff; }

    /* ── Main feed ───────────────────────────────────────────────── */
    main {
      max-width: 720px; margin: 0 auto;
      padding: 14px 12px 80px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .status-card {
      padding: 20px 16px; border: 1px solid var(--rule); border-radius: 12px;
      background: var(--canvas); color: var(--text); text-align: left;
    }

    /* ── Article card (compact / MSN-style) ───────────────────── */
    .art-card {
      background: var(--canvas);
      border: 1px solid var(--rule);
      border-radius: 10px; padding: 12px;
      display: grid; grid-template-columns: 1fr 96px; gap: 12px;
      cursor: pointer; transition: box-shadow .2s;
    }
    .art-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.06); }
    .art-card.expanded { cursor: default; }

    /* ── Article card — FEATURED (first card, MSN hero) ───────── */
    .art-card.featured {
      grid-template-columns: 1fr; padding: 0;
      border: 1px solid var(--rule); overflow: hidden;
    }
    .art-card.featured .art-thumb {
      width: 100%; min-height: 200px; border: 0; border-radius: 0;
      grid-column: 1 / -1; order: -1; margin: 0;
    }
    .art-card.featured .art-thumb.placeholder { min-height: 160px; }
    .art-card.featured > div { padding: 14px; }
    .art-card.featured .art-title { font-size: 19px; line-height: 1.3; }
    .art-card.featured .art-meta { font-size: 11px; }
    .art-meta {
      font-size: 11px; color: var(--muted); font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em;
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px;
    }
    .art-meta .src { color: var(--navy); }
    .art-meta .pt-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 7px; border-radius: 999px;
      font-size: 10px; font-weight: 800; letter-spacing: .03em;
      border: 1px solid currentColor; background: transparent;
    }
    .pt-trusted      { color: #166534; background: rgba(22,163,74,.08); }
    .pt-acceptable   { color: #92400e; background: rgba(212,175,55,.10); }
    .pt-questionable { color: #b45309; background: rgba(245,158,11,.10); }
    .pt-reject       { color: #b91c1c; background: rgba(220,38,38,.08); }
    .art-title {
      font-weight: 800; font-size: 16px; line-height: 1.35;
      color: var(--text); margin: 0 0 8px; word-break: break-word;
    }
    .art-hint {
      font-size: 11px; color: var(--muted); font-style: italic; margin: 4px 0 0;
    }
    .art-card.expanded .art-hint { display: none; }

    /* ── §2 CANONICAL 5-ICON STRIP — every box ──────────────────── */
    .art-strip {
      display: flex; gap: 6px; flex-wrap: wrap;
      padding-top: 8px; margin-top: 6px;
      border-top: 1px dashed var(--rule);
    }
    .art-strip button {
      min-width: 44px; min-height: 44px; padding: 0 10px;
      border: 1px solid var(--rule); border-radius: 999px;
      background: var(--canvas); color: var(--navy);
      font-size: 16px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px; line-height: 1;
    }
    .art-strip button:hover { border-color: var(--saffron); background: #fff8f0; color: var(--saffron); }
    .art-strip button:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
    .art-strip button.primary { background: var(--saffron); color: #fff; border-color: var(--saffron); }
    .art-strip button.primary:hover { filter: brightness(.95); color: #fff; }
    .art-strip button.live { background: var(--green); color: #fff; border-color: var(--green); }
    .art-strip .lbl {
      font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em;
    }

    /* ── Expanded body — tap card to reveal ─────────────────────── */
    .art-body { display: none; margin-top: 12px; }
    .art-card.expanded .art-body { display: block; }
    .art-summary { font-size: 14px; line-height: 1.55; color: var(--text); margin-bottom: 12px; }
    .art-fullbody {
      font-size: 14px; line-height: 1.65; color: var(--text);
      margin: 0 0 12px;
      padding: 12px;
      background: var(--surface); border-left: 3px solid var(--saffron);
      border-radius: 6px;
      white-space: pre-wrap;
    }
    .art-fullbody-status { color: var(--muted); font-style: italic; font-size: 13px; }
    .art-fullbody.summary-only-flag::before {
      content: "ℹ︎ Summary only — the publisher does not share the full body.";
      display: block; color: var(--warn); font-size: 12px; font-weight: 600;
      margin-bottom: 8px;
    }
    .art-fullbody .headline-only {
      color: var(--text); font-size: 13px; line-height: 1.5;
      padding: 4px 0;
    }
    /* The 5-icon strip in the headline is the canonical action surface.
       Sub-actions (Take / Fact check / Share) used to appear here as a
       button row — removed 2026-06-02 per Sire ("MSN simple — nothing
       to reinvent"). Take / Explain / Fact check now live inside the
       sub-host panels which the 🤖 Chitti icon expands; Share moves
       to the strip via long-press on the speaker if we ever need it. */
    .art-sub-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .art-sub-actions button {
      padding: 6px 10px; border: 1px solid var(--rule); border-radius: 8px;
      background: var(--canvas); color: var(--text); font-size: 12px; cursor: pointer;
    }
    .art-sub-actions button:hover { background: var(--surface); border-color: var(--navy); }
    .art-source-link {
      margin-top: 10px; font-size: 13px;
    }
    .art-source-link a { color: var(--navy); text-decoration: underline; font-weight: 600; }

    /* ── Sub-host panels (Chitti's Take / Explain / Factcheck) ──── */
    .art-sub-host {
      margin-top: 10px; padding: 10px;
      border: 1px solid var(--rule); border-radius: 8px;
      background: var(--surface);
    }
    .art-sub-host:empty { display: none; }
    .art-sub-host h4 {
      margin: 0 0 6px; font-size: 12px; text-transform: uppercase;
      letter-spacing: .04em; color: var(--navy);
    }
    .art-sub-host ul { margin: 0; padding-left: 18px; }

    /* ── Thumbnail ──────────────────────────────────────────────── */
    .art-thumb {
      background: var(--surface); border-radius: 8px;
      background-size: cover; background-position: center;
      min-height: 80px; border: 1px solid var(--rule);
    }
    .art-thumb.placeholder {
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: var(--saffron); opacity: .7;
    }

    /* ── Fact-check badge (compact form, kept for 240 px rail cards) ── */
    .fc-badge {
      display: inline-block; padding: 1px 6px; border-radius: 4px;
      font-size: 10px; font-weight: 800;
    }
    .fc-verified  { background: rgba(19,136,8,.12); color: var(--green); }
    .fc-partial   { background: rgba(255,153,51,.12); color: var(--warn); }
    .fc-disputed  { background: rgba(185,28,28,.12); color: var(--red); }
    .fc-unchecked,
    .fc-unverified { background: rgba(107,114,128,.12); color: var(--muted); }

    /* ── Trust Strip — full-width verification UX on every art-card ──
       Sire 2026-06-04: replaces the 10 px pill above the headline. Goal:
       a user understands trustworthiness in under 2 seconds.

       Each strip carries:
         • 6 px coloured left rail (green/amber/red/grey) — peripheral
           vision picks this up before reading the headline
         • icon + status word in 13 px — the verdict in plain English
         • numeric confidence (0-100) — "92%"
         • dot gauge — 5 dots, 0-4 filled by confidence quintile
         • plain-English rationale — backend's rationale_en, one line
         • source-count chip — "3 sources agree" / "1 other source"
         • expand chevron — taps reveal matched_source_names inline

       Anchored to four verdict states + an unchecked/loading state so
       no card ever ships without a trust signal. */
    .trust-strip {
      display: grid; grid-template-columns: 6px 1fr auto;
      align-items: stretch; gap: 0;
      background: var(--surface);
      border-radius: 10px 10px 0 0;
      margin: -12px -12px 12px;
      overflow: hidden;
      cursor: pointer;
      border-bottom: 1px solid var(--rule);
      transition: background .15s;
    }
    .trust-strip:hover { background: #F2F4F7; }
    .trust-strip:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
    .trust-rail { background: var(--muted); }      /* default, overridden per verdict */
    .trust-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .trust-head {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: 13px; line-height: 1.2;
    }
    .trust-icon {
      font-size: 16px; line-height: 1;
      width: 20px; display: inline-flex; justify-content: center;
    }
    .trust-word {
      font-weight: 800; letter-spacing: .02em;
      text-transform: uppercase; font-size: 12px;
    }
    .trust-conf {
      margin-left: auto; font-weight: 700; font-size: 12px;
      color: var(--text); opacity: .8;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .trust-dots { display: inline-flex; gap: 3px; }
    .trust-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(0,0,0,.08);
    }
    .trust-dot.filled { background: currentColor; }
    .trust-rationale {
      color: var(--text); font-size: 12px; line-height: 1.4;
      margin: 0; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .trust-meta {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--muted); font-weight: 700;
    }
    .trust-chip {
      padding: 1px 8px; border-radius: 999px;
      background: rgba(0,0,0,.05); color: var(--text);
      font-size: 10px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .03em;
      white-space: nowrap;
    }
    .trust-expand {
      padding: 0 14px; align-self: stretch;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 16px;
      border-left: 1px solid var(--rule);
    }
    .trust-expand::before {
      content: "›"; display: inline-block;
      transition: transform .18s;
      font-weight: 700; font-size: 22px; line-height: 1;
    }
    .trust-strip.expanded .trust-expand::before { transform: rotate(90deg); }
    .trust-sources {
      grid-column: 1 / -1;
      display: none;
      padding: 0 14px 12px; gap: 6px;
      flex-direction: column;
      background: rgba(255,255,255,.7);
      border-top: 1px solid var(--rule);
    }
    .trust-strip.expanded .trust-sources { display: flex; }
    .trust-source-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text); padding: 4px 0;
      border-bottom: 1px dashed var(--rule);
    }
    .trust-source-row:last-child { border-bottom: 0; }
    .trust-source-row .src-check { color: var(--green); width: 14px; }
    .trust-source-name { font-weight: 700; }
    .trust-empty-evidence {
      font-size: 12px; color: var(--muted); padding: 6px 0; font-style: italic;
    }

    /* Verdict colour treatments — left rail + status word + confidence text. */
    .trust-strip.verdict-verified   .trust-rail { background: var(--green); }
    .trust-strip.verdict-verified   .trust-word { color: var(--green); }
    .trust-strip.verdict-verified   .trust-conf,
    .trust-strip.verdict-verified   .trust-dots { color: var(--green); }
    .trust-strip.verdict-partial    .trust-rail { background: var(--saffron); }
    .trust-strip.verdict-partial    .trust-word { color: var(--warn); }
    .trust-strip.verdict-partial    .trust-conf,
    .trust-strip.verdict-partial    .trust-dots { color: var(--warn); }
    .trust-strip.verdict-disputed   .trust-rail { background: var(--red); }
    .trust-strip.verdict-disputed   .trust-word { color: var(--red); }
    .trust-strip.verdict-disputed   .trust-conf,
    .trust-strip.verdict-disputed   .trust-dots { color: var(--red); }
    .trust-strip.verdict-unverified .trust-rail,
    .trust-strip.verdict-unchecked  .trust-rail { background: var(--muted); }
    .trust-strip.verdict-unverified .trust-word,
    .trust-strip.verdict-unchecked  .trust-word { color: var(--muted); }
    .trust-strip.verdict-unverified .trust-conf,
    .trust-strip.verdict-unverified .trust-dots,
    .trust-strip.verdict-unchecked  .trust-conf,
    .trust-strip.verdict-unchecked  .trust-dots { color: var(--muted); }

    /* The strip belongs to art-card and hero-card. Rail cards (240 px)
       are too narrow for the rationale line; they keep .fc-badge in
       the meta line. */
    .hero-card .trust-strip { margin: 0 0 14px; border-radius: 0; }

    /* ── Chitti's Insight (Sire 2026-06-04, priority #2) ──
       One italicised editorial sentence between the headline and the
       5-icon strip. Cached server-side; renders instantly when present.
       Hidden entirely when the article has no insight (NULL on the
       row, e.g. validator rejected the model output). Tappable —
       expands the existing "Chitti's Take" 3-bullet panel via
       openTake(). */
    .art-insight {
      margin: 10px 0 8px;
      padding: 10px 12px;
      background: linear-gradient(135deg, rgba(255,153,51,.05), rgba(19,136,8,.04));
      border-left: 3px solid var(--saffron);
      border-radius: 0 8px 8px 0;
      font-size: 13px; line-height: 1.5; color: var(--text);
      cursor: pointer;
      transition: background .15s;
    }
    .art-insight:hover  { background: linear-gradient(135deg, rgba(255,153,51,.10), rgba(19,136,8,.08)); }
    .art-insight:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
    .art-insight-label {
      font-size: 11px; font-weight: 800;
      letter-spacing: .03em; text-transform: uppercase;
      color: var(--navy);
      display: inline-flex; align-items: center; gap: 4px;
      margin-bottom: 2px;
    }
    .art-insight-label::before { content: "🤖"; font-size: 13px; }
    .art-insight-body {
      font-style: italic; color: var(--text);
      display: block;
    }

    /* SOP-001 step 5 + 6 — Why / What strip per CNOS SOP compliance audit 2026-06-04 */
    .art-sop {
      display: flex; flex-direction: column; gap: 6px;
      margin: 8px 0; padding: 10px 12px;
      background: linear-gradient(135deg, rgba(14,35,68,.04), rgba(212,175,55,.04));
      border-left: 3px solid var(--saffron);
      border-radius: 6px; font-size: 13.5px; line-height: 1.45;
    }
    .art-sop-line { color: var(--text); }
    .art-sop-label { font-weight: 700; color: var(--navy); margin-right: 4px; }
    .art-sop-body  { color: var(--text); }
    .art-sop-why .art-sop-label { color: #b45309; }
    .art-sop-act .art-sop-label { color: #166534; }

    /* §2 — Suppress the substrate-injected per-box feedback bar on
       art-cards / rail-cards / hero-card. Each of these carries its
       own canonical strip (per SKILLS.md #12). The substrate continues
       to inject on every other Chitti page + on the sub-host panels
       (take/explain/fact) inside art-cards when those load. Without
       this rule the 240 px rail cards stack a duplicate 5-icon bar
       under every card and the layout breaks (Sire 2026-06-03). */
    .art-card  + .chitti-fb-box-bar,
    .rail-card + .chitti-fb-box-bar,
    .hero-card + .chitti-fb-box-bar { display: none !important; }
    /* Belt-and-braces: also suppress anything the substrate might
       inject INSIDE a rail-card. We render our own mini-strip. */
    .rail-card .chitti-fb-box-bar { display: none !important; }

    /* ── Amazon-style home rails (only on National tab) ───────────── */
    .rail-section { margin: 18px 0 6px; }
    .rail-section:first-child { margin-top: 6px; }
    .rail-header {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 0 4px 8px;
    }
    .rail-title {
      font-size: 18px; font-weight: 800; color: var(--navy);
      letter-spacing: -.01em; margin: 0;
    }
    .rail-see-all {
      background: none; border: 0; color: var(--navy);
      font-weight: 700; font-size: 12px; cursor: pointer;
      text-decoration: none;
    }
    .rail-see-all:hover { text-decoration: underline; color: var(--saffron); }
    .rail-track {
      display: flex; gap: 12px;
      overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 4px 4px 12px;
      scrollbar-width: thin;
    }
    .rail-track::-webkit-scrollbar { height: 6px; }
    .rail-track::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
    .rail-card {
      flex: 0 0 240px; scroll-snap-align: start;
      background: var(--canvas);
      border: 1px solid var(--rule); border-radius: 10px;
      overflow: hidden; cursor: pointer;

  </style>

<!-- ╔══════════════════════════════════════════════════════════════╗
     ║   Shared substrate — chitti_a11y.js auto-injects:           ║
     ║     feedback-widget.js, chitti_isl.js, chitti_lang.js,      ║
     ║     chitti_features.js, chitti_disability_profile.js        ║
     ║   Every Chitti page that loads chitti_a11y.js inherits      ║
     ║   the 5 accessibility gates from QUALITY_STATUS.md §1a.     ║
     ╚══════════════════════════════════════════════════════════════╝ -->
<script src="chitti_a11y.js" defer></script>

<script>
"use strict";

// ── Configuration ─────────────────────────────────────────────────
const API_BASE = (function(){
  try { return localStorage.getItem('chitti_news_api_base')
            || 'https://chitti-news-api-production.up.railway.app'; }
  catch (e) { return 'https://chitti-news-api-production.up.railway.app'; }
})();

const STORAGE = {
  state: 'chitti_news_state',
  lang:  'chitti_news_lang',
  token: 'chitti_news_user_token',
  cat:   'chitti_news_category',
};

// Per-device user token for save/cancel folders (UUID, never reused
// across devices — privacy by default per Postman Principle).
function userToken() {
  try {
    let t = localStorage.getItem(STORAGE.token);
    if (!t) {
      t = (crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : ('u-' + Math.random().toString(36).slice(2) + Date.now().toString(36));
      localStorage.setItem(STORAGE.token, t);
    }
    return t;
  } catch (e) { return 'anon-' + Date.now(); }
}

// Article cache — keyed by id. The full body (a.content) lives here
// only; never in DOM until the user expands the card.
const ARTICLES = Object.create(null);

// ── Filter state ──────────────────────────────────────────────────
function getFilter() {
  return {
    state:  localStorage.getItem(STORAGE.state) || 'india',
    lang:   localStorage.getItem(STORAGE.lang)  || 'en',
    cat:    localStorage.getItem(STORAGE.cat)   || 'national',
  };
}
function setFilter(f) {
  try {
    if (f.state) localStorage.setItem(STORAGE.state, f.state);
    if (f.lang)  localStorage.setItem(STORAGE.lang,  f.lang);
    if (f.cat)   localStorage.setItem(STORAGE.cat,   f.cat);
  } catch (e) {}
}
function onFilterChange() {
  const f = {
    state: document.getElementById('pick-state').value,
    lang:  document.getElementById('pick-lang').value,
    cat:   document.getElementById('pick-cat').value,
  };
  setFilter(f);
  document.documentElement.lang = f.lang;
  syncCategoryTabs(f.cat);
  if (window.Chitti && Chitti.a11y && Chitti.a11y.setLanguage) {
    try { Chitti.a11y.setLanguage(f.lang, { manual: true, source: 'news-filter' }); }
    catch (e) {}
  }
  loadFeed(true);
}

// Hydrate pickers from localStorage on load.
// Sire 2026-06-04 (decision A) — kn / or are temporarily hidden from
// the picker; any user whose localStorage already pins those is
// rewritten to en on hydrate so they don't land on a permanently
// empty feed. We persist the change so this is a one-way migration.
const _RETIRED_LANGS = new Set(['kn', 'or']);
function hydratePickers() {
  const f = getFilter();
  if (_RETIRED_LANGS.has(f.lang)) {
    f.lang = 'en';
    setFilter(f);
  }
  document.getElementById('pick-state').value = f.state;
  document.getElementById('pick-lang').value  = f.lang;
  document.getElementById('pick-cat').value   = f.cat;
  document.documentElement.lang = f.lang;
  syncCategoryTabs(f.cat);
}

function syncCategoryTabs(cat) {
  document.querySelectorAll('.cat-tab').forEach(function (b) {
    if (b.dataset.cat === cat) {
      b.classList.add('active');
      b.setAttribute('aria-selected', 'true');
    } else {
      b.classList.remove('active');
      b.setAttribute('aria-selected', 'false');
    }
  });
}

// Category tab clicks update the hidden <select> + fire onFilterChange.
// One source of truth — the <select> remains canonical state for the
// picker layer; tabs are presentation.
document.addEventListener('click', function (e) {
  const tab = e.target && e.target.closest && e.target.closest('.cat-tab');
  if (!tab) return;
  const cat = tab.dataset.cat;
  if (!cat) return;
  const sel = document.getElementById('pick-cat');
  if (sel.value !== cat) {
    sel.value = cat;
    sel.dispatchEvent(new Event('change', { bubbles: true }));
  }
  syncCategoryTabs(cat);
});

// Sire 2026-06-03 — chitti_a11y.js substrate recognises #pick-lang as
// a language dropdown (matches its `select#pick-lang` selector) and
// attaches its own handlers, which silently broke the inline
// data-chitti-news-picker attribute on the select. Result:
// changing language did not fetch new articles.
//
// Fix: bypass with a single document-level listener at the CAPTURE
// phase so it fires BEFORE any substrate-attached bubble-phase
// listener can interfere. Deduplication flag prevents double fires if
// the user double-taps.
let _pickerChangeInFlight = false;
document.addEventListener('change', function (e) {
  const t = e && e.target;
  if (!t || !t.id) return;
  if (t.id !== 'pick-state' && t.id !== 'pick-lang' && t.id !== 'pick-cat') return;
  if (_pickerChangeInFlight) return;
  _pickerChangeInFlight = true;
  try { onFilterChange(); }
  finally {
    setTimeout(function () { _pickerChangeInFlight = false; }, 50);
  }
}, true);  // ← capture phase: runs BEFORE substrate listeners

// ── API helpers ───────────────────────────────────────────────────
async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign(
    { 'X-User-Token': userToken() }, opts.headers || {}
  );
  const r = await fetch(API_BASE + path, opts);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ── Rendering ─────────────────────────────────────────────────────
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function timeAgo(iso) {
  if (!iso) return '';
  const t = Date.parse(iso); if (!t) return '';
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1)    return 'now';
  if (m < 60)   return m + ' min ago';
  if (m < 1440) return Math.floor(m/60) + ' hr ago';
  return Math.floor(m/1440) + ' d ago';
}
function fcBadge(fc) {
  if (!fc) return '';
  const verdict = fc.verdict || 'unchecked';
  const cls = 'fc-' + verdict;
  const label = fc.word || verdict.toUpperCase();
  const sym = fc.symbol || '⏳';
  return '<span class="fc-badge ' + cls + '" title="Fact check: ' + esc(label)
       + '">' + sym + ' ' + esc(label) + '</span>';
}

// ── Trust Strip ──────────────────────────────────────────────────────
// Sire 2026-06-04: replaces the 10 px .fc-badge above the headline.
// Goal: a user understands trustworthiness in under 2 seconds.
//
// Status word is plain English, not jargon:
//   verified   → "Verified by ≥3 sources"
//   partial    → "Matches 2 sources"
//   disputed   → "Check first — sources disagree"
//   unverified → "Unverified — no cross-checks yet"
//   unchecked  → "Checking…" (still computing)
const _TRUST_PRESENTATION = {
  verified:   { icon: '✓',  word: 'Verified',    cta: '%n sources agree' },
  partial:    { icon: '◐',  word: 'Matches',     cta: '%n sources cover this' },
  disputed:   { icon: '!',  word: 'Check first', cta: 'Only %n other source' },
  unverified: { icon: '?',  word: 'Unverified',  cta: 'No cross-checks yet' },
  unchecked:  { icon: '⏳', word: 'Checking…',   cta: 'Trust score loading' },
};
function _trustChip(fc) {
  const verdict = (fc && fc.verdict) || 'unchecked';
  const pres = _TRUST_PRESENTATION[verdict] || _TRUST_PRESENTATION.unchecked;
  const n = (fc && fc.match_count != null) ? fc.match_count : 0;
  if (verdict === 'unverified') return pres.cta;
  if (verdict === 'unchecked')  return pres.cta;
  return pres.cta.replace('%n', String(n));
}
function _trustDots(confidence) {
  // 5-dot gauge by quintile of confidence ∈ [0,100]. Conservative
  // floor of 1 filled dot when there's ANY confidence so the gauge
  // never reads as "zero" for an unverified score of 25%.
  const c = Math.max(0, Math.min(100, Number(confidence) || 0));
  const filled = c === 0 ? 0 : Math.max(1, Math.round(c / 20));
  let html = '';
  for (let i = 0; i < 5; i++) {
    html += '<span class="trust-dot' + (i < filled ? ' filled' : '') + '"></span>';
  }
  return html;
}
function _trustRationale(fc, lang) {
  if (!fc) return '';
  const rk = lang === 'hi' ? 'rationale_hi' : 'rationale_en';
  // Fallback chain: requested-language rationale → English → derived
  // copy from verdict + count, so the strip never renders blank text.
  if (fc[rk]) return fc[rk];
  if (fc.rationale_en) return fc.rationale_en;
  const v = fc.verdict || 'unchecked';
  const n = fc.match_count || 0;
  if (v === 'verified')  return n + ' other trusted sources are running this story; key facts agree.';
  if (v === 'partial')   return n + ' other sources cover this; broad facts match but details differ.';
  if (v === 'disputed')  return 'Only 1 other source and the headlines diverge — read the source link before sharing.';
  if (v === 'unverified') return 'No cross-source corroboration yet — single-source story, may be hyperlocal or breaking.';
  return 'Chitti is still cross-checking this story across other sources.';
}
// Per-publisher trust badge (SHIP gate #11). a.publisher_trust is
// {score, band, n_articles, computed_at} from compute_publisher_trust.py
// methodology. When the snapshot is missing we render NOTHING.
const _PT_BAND = {
  trusted:      {label: 'TRUSTED',      cls: 'pt-trusted'},
  acceptable:   {label: 'ACCEPTABLE',   cls: 'pt-acceptable'},
  questionable: {label: 'QUESTIONABLE', cls: 'pt-questionable'},
  reject:       {label: 'LOW TRUST',    cls: 'pt-reject'},
  unknown:      null,
};
function publisherTrustBadge(a) {
  const pt = a && a.publisher_trust;
  if (!pt || typeof pt.score !== 'number') return '';
  const conf = _PT_BAND[(pt.band || '').toLowerCase()];
  if (!conf) return '';
  const tip = 'Publisher trust score ' + pt.score + '/100 over ' + (pt.n_articles || 0)
            + ' articles. Methodology: 50 + 0.5·verified − 1.0·disputed − 0.3·unverified.';
  return '<span class="src pt-badge ' + conf.cls + '" title="' + esc(tip)
       + '" aria-label="' + esc(tip) + '">' + esc(conf.label) + ' ' + esc(String(pt.score)) + '</span>';
}
function _trustSourcesList(fc) {
  // Names if backend resolved them, fall back to slugs.
  if (!fc) return [];
  const names = Array.isArray(fc.matched_source_names) ? fc.matched_source_names : null;
  const slugs = Array.isArray(fc.matched_sources) ? fc.matched_sources : [];
  if (names && names.length) return names;
  return slugs;
}
function trustStripHtml(fc, articleId) {
  // fc is the per-article factcheck dict from the feed payload.
  // Renders the always-visible top strip + the collapsed source list
  // below (revealed by .expanded class). Tapping the strip toggles
  // expansion; tapping a source row navigates to that outlet's URL
  // when one is available (currently only the slug list is shipped).
  const f = fc || {};
  const verdict = f.verdict || 'unchecked';
  const pres = _TRUST_PRESENTATION[verdict] || _TRUST_PRESENTATION.unchecked;
  const conf = (typeof f.confidence === 'number') ? f.confidence : null;
  const confLabel = (conf != null) ? (conf + '%') : '—';
  const dots = _trustDots(conf || 0);
  const rationale = _trustRationale(f, getFilter().lang);
  const chip = _trustChip(f);
  const sources = _trustSourcesList(f);
  let sourcesHtml = '';
  if (sources.length) {
    sourcesHtml = sources.slice(0, 6).map(function (n) {
      return '<div class="trust-source-row">'
           +   '<span class="src-check">✓</span>'
           +   '<span class="trust-source-name">' + esc(n) + '</span>'
           + '</div>';
    }).join('');
  } else {
    sourcesHtml = '<div class="trust-empty-evidence">'
                + (verdict === 'unchecked'
                    ? 'Chitti is still cross-checking this story.'
                    : 'No other sources matched yet.')
                + '</div>';
  }
  const aria = pres.word + '. ' + chip + '. ' + 'Confidence ' + confLabel
             + '. Tap to see ' + (sources.length || 'no') + ' matching sources.';
  return ''
    + '<div class="trust-strip verdict-' + esc(verdict) + '"'
    +   ' role="button" tabindex="0"'
    +   ' aria-label="' + esc(aria) + '"'
    +   ' aria-expanded="false"'
    +   ' onclick="event.stopPropagation(); toggleTrust(' + articleId + ');"'
    +   ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();event.stopPropagation();toggleTrust(' + articleId + ');}">'
    +   '<div class="trust-rail" aria-hidden="true"></div>'
    +   '<div class="trust-body">'
    +     '<div class="trust-head">'
    +       '<span class="trust-icon" aria-hidden="true">' + esc(pres.icon) + '</span>'
    +       '<span class="trust-word">' + esc(pres.word) + '</span>'
    +       '<span class="trust-chip">' + esc(chip) + '</span>'
    +       '<span class="trust-conf">'
    +         '<span class="trust-dots" aria-hidden="true">' + dots + '</span>'
    +         '<span>' + esc(confLabel) + '</span>'
    +       '</span>'
    +     '</div>'
    +     '<p class="trust-rationale">' + esc(rationale) + '</p>'
    +   '</div>'
    +   '<div class="trust-expand" aria-hidden="true"></div>'
    +   '<div class="trust-sources" role="list">' + sourcesHtml + '</div>'
    + '</div>';
}

// ── Chitti's Insight on the card ─────────────────────────────────────
// Sire 2026-06-04 priority #2. The backend pre-computes one short
// editorial sentence per article and caches it on Article.chitti_insight.
// If the field is NULL — never generated, OR the hallucination validator
// rejected the model's attempt — we render NOTHING. No placeholder,
// no spinner, no "loading insight" copy. Trust over coverage.
function insightHtml(a) {
  const insight = a && a.chitti_insight;
  if (!insight || !String(insight).trim()) return '';
  return ''
    + '<div class="art-insight" role="button" tabindex="0"'
    +   ' aria-label="Chitti\'s Take: ' + esc(insight) + '. Tap to expand the full take."'
    +   ' onclick="event.stopPropagation(); openTake(' + a.id + ');"'
    +   ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();event.stopPropagation();openTake(' + a.id + ');}">'
    +   '<div class="art-insight-label">Chitti\'s Take:</div>'
    +   '<span class="art-insight-body">' + esc(insight) + '</span>'
    + '</div>';
}

// SOP-001 step 5 + 6 — "Why this matters" + "What to do" lines per article.
// Both render NULL → nothing. Same trust-over-coverage discipline as Insight.
// 2026-06-04 per CNOS SOP compliance audit.
function whyAndActionHtml(a) {
  if (!a) return '';
  const why = a.why_this_matters && String(a.why_this_matters).trim();
  const act = a.action_plan      && String(a.action_plan).trim();
  if (!why && !act) return '';
  let html = '<div class="art-sop" role="group" aria-label="Why this matters and what to do">';
  if (why) {
    html += '<div class="art-sop-line art-sop-why" aria-label="Why this matters: ' + esc(why) + '">'
         +    '<span class="art-sop-label">🎯 Why this matters:</span> '
         +    '<span class="art-sop-body">' + esc(why) + '</span>'
         +  '</div>';
  }
  if (act) {
    html += '<div class="art-sop-line art-sop-act" aria-label="What to do: ' + esc(act) + '">'
         +    '<span class="art-sop-label">✅ What to do:</span> '
         +    '<span class="art-sop-body">' + esc(act) + '</span>'
         +  '</div>';
  }
  html += '</div>';
  return html;
}

// Toggle expansion of the trust panel on a card. Independent of the
// article-body expansion so a user can read corroborating sources
// without committing to a full read-aloud.
//
// Sire 2026-06-04 (pillar audit, news_intelligence) — on first expand
// we lazy-fetch /article/<id>/factcheck so the panel can show each
// matched outlet's actual headline + a tap-to-open link, not just the
// outlet name. The full panel data is already on the wire today and
// was being discarded. Cache on first fetch so re-expansion is instant.
const _trustMatchedCache = Object.create(null);
async function toggleTrust(articleId) {
  const card = document.getElementById('art-' + articleId)
            || document.getElementById('hero-' + articleId);
  if (!card) return;
  const strip = card.querySelector('.trust-strip');
  if (!strip) return;
  const open = strip.classList.toggle('expanded');
  strip.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (!open) return;
  // First-expand: hydrate the matched-articles list from the per-article
  // factcheck endpoint. Subsequent expands of the same card use cache.
  const sources = strip.querySelector('.trust-sources');
  if (!sources) return;
  if (_trustMatchedCache[articleId]) {
    sources.innerHTML = _trustMatchedCache[articleId];
    return;
  }
  // Only fetch if backend told us there ARE matches — n=0 (Unverified)
  // panels just show the "No other sources matched yet" empty state.
  const a = ARTICLES[articleId];
  const fc = a && a.factcheck;
  if (!fc || !fc.match_count || fc.match_count < 1) return;
  try {
    const data = await api('/api/news/article/' + articleId + '/factcheck');
    const matched = Array.isArray(data.matched_articles) ? data.matched_articles : [];
    if (!matched.length) return;
    const html = matched.slice(0, 5).map(function (m) {
      const src = esc(m.source_name || m.source_slug || 'Source');
      const ttl = esc((m.title || '').slice(0, 140));
      const lnk = esc(m.link || '');
      // Each matched outlet renders as: ✓ Outlet name (small, bold)
      // followed by their own headline phrasing, then a "Read on
      // <outlet>" link that opens the source's page in a new tab.
      return '<div class="trust-source-row">'
           +   '<span class="src-check">✓</span>'
           +   '<div style="display:flex;flex-direction:column;gap:2px;min-width:0;">'
           +     '<span class="trust-source-name">' + src + '</span>'
           +     '<span style="font-size:11px;color:var(--text);line-height:1.4;">' + ttl + '</span>'
           +     (lnk
                  ? '<a href="' + lnk + '" target="_blank" rel="noopener noreferrer" '
                    + 'onclick="event.stopPropagation()" '
                    + 'style="font-size:10px;font-weight:700;color:var(--navy);text-decoration:underline;">'
                    + 'Read on ' + src + ' &rarr;</a>'
                  : '')
           +   '</div>'
           + '</div>';
    }).join('');
    _trustMatchedCache[articleId] = html;
    sources.innerHTML = html;
  } catch (e) {
    // Silent failure — leave the existing source-name list visible.
  }
}

// CANONICAL 5-ICON STRIP — per chitti-news/SKILLS.md #12 +

// ── Amazon-style HOME view ────────────────────────────────────────
// Sire 2026-06-03: "National news has to be divided as per politics,
// business, sports, etc." + "you can have a view of amazon." When the
// National tab is active we treat it as the *home page* and render
// each sub-category (Politics, Business, Sports, Entertainment, Tech)
// as a horizontally scrollable rail — same pattern as Amazon's
// "Customers also bought" / category aisles. Tap a rail headline to
// drill into that category as the linear feed. Tap any card to expand
// + speak (same speak path as the linear feed).
//
// Note: the hero is the freshest "national" headline; the rails are
// fetched in PARALLEL (Promise.all of 6 requests) so the page paints
// within ~1 RTT of the slowest source.

const HOME_RAILS = [
  { cat: 'politics',      label: 'Politics' },
  { cat: 'business',      label: 'Business' },
  { cat: 'sports',        label: 'Sports' },
  { cat: 'entertainment', label: 'Entertainment' },
  { cat: 'tech',          label: 'Technology' },
];
const HOME_RAIL_LIMIT = 8;        // cards per rail
const HOME_NATIONAL_LIMIT = 12;   // cards under the hero "Top National" rail

function railCardHtml(a) {
  ARTICLES[a.id] = a;
  const boxId = 'rail-' + a.id;
  const thumb = a.image_url
    ? '<div class="rail-thumb" style="background-image:url(\'' + esc(a.image_url) + '\')" aria-hidden="true"></div>'
    : '<div class="rail-thumb placeholder" aria-hidden="true">📰</div>';
  const meta = [
    a.is_breaking ? '<span class="src" style="color:var(--red)">BREAKING</span>' : '',
    fcBadge(a.factcheck),
    '<span class="src">' + esc(a.source_name || 'Source') + '</span>',
    publisherTrustBadge(a),
    timeAgo(a.published_at || a.fetched_at),
  ].filter(Boolean).join(' · ');
  return ''
    // Note: NO data-chitti-response here — rail cards already carry
    // their own mini 4-icon strip below. Marking them as a "response box"
    // would cause chitti_a11y.js's feedback-widget.js to inject ANOTHER
    // strip after each card, doubling icons and breaking the 240 px
    // layout. The substrate's per-box strip is suppressed for
    // .art-card via CSS in this file; rail-card uses the same approach
    // (rule below) for safety.
    + '<article class="rail-card" id="' + boxId + '" data-id="' + a.id + '"'
    +   ' role="button" tabindex="0"'
    +   ' aria-label="Tap to hear the entire news"'
    +   ' onclick="onHomeCardTap(' + a.id + ')"'
    +   ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();onHomeCardTap(' + a.id + ')}">'
    +   thumb
    +   '<div class="rail-body">'
    +     '<div class="rail-meta">' + meta + '</div>'
    +     '<h3 class="rail-headline">' + esc(a.title || '') + '</h3>'
    +     '<div class="rail-mini-strip" role="group" aria-label="Read, react">'
    +       '<button class="primary" type="button" aria-label="Read aloud"'
    +         ' onclick="event.stopPropagation(); speakArticle(' + a.id + ')">🔊</button>'
    +       '<button type="button" aria-label="Helpful"'
    +         ' onclick="event.stopPropagation(); saveArticle(' + a.id + ', \'saved\')">👍</button>'
    +       '<button type="button" aria-label="Wrong"'
    +         ' onclick="event.stopPropagation(); saveArticle(' + a.id + ', \'cancelled\')">👎</button>'
    +       '<button type="button" aria-label="Open feedback"'

function heroCardHtml(a) {

function railSectionHtml(label, cat, items) {
  if (!items || items.length === 0) return '';
  const cards = items.slice(0, HOME_RAIL_LIMIT).map(railCardHtml).join('');
  return ''
    + '<section class="rail-section" aria-label="' + esc(label) + '">'
    +   '<div class="rail-header">'
    +     '<h2 class="rail-title">' + esc(label) + '</h2>'
    +     '<button class="rail-see-all" type="button" '
    +       'onclick="switchToCategory(\'' + esc(cat) + '\')">See all ' + esc(label) + ' &rarr;</button>'
    +   '</div>'
    +   '<div class="rail-track" role="list">' + cards + '</div>'
    + '</section>';
}

async function loadHome() {
  const myToken = ++_feedToken;
  const f = getFilter();
  const root = document.getElementById('feed-root');
  root.setAttribute('aria-busy', 'true');
  root.innerHTML = '<div class="status-card">Loading…</div>';

  // Six parallel requests — one per category — so the page paints in
  // a single RTT of the slowest source.
  const cats = ['national'].concat(HOME_RAILS.map(r => r.cat));
  const responses = await Promise.allSettled(cats.map((c) =>
    api('/api/news/feed?state=' + f.state + '&language=' + f.lang + '&category=' + c),
  ));
  if (myToken !== _feedToken) return;
  const data = {};
  cats.forEach((c, i) => {
    const r = responses[i];
    data[c] = (r.status === 'fulfilled' && r.value && Array.isArray(r.value.items))
      ? r.value.items : [];
  });
  // Pull the coverage payload from any successful response so the
  // empty-state branch can show available_categories + english_fallback.
  const firstOk = responses.find(r => r.status === 'fulfilled' && r.value);
  const meta = firstOk ? firstOk.value : {};

  // No content in this language at all → empty-state with switches.
  const totalItems = cats.reduce((sum, c) => sum + data[c].length, 0);
  if (totalItems === 0) {
    renderFeed([], meta);
    root.setAttribute('aria-busy', 'false');
    return;
  }

  const nationalItems = data['national'];
  const hero = nationalItems[0];
  const topRailItems = nationalItems.slice(1, 1 + HOME_NATIONAL_LIMIT);

  let html = '';
  if (hero) html += heroCardHtml(hero);
  html += railSectionHtml('Top National', 'national', topRailItems);
  for (const { cat, label } of HOME_RAILS) {
    html += railSectionHtml(label, cat, data[cat]);
  }
  root.innerHTML = html;
  root.setAttribute('aria-busy', 'false');
}

// Friendly long-form names for the empty-state honesty message. Backend
// gives us the code (ml, kn…) so we look up the English name for the
// "Chitti News doesn't have <LANG> sources yet" copy.
const LANG_LABELS = {
  en: 'English', hi: 'Hindi', mr: 'Marathi', ta: 'Tamil', te: 'Telugu',
  bn: 'Bengali', kn: 'Kannada', ml: 'Malayalam', gu: 'Gujarati',
  pa: 'Punjabi', or: 'Odia', ur: 'Urdu', as: 'Assamese',
};

function renderFeed(items, meta) {
  const root = document.getElementById('feed-root');
  if (!items || items.length === 0) {
    // Honest empty state. Three layered cases:
    //   (1) total_in_language === 0  → "no sources yet" (kn/or/as today)
    //   (2) total_in_language > 0 but category empty → "no <cat> in <lang>"
    //   (3) backend gave neither    → generic refresh prompt
    // Each case offers concrete one-tap recoveries: switch to an
    // available category in the SAME language, or fall back to English.
    // Sire 2026-06-03: "if language is Malayalam it should be in Malayalam,
    // not English" — showing stale English content is wrong; the right
    // answer is "no Malayalam X today, here is Malayalam Y instead."
    const cov = (meta && meta.coverage) || {};
    const cats = Array.isArray(cov.available_categories) ? cov.available_categories : [];
    const f = getFilter();
    const langName = LANG_LABELS[f.lang] || f.lang.toUpperCase();
    const totalInLang = typeof cov.total_in_language === 'number' ? cov.total_in_language : null;
    const noCorpus = totalInLang === 0;
    const headline = noCorpus
      ? 'Chitti News doesn\'t have ' + langName + ' sources yet.'
      : 'No stories yet.';
    const body = noCorpus
      ? 'We\'re adding more publishers every week. For now, try one of the languages below.'
      : (meta && meta.speak_en ? meta.speak_en : 'Tap Refresh in a minute.');
    let html = '<div class="status-card" style="padding:24px 16px;text-align:left;">'
      + '<strong style="font-size:16px;color:var(--navy);">' + esc(headline) + '</strong><br>'
      + '<div style="margin-top:8px;font-size:14px;">' + esc(body) + '</div>';
    if (cats.length > 0) {
      html += '<div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;">';
      for (const c of cats) {
        if (c === f.cat) continue;
        html += '<button onclick="switchToCategory(\'' + esc(c) + '\')" '
              + 'style="background:var(--saffron);color:#fff;border:0;border-radius:999px;'
              + 'padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px;">'
              + 'Switch to ' + esc(c) + '</button>';
      }
      html += '</div>';
    }
    if (typeof cov.english_fallback_count === 'number' && cov.english_fallback_count > 0 && f.lang !== 'en') {
      html += '<div style="margin-top:14px;font-size:13px;color:var(--muted);">'
            + esc(cov.english_fallback_count) + ' stories available in English. '
            + '<button onclick="switchToLanguage(\'en\')" style="background:none;color:var(--navy);'
            + 'border:0;text-decoration:underline;cursor:pointer;font:inherit;padding:0;">'
            + 'Switch to English?</button></div>';
    }
    html += '</div>';
    root.innerHTML = html;
    return;
  }
  // MSN-style: first card gets the featured (hero) layout — full-width
  // image + bigger headline. The rest render compact (text + thumb).
  root.innerHTML = items.map(function (a, i) {
    return articleCardHtml(a, i === 0);
  }).join('');
}

function switchToCategory(cat) {
  document.getElementById('pick-cat').value = cat;
  const f = getFilter(); f.cat = cat; setFilter(f);
  syncCategoryTabs(cat);
  loadFeed(true);
}
function switchToLanguage(lang) {
  document.getElementById('pick-lang').value = lang;
  const f = getFilter(); f.lang = lang; setFilter(f);
  document.documentElement.lang = lang;
  if (window.Chitti && Chitti.a11y && Chitti.a11y.setLanguage) {
    try { Chitti.a11y.setLanguage(lang, { manual: true, source: 'news-switchToLanguage' }); }
    catch (e) {}
  }
  loadFeed(true);
}

// ── Core actions ──────────────────────────────────────────────────
// Sire 2026-06-02 — Tap a card → expand AND speak the entire news.
// Blind users get the full body audibly on the first tap; no
// navigation to mint/TOI/Hindu. The 🔊 button in the 5-icon strip
// remains an explicit speak (for retap-to-re-read).
// Already-expanded → tap collapses + cancels any in-flight speech.
// Tracks which article is "active" for the speaker. Updated on every
// card tap. Any in-flight async path (lazy /body fetch, deferred speak)
// checks against this before calling speak() — so that when the user
// taps a new card before the previous one's fetch resolved, the old
// fetch's spoken result doesn't barge in over the new card.
// Sire 2026-06-02: "if I click on another news, the speaker will still
// continue to speak to the earlier message".
let _activeArticleId = null;

// Rail / hero card tap — primary action is "speak the entire news"
// (faithful to the four-user contract, blind first). No visual
// expansion because rails are dense by design and a hero already shows
// the headline + image at full width. Always cancels any prior
// utterance before starting the new one — same contract as onCardTap.
function onHomeCardTap(id) {
  if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
  _activeArticleId = id;
  speakArticle(id);
}

function onCardTap(id) {
  const el = document.getElementById('art-' + id);
  if (!el) return;
  const wasExpanded = el.classList.contains('expanded');

  // Collapse any OTHER expanded card — MSN-style, one card open at a time.
  document.querySelectorAll('.art-card.expanded').forEach((other) => {
    if (other !== el) other.classList.remove('expanded');
  });

  // ALWAYS cancel the current speaker on any tap. Whether we're
  // expanding a new card or collapsing the current one, the user's
  // gesture signals "stop the old stream."
  if (window.speechSynthesis) {
    try { speechSynthesis.cancel(); } catch (e) {}
  }

  if (wasExpanded) {
    el.classList.remove('expanded');
    _activeArticleId = null;
  } else {
    el.classList.add('expanded');
    _activeArticleId = id;
    ensureFullbodyDisplayed(id);
    speakArticle(id);
  }
}

// Lazily fetch + display the full body of an article in the .art-fullbody
// container of its card. Idempotent: marks itself loaded so re-tapping
// doesn't refetch.
async function ensureFullbodyDisplayed(id) {
  const host = document.getElementById('fullbody-' + id);
  if (!host || host.dataset.loaded === '1') return;
  host.dataset.loaded = '1';
  const a = ARTICLES[id];
  const cachedBody = (a && a.content) || '';
  const summaryText = (a && a.summary) || '';

  // Sire 2026-06-02 — if the data we already have is just a short blurb
  // (image caption, headline-only article), don't pretend a fetch will
  // help. Show the honest "headline only" panel immediately. Saves a
  // round trip and stops the user from waiting on a useless "Loading…"
  const cachedWords = cachedBody.replace(/<[^>]+>/g, ' ').trim().split(/\s+/).filter(Boolean).length;
  const summaryWords = summaryText.replace(/<[^>]+>/g, ' ').trim().split(/\s+/).filter(Boolean).length;
  const isHeadlineOnly = cachedWords < 15 && summaryWords < 15;

  if (cachedWords >= 60) {
    // Rich body already in cache — render instantly.
    host.textContent = cachedBody.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    return;
  }

  if (isHeadlineOnly) {
    // No point hitting /body — backend has nothing to extract from.
    host.classList.add('summary-only-flag');
    host.innerHTML = '<div class="headline-only">'
                   + 'This is a headline-only article. The publisher (' + (a && a.source_name ? escAttr(a.source_name) : 'source')
                   + ') has not provided a body; Chitti has nothing more to read. Move on to the next story.'
                   + '</div>';
    return;
  }

  host.innerHTML = '<div class="art-fullbody-status">Loading full news…</div>';
  let body = cachedBody;
  let summaryOnly = false;
  try {
    const data = await api('/api/news/article/' + id + '/body');
    if (data && data.body && data.body.split(/\s+/).length >= 60) {
      body = data.body;
      if (a) a.content = body;
    } else {
      body = summaryText || body;
      summaryOnly = true;
    }
  } catch (e) {
    body = summaryText || body;
    summaryOnly = true;
  }
  const plain = String(body).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  if (summaryOnly) host.classList.add('summary-only-flag');
  host.textContent = plain || '(No body available.)';
  if (summaryOnly) {
    host.classList.remove('summary-only-flag');
    host.classList.add('summary-only-flag');
  }
}

function escAttr(s) {
  return String(s == null ? '' : s).replace(/"/g, '&quot;').replace(/&/g, '&amp;');
}
// Kept for backwards-compat with substrate hooks that might still call
// toggleCard(id) (e.g., older feedback-widget.js builds).
function toggleCard(id) { onCardTap(id); }

// 🔊 — reads the ENTIRE news. Per SKILLS.md feature #10 + SOP.md
// Quality Standard. Two-stage:
//   1. If a.content (RSS content:encoded) is present and substantive,
//      speak that immediately.
//   2. Otherwise (most regional sources only ship a short summary),
//      announce "Loading full news…" and lazy-fetch from
//      GET /api/news/article/<id>/body which extracts the body
//      server-side, caches it, and returns plain text. Result is
//      memoized into a.content so subsequent 🔊 clicks are instant.
async function speakArticle(id) {
  const a = ARTICLES[id]; if (!a) return;
  // Stamp this article as active for ANY speak() this function fires.
  // Every async checkpoint below verifies it's still active before
  // committing audio to the shared speechSynthesis pipe.
  _activeArticleId = id;
  const lang = getFilter().lang;
  let body = a.content || '';
  let bodySource = 'rss';
  const hasRichBody = body && body.replace(/<[^>]+>/g, ' ').trim().split(/\s+/).length >= 60;
  // Headline-only article — don't waste 5 seconds saying "One moment"
  // before reading 4 words. Say the title, the honest notice, and stop.
  const summaryWordsForCheck = (a.summary || '').replace(/<[^>]+>/g, ' ').trim().split(/\s+/).filter(Boolean).length;
  const cachedWordsForCheck = body.replace(/<[^>]+>/g, ' ').trim().split(/\s+/).filter(Boolean).length;
  if (cachedWordsForCheck < 15 && summaryWordsForCheck < 15) {
    if (_activeArticleId !== id) return;
    const txt = (a.title || '').trim() + '. '
              + 'This is a headline-only article from ' + (a.source_name || 'this source')
              + '. Chitti has nothing more to read on it.';
    speak(txt, lang);
    return;
  }
  if (!hasRichBody) {
    if (_activeArticleId !== id) return;
    speak('One moment — Chitti is fetching the full news.', lang);
    try {
      const data = await api('/api/news/article/' + id + '/body');
      if (_activeArticleId !== id) return;   // user moved on while we waited
      if (data && data.body && data.body.split(/\s+/).length >= 60) {
        body = data.body;
        bodySource = data.source || 'extracted';
        a.content = body;
      } else {
        body = a.summary || body;
        bodySource = 'summary_only';
      }
    } catch (e) {
      if (_activeArticleId !== id) return;
      body = a.summary || body;
      bodySource = 'summary_only';
    }
  }
  if (_activeArticleId !== id) return;
  const plain = String(body)
    .replace(/<[^>]+>/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 6000);
  // Sire 2026-06-02 — be honest when we only have the summary. Some
  // publishers (NDTV / TOI) block scraping behind Akamai 403s; for those
  // articles the speaker can only read the RSS summary. Don't pretend
  // it's the full news — blind users deserve to know.
  let text;
  if (bodySource === 'summary_only' && plain.split(/\s+/).length < 80) {
    text = (a.title || '').trim() + '. '
         + 'This article is summary only — the publisher does not share the full body. '
         + plain;
  } else {
    text = (a.title || '').trim() + '. ' + plain;
  }
  // Sire 2026-06-04 — blind-first trust preface. A sighted user gets
  // the Trust Strip; a blind user only hears the speak utterance, so
  // we lead with the verdict before the headline. Once per spoken
  // article. Verified is a confidence boost; disputed is a warning.
  const preface = _trustPreface(a.factcheck, lang);
  // Sire 2026-06-04 priority #2 — Chitti's Take preface, appended to
  // the trust verdict so blind users hear:
  //   "Verified by 3 other sources. Chitti's take: <insight>. <headline>. <body>"
  const insightPreface = (a.chitti_insight && String(a.chitti_insight).trim())
    ? ((lang === 'hi' ? 'चिट्टी की टेक: ' : 'Chitti\'s take: ')
       + String(a.chitti_insight).trim().replace(/[.!?]?$/, '.'))
    : '';
  if (preface || insightPreface) {
    text = [preface, insightPreface, text].filter(Boolean).join(' ');
  }
  if (_activeArticleId !== id) return;
  speak(text, lang);
}

// Spoken-form of the trust verdict, prepended to the body utterance so
// blind users hear "Verified by three sources. " before the headline.
// Kept very short (max ~12 words) — the user's primary intent is the
// news content, not the audit trail.
function _trustPreface(fc, lang) {
  if (!fc || !fc.verdict || fc.verdict === 'unchecked') return '';
  const n = fc.match_count || 0;
  if (lang === 'hi') {
    if (fc.verdict === 'verified')  return n + ' अन्य स्रोतों ने पुष्टि की।';
    if (fc.verdict === 'partial')   return n + ' अन्य स्रोतों ने यह खबर दी।';
    if (fc.verdict === 'disputed')  return 'सावधान — सिर्फ़ एक अन्य स्रोत और सुर्खियाँ अलग हैं।';
    if (fc.verdict === 'unverified') return 'अकेला स्रोत — पुष्टि बाकी।';
    return '';
  }
  if (fc.verdict === 'verified')  return 'Verified by ' + n + ' other sources.';
  if (fc.verdict === 'partial')   return n + ' other sources cover this.';
  if (fc.verdict === 'disputed')  return 'Caution — only one other source, headlines diverge.';
  if (fc.verdict === 'unverified') return 'Unverified — single source, no cross-checks yet.';
  return '';
}

function speak(text, lang) {
  // Sire 2026-06-02 — ALWAYS cancel any in-flight speech, regardless of
  // which engine is about to handle the new utterance. The
  // chitti_a11y.js substrate's Chitti.a11y.speak() may queue instead
  // of preempting; calling speechSynthesis.cancel() first guarantees
  // a hard stop on any path. Cert masks this because it stubs the
  // substrate; only the live page exposes it. Fixed by unconditional
  // cancel before delegating.
  if (window.speechSynthesis) {
    try { speechSynthesis.cancel(); } catch (e) {}
  }
  if (window.Chitti && Chitti.a11y && typeof Chitti.a11y.speak === 'function') {
    try { Chitti.a11y.speak(text); return; } catch (e) {}
  }
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = ({ en:'en-IN', hi:'hi-IN', mr:'mr-IN', ta:'ta-IN', te:'te-IN',
              bn:'bn-IN', kn:'kn-IN', ml:'ml-IN', gu:'gu-IN', pa:'pa-IN',
              or:'or-IN', ur:'ur-IN' })[lang] || 'en-IN';
  u.rate = 0.95;
  speechSynthesis.speak(u);
}

// 🤖 — "Explain Simply" — DeepSeek class-5 plain-language summary.
async function openExplain(id) {
  const host = document.getElementById('explain-' + id);
  const card = document.getElementById('art-' + id);
  if (card && !card.classList.contains('expanded')) card.classList.add('expanded');
  if (!host) return;
  host.innerHTML = '<h4>Explain simply…</h4><p>Loading…</p>';
  try {
    const data = await api('/api/news/article/' + id + '/explain?language=' + getFilter().lang);
    const txt = data.explanation || data.text || data.summary || 'No explanation available.';
    host.innerHTML = '<h4>🤖 Chitti explains simply</h4><p>' + esc(txt) + '</p>';
    speak(txt, getFilter().lang);
  } catch (e) {
    host.innerHTML = '<h4>🤖 Chitti explains simply</h4>'
      + '<p style="color:var(--muted)">Explanation unavailable. Try again in a minute.</p>';
  }
}

// ▶ — "Chitti's Take" — 3-bullet AI summary.
async function openTake(id) {
  const host = document.getElementById('take-' + id);
  if (!host) return;
  host.innerHTML = '<h4>Chitti\'s Take…</h4><p>Loading…</p>';
  try {
    const data = await api('/api/news/article/' + id + '/take?language=' + getFilter().lang);
    // Sire 2026-06-04 (decision B) — backend returns data.source =
    // "fallback" when the LLM (DeepSeek / Gemini) is unavailable; the
    // bullets in that branch are just the publisher's RSS summary
    // sliced on periods, laundered through a "Chitti's Take" header.
    // That is fake editorial value. Render an honest "unavailable"
    // panel instead. Re-show real bullets the moment data.source
    // returns to "deepseek" / a real model.
    if (data && data.source === 'fallback') {
      host.innerHTML = '<h4>▶ Chitti\'s Take</h4>'
        + '<p style="color:var(--muted);font-size:13px;line-height:1.5;">'
        + 'Chitti\'s editorial take is offline right now. The publisher\'s '
        + 'own summary is in the body above. We\'ll restore the take when '
        + 'our model budget returns — no fabricated content in the meantime.'
        + '</p>';
      return;
    }
    const bullets = data.bullets || [];
    if (bullets.length === 0) {
      host.innerHTML = '<h4>▶ Chitti\'s Take</h4>'
        + '<p style="color:var(--muted)">No take available yet.</p>';
      return;
    }
    host.innerHTML = '<h4>▶ Chitti\'s Take</h4><ul>'
      + bullets.map(b => '<li>' + esc(b.replace(/^•\s*/, '')) + '</li>').join('')
      + '</ul>';
    speak(bullets.join('. '), getFilter().lang);
  } catch (e) {
    host.innerHTML = '<h4>▶ Chitti\'s Take</h4>'
      + '<p style="color:var(--muted)">Take unavailable. Try again.</p>';
  }
}

// ✓ — Fact-check verdict with cross-source evidence.
async function openFactcheck(id) {
  const host = document.getElementById('fact-' + id);
  if (!host) return;
  host.innerHTML = '<h4>Fact check…</h4><p>Loading…</p>';
  try {
    const data = await api('/api/news/article/' + id + '/factcheck');
    const v = data.verdict || 'unchecked';
    const rationale = data.rationale || data.summary || 'No supporting evidence available.';
    host.innerHTML = '<h4>✓ Fact check — ' + esc(v.toUpperCase()) + '</h4>'
      + '<p>' + esc(rationale) + '</p>';
  } catch (e) {
    host.innerHTML = '<h4>✓ Fact check</h4>'
      + '<p style="color:var(--muted)">Fact check unavailable.</p>';
  }
}

// 👍👎 — Save / Cancel article for For-You + Read Later folders.
async function saveArticle(id, folder) {
  try {
    await api('/api/news/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ article_id: id, folder: folder }),
    });
    const btn = event && event.target && event.target.closest('button');
    if (btn) {
      btn.classList.add('live');
      setTimeout(() => btn.classList.remove('live'), 1200);
    }
  } catch (e) { /* honest stub — feedback still recorded locally */ }
}

// ✏️ — Open the feedback modal. The substrate's chitti-fb-box-bar is
// hidden via CSS but still in the DOM with its event handlers attached.
// Programmatically clicking its 👎 opens the feedback modal — same UX
// every Chitti page provides via the locked per-response widget.
function openFeedback(boxId) {
  const bar = document.querySelector('.chitti-fb-box-bar[data-for-box="' + boxId + '"]');
  if (bar) {
    const down = bar.querySelector('[data-act="down"]');
    if (down) { down.click(); return; }
  }
  // Fallback when substrate hasn't hydrated yet — captures the note
  // locally so user input isn't lost.
  const note = prompt('What can Chitti do better?');
  if (note) {
    try {
      fetch(API_BASE + '/api/feedback/collect', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          page: 'chitti_news', box_id: boxId, kind: 'down', note: note,
        }),
      }).catch(() => {});
    } catch (e) {}
  }
}

// 📲 — Share with a verify-with-source disclaimer baked in.
function shareArticle(id) {
  const a = ARTICLES[id]; if (!a) return;
  const disclaimer = '\n\nVerify on ' + (a.source_name || 'source') + ' before sharing.';
  const text = (a.title || '') + '\n' + (a.link || '') + disclaimer;
  if (navigator.share) {
    navigator.share({ title: a.title, text: text, url: a.link }).catch(() => {});
  } else {
    const wa = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(text);
    window.open(wa, '_blank', 'noopener');
  }
}

// ── Feed loader ───────────────────────────────────────────────────
// Sire 2026-06-03 — "when I selected malayalam, why is it coming in
// english". Root cause: en/entertainment fetch fired BEFORE the ml
// switch could land its own empty state. The earlier response landed
// LAST and overwrote the empty status with 30 stale English cards.
// Fix: every loadFeed call mints a token; only the latest token may
// write to the DOM. Stale responses are discarded silently.
let _feedToken = 0;
async function loadFeed(force) {
  const f = getFilter();
  // Amazon-style home: National = the home page with sub-category rails.
  if (f.cat === 'national') return loadHome();
  const myToken = ++_feedToken;
  const root = document.getElementById('feed-root');
  root.setAttribute('aria-busy', 'true');
  root.innerHTML = '<div class="status-card">Loading…</div>';
  try {
    if (f.cat === 'saved' || f.cat === 'cancelled') {
      const data = await api('/api/news/save?folder=' + f.cat);
      if (myToken !== _feedToken) return;
      const items = (data.items || []).map(r => r.article);
      renderFeed(items, { speak_en: 'Your ' + f.cat + ' folder.' });
    } else if (f.cat === 'foryou') {
      // For-You is a UX shim — fetch national + filter client-side per
      // localStorage profile. Backend personalisation lives in v1.1.
      const data = await api('/api/news/feed?state=' + f.state
                          + '&language=' + f.lang + '&category=national');
      if (myToken !== _feedToken) return;
      renderFeed(data.items || [], data);
    } else {
      const data = await api('/api/news/feed?state=' + f.state
                          + '&language=' + f.lang + '&category=' + f.cat);
      if (myToken !== _feedToken) return;
      renderFeed(data.items || [], data);
    }
  } catch (e) {
    if (myToken !== _feedToken) return;
    root.innerHTML = '<div class="status-card">'
      + '<strong>Backend unreachable.</strong><br>'
      + 'Pull to refresh in a minute — chitti-news-api may be cold-starting.'
      + '<br><small style="color:var(--muted)">' + esc(String(e)) + '</small>'
      + '</div>';
  } finally {
    if (myToken === _feedToken) root.setAttribute('aria-busy', 'false');
  }
}

// ── Boot ──────────────────────────────────────────────────────────
hydratePickers();
loadFeed(false);

// Sire 2026-06-03 — chitti_a11y.js's chitti-disability-profile-modal
// was intercepting pointer events on chitti_news.html — tap on a
// category tab or the language picker did nothing because the modal
// (sometimes invisible to the user) ate the click. Probe confirmed
// the failure: "<div id=chitti-disability-profile-modal> subtree
// intercepts pointer events". Per memory [project_user_disability_profile_locked]
// the modal should be one-time-per-device; if it's reappearing for a
// returning chitti-news user, it's a substrate bug — but rather than
// fight the substrate from here we just dismiss it when the user has
// clearly already engaged with the page (a saved filter pref proves
// they've used Chitti News before, so the disability prompt is not
// the right blocker).
(function autoSkipDisabilityModalIfReturning() {
  const hasFilterPrefs = ['chitti_news_lang', 'chitti_news_state', 'chitti_news_category']
    .some(function (k) { try { return !!localStorage.getItem(k); } catch (e) { return false; } });
  if (!hasFilterPrefs) return;
  function tryDismiss() {
    const m = document.getElementById('chitti-disability-profile-modal');
    if (!m) return false;
    // Prefer the substrate's "skip" button so localStorage is set
    // consistently. Fall back to removing the node entirely if no
    // skip button is exposed.
    const skip = m.querySelector('button[data-act="skip"], .chitti-dp-skip, [aria-label="Skip"]');
    if (skip) { try { skip.click(); return true; } catch (e) {} }
    m.remove();
    // Persist the skip under the substrate's actual storage key
    // (`disability_profile`, set by chitti_disability_profile.js:39).
    // Previously this wrote `chitti_disability_profile_v1` which the
    // substrate never reads — so the modal kept re-injecting on every
    // load. Sire 2026-06-03 caught this when the live screenshot still
    // showed the modal covering the hero card.
    try {
      localStorage.setItem('disability_profile', JSON.stringify({
        skipped: true, skippedAt: new Date().toISOString(),
        skipReason: 'returning-news-user-auto-skip',
      }));
    } catch (e) {}
    return true;
  }
  if (tryDismiss()) return;
  // Substrate may inject the modal asynchronously after our boot —
  // retry briefly so we catch the late insertion.
  let attempts = 0;
  const iv = setInterval(function () {
    attempts++;
    if (tryDismiss() || attempts > 20) clearInterval(iv);
  }, 250);
})();
