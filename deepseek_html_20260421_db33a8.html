<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chitti — Your AI Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .chitti-container {
            max-width: 500px;
            width: 100%;
            background: #16213e;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            height: 700px;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .chitti-header {
            background: #0f3460;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #1a4a7a;
        }

        .chitti-avatar {
            width: 48px;
            height: 48px;
            background: #e94560;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .chitti-title {
            color: white;
        }

        .chitti-title h1 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .chitti-title p {
            font-size: 12px;
            opacity: 0.8;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e94560;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: white;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #4ade80;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.chitti .message-bubble {
            background: #1e2a4a;
            color: white;
            border-bottom-left-radius: 4px;
        }

        .message.user .message-bubble {
            background: #e94560;
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* Input Area */
        .input-area {
            padding: 16px;
            background: #0f3460;
            display: flex;
            gap: 12px;
            align-items: center;
            border-top: 1px solid #1a4a7a;
        }

        .mic-button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #e94560;
            border: none;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-button.listening {
            background: #ff4444;
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .mic-button:active {
            transform: scale(0.95);
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: none;
            background: #1e2a4a;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .send-button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #4ade80;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }

        .send-button:active {
            transform: scale(0.95);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #1e2a4a;
            border-radius: 18px;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #888;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        .chat-area::-webkit-scrollbar {
            width: 4px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: #1e2a4a;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="chitti-container">
        <!-- Header -->
        <div class="chitti-header">
            <div class="chitti-avatar">C</div>
            <div class="chitti-title">
                <h1>Chitti <span class="status-dot"></span></h1>
                <p>Bharat ka apna AI · Online</p>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chatArea">
            <div class="message chitti">
                <div class="message-avatar">C</div>
                <div class="message-bubble">
                    Namaste! 🙏 Main Chitti hoon — aapka personal assistant, coach, aur guardian. Kya main aapki madad kar sakta hoon?
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <button class="mic-button" id="micBtn" title="Tap to speak">🎤</button>
            <input type="text" class="input-field" id="textInput" placeholder="Type or speak..." autocomplete="off">
            <button class="send-button" id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        // DeepSeek API Key (Free)
        const DEEPSEEK_API_KEY = 'sk-372a74292a8c407abaaf673aab58c3f1';
        
        // DOM Elements
        const chatArea = document.getElementById('chatArea');
        const micBtn = document.getElementById('micBtn');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        
        // State
        let isListening = false;
        let recognition = null;
        
        // Initialize Speech Recognition
        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'hi-IN'; // Hindi + English
        
                recognition.onstart = () => {
                    isListening = true;
                    micBtn.classList.add('listening');
                    micBtn.textContent = '🔴';
                };
        
                recognition.onend = () => {
                    isListening = false;
                    micBtn.classList.remove('listening');
                    micBtn.textContent = '🎤';
                };
        
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    textInput.value = transcript;
                    sendMessage();
                };
        
                recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    isListening = false;
                    micBtn.classList.remove('listening');
                    micBtn.textContent = '🎤';
                    addMessage('chitti', 'Sorry, main sun nahi paya. Please type karein ya phir se bolein. 🎤');
                };
            } else {
                console.warn('Speech recognition not supported');
                micBtn.style.opacity = '0.5';
                micBtn.disabled = true;
            }
        }
        
        // Add message to chat
        function addMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.innerHTML = `
                <div class="message-avatar">${sender === 'chitti' ? 'C' : '👤'}</div>
                <div class="message-bubble">${text}</div>
            `;
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            
            // If Chitti speaks, use TTS
            if (sender === 'chitti') {
                speakText(text);
            }
        }
        
        // Text to Speech
        function speakText(text) {
            if (!window.speechSynthesis) return;
            
            // Cancel any ongoing speech
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            utterance.volume = 1;
            
            // Try to find a Hindi voice
            const voices = window.speechSynthesis.getVoices();
            const hindiVoice = voices.find(v => v.lang.includes('hi'));
            if (hindiVoice) {
                utterance.voice = hindiVoice;
            }
            
            window.speechSynthesis.speak(utterance);
        }
        
        // Show typing indicator
        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message chitti';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="message-avatar">C</div>
                <div class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            `;
            chatArea.appendChild(typingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        // Hide typing indicator
        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) {
                typing.remove();
            }
        }
        
        // Call DeepSeek API
        async function callDeepSeek(userMessage) {
            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            {
                                role: 'system',
                                content: `You are Chitti — Bharat ka apna AI. You are a warm, helpful, and witty assistant. 
                                You speak Hinglish (Hindi + English mix). You are like a trusted friend — not robotic. 
                                Keep responses short (2-3 sentences). Use emojis naturally. Be helpful and cheerful.`
                            },
                            {
                                role: 'user',
                                content: userMessage
                            }
                        ],
                        max_tokens: 300,
                        temperature: 0.7
                    })
                });
                
                const data = await response.json();
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    return data.choices[0].message.content;
                } else {
                    return "Mujhe samajh nahi aaya. Kya aap dubara bata sakte hain? 🤔";
                }
            } catch (error) {
                console.error('DeepSeek API error:', error);
                return "Mujhe internet connection mein problem ho rahi hai. Thodi der baad try karein. 🔄";
            }
        }
        
        // Send message
        async function sendMessage() {
            const userMessage = textInput.value.trim();
            if (!userMessage) return;
            
            // Clear input
            textInput.value = '';
            
            // Add user message to chat
            addMessage('user', userMessage);
            
            // Show typing indicator
            showTyping();
            
            // Get response from DeepSeek
            const response = await callDeepSeek(userMessage);
            
            // Hide typing indicator
            hideTyping();
            
            // Add Chitti's response
            addMessage('chitti', response);
        }
        
        // Handle enter key
        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // Send button click
        sendBtn.addEventListener('click', sendMessage);
        
        // Mic button click
        micBtn.addEventListener('click', () => {
            if (recognition) {
                if (isListening) {
                    recognition.stop();
                } else {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error('Could not start recognition:', e);
                    }
                }
            }
        });
        
        // Initialize voices when ready
        window.speechSynthesis.onvoiceschanged = () => {
            console.log('Voices loaded');
        };
        
        // Initialize
        initSpeechRecognition();
        
        // Welcome message with voice
        setTimeout(() => {
            speakText("Namaste! 🙏 Main Chitti hoon — aapka personal assistant, coach, aur guardian. Kya main aapki madad kar sakta hoon?");
        }, 500);
    </script>
</body>
</html>
