# Consolidated Render Blueprint for Sahay AI
# ------------------------------------------------------------------
# Five Chitti backends provisioned by a single Blueprint apply.
# chitti-medupi-api is NOT listed here — it lives in
# chitti-medupi/render.yaml and is already deployed.
#
# Each service uses `rootDir` relative to the repo root.
# Free-tier Postgres (Supabase) is shared across services; each
# service isolates its tables under its own schema (see
# backend/models/_schema.py in each subdir).

services:
  # ───────────────────── 1. chitti-news-api ─────────────────────
  - type: web
    name: chitti-news-api
    runtime: python
    plan: free
    rootDir: chitti-news/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DATABASE_URL
        sync: false        # paste Supabase URL in dashboard
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: ALLOWED_ORIGINS
        value: "https://sahayai.in,https://www.sahayai.in"
      - key: BACKEND_URL
        value: https://chitti-news-api.onrender.com
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: RSS_POLL_MINUTES
        value: "30"
      - key: BRAVE_SEARCH_API_KEY
        sync: false

  # ─────────────────── 2. chitti-government-api ───────────────────
  - type: web
    name: chitti-government-api
    runtime: python
    plan: free
    rootDir: chitti-government/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DATABASE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_URL
        value: https://api.deepseek.com/chat/completions
      - key: DEEPSEEK_MAX_TOKENS
        value: "700"
      - key: DEEPSEEK_TEMPERATURE
        value: "0.2"
      - key: ALLOWED_ORIGINS
        value: "https://sahayai.in,https://www.sahayai.in"
      - key: BACKEND_URL
        value: https://chitti-government-api.onrender.com
      - key: NOMINATIM_URL
        value: https://nominatim.openstreetmap.org
      - key: NOMINATIM_CONTACT_EMAIL
        value: chittigovernment@gmail.com
      - key: NOMINATIM_USER_AGENT
        value: ChittiGovernment/1.0 (https://sahayai.in/chitti_government.html)
      - key: PIB_POLL_HOURS
        value: "6"
      - key: SCHEDULER_ENABLED
        value: "true"

  # ──────────────────── 3. chitti-vaani-api ────────────────────
  # NOTE: rootDir fixed to repo-root-relative (was `backend` in the
  # subdir yaml, which would have resolved to <repo>/backend).
  - type: web
    name: chitti-vaani-api
    runtime: python
    plan: free
    rootDir: chitti-vaani/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: ALLOWED_ORIGINS
        value: "https://sahayai.in,https://www.sahayai.in"
      - key: VAANI_MAX_TOKENS
        value: "600"
      - key: VAANI_TEMPERATURE
        value: "0.4"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://chitti-vaani-api.onrender.com/api/vaani/email/auth/callback
      - key: VAANI_TOKEN_DB
        value: /tmp/chitti_vaani_tokens.sqlite
      - key: VAANI_RELAY_DB
        value: /tmp/chitti_vaani_relay.sqlite

  # ──────────────────── 4. chitti-ca-api ────────────────────
  - type: web
    name: chitti-ca-api
    runtime: python
    plan: free
    rootDir: chitti-ca/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: ALLOWED_ORIGINS
        value: "https://sahayai.in,https://www.sahayai.in"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: CA_MAX_TOKENS
        value: "700"
      - key: CA_TEMPERATURE
        value: "0.3"

  # ──────────────────── 5. chitti-legal-api ────────────────────
  - type: web
    name: chitti-legal-api
    runtime: python
    plan: free
    rootDir: chitti-legal/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: ALLOWED_ORIGINS
        value: "https://sahayai.in,https://www.sahayai.in"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: LEGAL_MAX_TOKENS
        value: "800"
      - key: LEGAL_TEMPERATURE
        value: "0.25"
