<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SAHAY AI — Bharat ka apna Chitti</title>
  <meta name="description" content="Chitti — Coming soon. For every Indian."/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --navy:#080F1A;
      --saffron:#FF6B00;
      --green:#138808;
      --white:#FFFFFF;
      --grey:#9A9A9A;
      --border:rgba(255,255,255,0.08);
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px 60px;
      overflow-x: hidden;
    }
    .tricolour { position:fixed; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--saffron) 33.3%,var(--white) 33.3% 66.6%,var(--green) 66.6%); z-index:100; }
    .bg-orbs { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
    .orb { position:absolute; border-radius:50%; filter:blur(90px); animation:drift 14s ease-in-out infinite alternate; }
    .orb1 { width:500px; height:500px; background:rgba(255,107,0,0.06); top:-150px; left:-100px; }
    .orb2 { width:400px; height:400px; background:rgba(19,136,8,0.05); bottom:-100px; right:-100px; animation-delay:-6s; }
    @keyframes drift { from{transform:translate(0,0);} to{transform:translate(30px,25px);} }
    .content { position:relative; z-index:1; max-width:460px; width:100%; }
    .robot-wrap { margin-bottom:32px; animation:float 3.5s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-14px);} }
    .robot { width:88px; height:88px; background:linear-gradient(135deg,var(--saffron),#FF3D00); border-radius:22px; display:flex; align-items:center; justify-content:center; font-size:46px; margin:0 auto; box-shadow:0 0 60px rgba(255,107,0,0.35),0 0 120px rgba(255,107,0,0.12); position:relative; }
    .robot::after { content:''; position:absolute; inset:-3px; border-radius:25px; border:1px solid rgba(255,107,0,0.4); animation:pulse-ring 2.5s ease-in-out infinite; }
    @keyframes pulse-ring { 0%,100%{opacity:0.7;transform:scale(1);} 50%{opacity:0;transform:scale(1.18);} }
    .logo { font-family:'Playfair Display',serif; font-size:clamp(40px,8vw,60px); font-weight:900; letter-spacing:-1px; margin-bottom:6px; animation:fadeUp 0.9s ease both; }
    .logo span { color:var(--saffron); }
    .tagline { font-size:11px; font-weight:600; letter-spacing:4px; text-transform:uppercase; color:var(--grey); margin-bottom:52px; animation:fadeUp 0.9s 0.1s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(18px);} to{opacity:1;transform:translateY(0);} }
    .cd-label { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--saffron); margin-bottom:18px; animation:fadeUp 0.9s 0.2s ease both; }
    .countdown { display:flex; gap:12px; justify-content:center; margin-bottom:52px; flex-wrap:wrap; animation:fadeUp 0.9s 0.3s ease both; }
    .cd-box { background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:16px; padding:20px 22px; min-width:82px; transition:border-color 0.3s; }
    .cd-box:hover { border-color:rgba(255,107,0,0.35); }
    .cd-num { display:block; font-size:38px; font-weight:700; color:var(--white); line-height:1; font-variant-numeric:tabular-nums; }
    .cd-unit { display:block; font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--grey); margin-top:6px; }
    .btn-wa { display:inline-flex; align-items:center; gap:10px; background:#25D366; color:var(--white); padding:16px 38px; border-radius:100px; font-size:16px; font-weight:700; text-decoration:none; transition:all 0.2s; box-shadow:0 8px 28px rgba(37,211,102,0.22); animation:fadeUp 0.9s 0.4s ease both; margin-bottom:12px; }
    .btn-wa:hover { background:#1fb855; transform:translateY(-2px); box-shadow:0 12px 36px rgba(37,211,102,0.32); }
    .wa-hint { font-size:12px; color:rgba(255,255,255,0.28); margin-bottom:48px; animation:fadeUp 0.9s 0.5s ease both; }
    .launch-tag { display:inline-block; background:rgba(19,136,8,0.1); border:1px solid rgba(19,136,8,0.22); border-radius:100px; padding:8px 24px; font-size:13px; font-weight:600; color:#2ECC71; letter-spacing:1px; animation:fadeUp 0.9s 0.6s ease both; }
    footer { position:fixed; bottom:0; left:0; right:0; text-align:center; padding:14px; font-size:11px; color:rgba(255,255,255,0.18); border-top:1px solid var(--border); background:rgba(8,15,26,0.85); backdrop-filter:blur(8px); z-index:10; }
    @media(max-width:420px) { .logo{font-size:34px;} .cd-box{padding:14px 14px;min-width:68px;} .cd-num{font-size:28px;} }
  </style>
</head>
<body>
<div class="tricolour"></div>
<div class="bg-orbs"><div class="orb orb1"></div><div class="orb orb2"></div></div>
<div class="content">
  <div class="robot-wrap"><div class="robot">🤖</div></div>
  <h1 class="logo">SAHAY <span>AI</span></h1>
  <p class="tagline">Bharat ka apna Chitti</p>
  <p class="cd-label">🚀 Something big is coming for every Indian</p>
  <div class="countdown">
    <div class="cd-box"><span class="cd-num" id="cd-days">29</span><span class="cd-unit">Days</span></div>
    <div class="cd-box"><span class="cd-num" id="cd-hours">00</span><span class="cd-unit">Hours</span></div>
    <div class="cd-box"><span class="cd-num" id="cd-mins">00</span><span class="cd-unit">Mins</span></div>
    <div class="cd-box"><span class="cd-num" id="cd-secs">00</span><span class="cd-unit">Secs</span></div>
  </div>
  <a href="https://wa.me/919403721332?text=Hi%20Chitti" class="btn-wa" target="_blank">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    Say Hi to Chitti 🤖
  </a>
  <p class="wa-hint">+91 94037 21332</p>
  <div class="launch-tag">🇮🇳 May 1, 2026 — Labour Day</div>
</div>
<footer>© 2026 SAHAY AI · sahayai.in</footer>
<script>
  const launch = new Date('2026-05-01T00:00:00+05:30').getTime();
  function tick() {
    const diff = Math.max(0, launch - Date.now());
    const pad = n => String(Math.floor(n)).padStart(2,'0');
    document.getElementById('cd-days').textContent  = pad(diff/86400000);
    document.getElementById('cd-hours').textContent = pad((diff%86400000)/3600000);
    document.getElementById('cd-mins').textContent  = pad((diff%3600000)/60000);
    document.getElementById('cd-secs').textContent  = pad((diff%60000)/1000);
  }
  tick(); setInterval(tick,1000);
</script>
</body>
</html>
