<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sahay AI — Chitti v45</title>
<style>
/* ── EVOLVED DESIGN TOKENS ─────────────────────── */
:root {
  --saffron: #E8520A;
  --navy:    #1B3A6B;
  --green:   #1A7A4A;
  --bg:      #F8F4F0;
  --surface: #FFFFFF;
  --text:    #1A1A1A;
  --shadow:  0 4px 12px rgba(0,0,0,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  max-width: 480px;
  margin: 0 auto;
  line-height: 1.5;
}

/* ── MODULAR PAGE SYSTEM ───────────────────────── */
.page { 
  display: none; 
  min-height: 100vh; 
  padding: 20px;
  opacity: 0;
  transition: opacity 0.3s ease-in-out;
}
.page.active { 
  display: flex; 
  flex-direction: column; 
  opacity: 1; 
}

/* ── ENHANCED CARDS ────────────────────────────── */
.card {
  background: var(--surface);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  border: 1px solid transparent;
  transition: transform 0.2s, border-color 0.2s;
}
.card:active { transform: scale(0.98); }
.card.selected { border-color: var(--saffron); background: rgba(232,82,10,0.02); }

/* ── VOICE INTERFACE ───────────────────────────── */
.voice-node {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--navy);
  color: white;
  padding: 12px 16px;
  border-radius: 50px;
  margin-bottom: 20px;
}

.spkr-btn {
  background: var(--saffron);
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(232,82,10,0.3);
}

/* ── DYNAMIC BUTTONS ───────────────────────────── */
.btn-primary {
  width: 100%;
  padding: 18px;
  background: var(--saffron);
  border: none;
  border-radius: 16px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
}
</style>
</head>
<body>

<main id="app-shell">
  <section class="page active" id="pg-splash">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">
       <div class="card" style="background:var(--navy); color:white; text-align:center;">
          <h1 style="letter-spacing:4px;">SAHAY AI</h1>
          <p style="color:var(--saffron); font-style:italic;">Chitti is warming up...</p>
       </div>
       <button class="btn-primary" onclick="App.nav('pg-lang')">Get Started →</button>
    </div>
  </section>

  <section class="page" id="pg-lang">
    <div class="voice-node">
       <button class="spkr-btn">🔊</button>
       <span>"Namaste! Which language should we use?"</span>
    </div>
    
    <div class="card selected" onclick="App.setLang('en')">
       <strong>English</strong>
       <p style="font-size:0.8rem; opacity:0.7;">Global communication</p>
    </div>

    <div class="card" onclick="App.setLang('hi')">
       <strong>हिंदी</strong>
       <p style="font-size:0.8rem; opacity:0.7;">भारत की धड़कन</p>
    </div>
    
    <button class="btn-primary" onclick="App.nav('pg-privacy')">Next Step</button>
  </section>
</main>

<script>
/* ── CENTRALIZED STATE MANAGER ─────────────────── */
const App = {
  state: {
    lang: 'en',
    currentPage: 'pg-splash',
    user: {}
  },

  nav(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    this.state.currentPage = pageId;
    this.save();
  },

  setLang(l) {
    this.state.lang = l;
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    event.currentTarget.classList.add('selected');
    this.save();
  },

  save() {
    localStorage.setItem('SAHAY_CORE', JSON.stringify(this.state));
  },

  init() {
    const backup = localStorage.getItem('SAHAY_CORE');
    if(backup) {
      this.state = JSON.parse(backup);
      this.nav(this.state.currentPage);
    }
  }
};

window.onload = () => App.init();
</script>
</body>
</html>
