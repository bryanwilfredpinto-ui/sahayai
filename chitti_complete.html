<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Chitti — Bharat ka apna AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        /* WhatsApp-style container */
        .app {
            max-width: 450px;
            width: 100%;
            background: #1e1e2e;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            height: 750px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header - Like WhatsApp */
        .header {
            background: #0f3460;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #1a4a7a;
        }

        .avatar {
            width: 44px;
            height: 44px;
            background: #e94560;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: white;
        }

        .header-info {
            flex: 1;
        }

        .header-info h1 {
            font-size: 18px;
            color: white;
            margin-bottom: 2px;
        }

        .header-info p {
            font-size: 12px;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #16213e;
        }

        /* Message Bubbles - Like WhatsApp */
        .message {
            display: flex;
            gap: 8px;
            max-width: 85%;
            animation: fadeIn 0.2s ease;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e94560;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #4ade80;
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.45;
            word-wrap: break-word;
        }

        .message.chitti .message-bubble {
            background: #1e2a4a;
            color: white;
            border-bottom-left-radius: 4px;
        }

        .message.user .message-bubble {
            background: #e94560;
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* Typing Indicator */
        .typing {
            display: flex;
            gap: 4px;
            padding: 10px 14px;
            background: #1e2a4a;
            border-radius: 18px;
            width: fit-content;
        }

        .typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #888;
            animation: typingAnim 1.4s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingAnim {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Suggested Replies - Like Google Messages */
        .suggestions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 12px 16px;
            background: #0f3460;
            border-top: 1px solid #1a4a7a;
        }

        .suggestion-chip {
            padding: 8px 16px;
            background: #1e2a4a;
            border: 1px solid #2a3a5a;
            border-radius: 20px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-chip:active {
            background: #e94560;
            transform: scale(0.96);
        }

        /* Input Area */
        .input-area {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background: #0f3460;
            border-top: 1px solid #1a4a7a;
            align-items: center;
        }

        .mic-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #e94560;
            border: none;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn.listening {
            background: #ff4444;
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .mic-btn:active {
            transform: scale(0.95);
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: none;
            background: #1e2a4a;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #4ade80;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        .chat-area::-webkit-scrollbar {
            width: 4px;
        }
        .chat-area::-webkit-scrollbar-track {
            background: #1e2a4a;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Header -->
    <div class="header">
        <div class="avatar">C</div>
        <div class="header-info">
            <h1>Chitti</h1>
            <p><span class="status-dot"></span> Online · Bharat ka apna AI</p>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea">
        <div class="message chitti">
            <div class="message-avatar">C</div>
            <div class="message-bubble">
                Namaste! 🙏 Main Chitti hoon — aapka personal assistant, coach, aur guardian. Kya main aapki madad kar sakta hoon?
            </div>
        </div>
    </div>

    <!-- Suggested Replies -->
    <div class="suggestions" id="suggestions">
        <div class="suggestion-chip" data-reply="Yes, tell me more">Yes, tell me more</div>
        <div class="suggestion-chip" data-reply="Explain simply">Explain simply</div>
        <div class="suggestion-chip" data-reply="Give me an example">Give me an example</div>
        <div class="suggestion-chip" data-reply="Remind me later">Remind me later</div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <button class="mic-btn" id="micBtn">🎤</button>
        <input type="text" class="input-field" id="textInput" placeholder="Type or speak..." autocomplete="off">
        <button class="send-btn" id="sendBtn">➤</button>
    </div>
</div>

<script>
    // DeepSeek API Key (Free)
    const DEEPSEEK_API_KEY = 'sk-372a74292a8c407abaaf673aab58c3f1';
    
    // DOM Elements
    const chatArea = document.getElementById('chatArea');
    const micBtn = document.getElementById('micBtn');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    
    // State
    let isListening = false;
    let recognition = null;
    
    // Add message to chat
    function addMessage(sender, text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}`;
        messageDiv.innerHTML = `
            <div class="message-avatar">${sender === 'chitti' ? 'C' : '👤'}</div>
            <div class="message-bubble">${escapeHtml(text)}</div>
        `;
        chatArea.appendChild(messageDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
        
        if (sender === 'chitti') {
            speakText(text);
        }
    }
    
    // Escape HTML to prevent injection
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Text to Speech
    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'hi-IN';
        utterance.rate = 0.9;
        utterance.pitch = 1.05;
        
        const voices = window.speechSynthesis.getVoices();
        const hindiVoice = voices.find(v => v.lang.includes('hi'));
        if (hindiVoice) utterance.voice = hindiVoice;
        
        window.speechSynthesis.speak(utterance);
    }
    
    // Show typing indicator
    function showTyping() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message chitti';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = `
            <div class="message-avatar">C</div>
            <div class="typing"><span></span><span></span><span></span></div>
        `;
        chatArea.appendChild(typingDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
    }
    
    function hideTyping() {
        const typing = document.getElementById('typingIndicator');
        if (typing) typing.remove();
    }
    
    // Call DeepSeek API
    async function callDeepSeek(userMessage) {
        try {
            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
                },
                body: JSON.stringify({
                    model: 'deepseek-chat',
                    messages: [
                        {
                            role: 'system',
                            content: `You are Chitti — Bharat ka apna AI. Warm, helpful, witty. Speak Hinglish (Hindi+English). Short responses (2-3 sentences). Use emojis naturally.`
                        },
                        { role: 'user', content: userMessage }
                    ],
                    max_tokens: 300,
                    temperature: 0.7
                })
            });
            const data = await response.json();
            if (data.choices?.[0]?.message?.content) {
                return data.choices[0].message.content;
            }
            return "Mujhe samajh nahi aaya. Kya aap dubara bata sakte hain? 🤔";
        } catch (error) {
            return "Internet connection issue. Thodi der baad try karein. 🔄";
        }
    }
    
    // Send message
    async function sendMessage() {
        const userMessage = textInput.value.trim();
        if (!userMessage) return;
        
        textInput.value = '';
        addMessage('user', userMessage);
        showTyping();
        
        const response = await callDeepSeek(userMessage);
        hideTyping();
        addMessage('chitti', response);
    }
    
    // Initialize Speech Recognition
    function initSpeech() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            micBtn.style.opacity = '0.5';
            micBtn.disabled = true;
            return;
        }
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'hi-IN';
        
        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('listening');
            micBtn.textContent = '🔴';
        };
        
        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.textContent = '🎤';
        };
        
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            textInput.value = transcript;
            sendMessage();
        };
        
        recognition.onerror = () => {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.textContent = '🎤';
        };
    }
    
    // Event Listeners
    sendBtn.addEventListener('click', sendMessage);
    textInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
    
    micBtn.addEventListener('click', () => {
        if (recognition) {
            if (isListening) recognition.stop();
            else recognition.start();
        }
    });
    
    // Suggested replies
    document.querySelectorAll('.suggestion-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            textInput.value = chip.getAttribute('data-reply');
            sendMessage();
        });
    });
    
    // Initialize
    initSpeech();
    
    // Welcome voice
    setTimeout(() => {
        speakText("Namaste! Main Chitti hoon. Kya main aapki madad kar sakta hoon?");
    }, 500);
</script>
</body>
</html>
