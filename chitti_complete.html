<script>
    const VAULT_URL = "https://raw.githubusercontent.com/bryanwilfredpinto-ui/sahayai/main/specialist_Bangla.json";

    async function updateTranscript(lang) {
        try {
            const response = await fetch(VAULT_URL);
            const data = await response.json();
            
            // This updates the badge with your 96% certification score
            const statusBadge = document.getElementById('chitti-status'); 
            if(statusBadge) statusBadge.innerText = `Chitti: ${data.status} (Score: ${data.score})`;

            const transcript = document.getElementById('transcript');
            if(lang === 'bn') {
                transcript.innerHTML = "<p><b>Chitti:</b> আমি আপনাকে সাহায্য করতে পারি। (I can help you.)</p>";
            } else if(lang === 'hi') {
                transcript.innerHTML = "<p><b>Chitti:</b> मैं आपकी मदद कर सकता हूँ।</p>";
            } else {
                transcript.innerHTML = "<p><b>Chitti:</b> I am here to assist you.</p>";
            }
        } catch (error) {
            console.error("Vault access failed:", error);
        }
    }
</script>
