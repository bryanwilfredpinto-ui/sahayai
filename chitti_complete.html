<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SAHAY | CHITTI PA HYBRID</title>
    <style>
        :root { --saffron: #E86A17; --navy: #0E2344; --gold: #D4AF37; }
        body { margin: 0; font-family: sans-serif; background: #f0f2f5; display: flex; flex-direction: column; height: 100vh; }
        header { background: var(--navy); color: white; padding: 15px 30px; border-bottom: 4px solid var(--saffron); font-weight: bold; display: flex; justify-content: space-between; }
        .container { display: grid; grid-template-columns: 1fr 350px; gap: 20px; padding: 20px; flex: 1; }
        .main-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .orb { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, var(--saffron), var(--gold)); margin: 0 auto 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; font-size: 40px; transition: 0.3s; border: none; outline: none; }
        .pulse { animation: p 1.5s infinite; box-shadow: 0 0 0 10px rgba(232, 106, 23, 0.2); }
        @keyframes p { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #userInput { width: 100%; border: 2px dashed var(--gold); border-radius: 12px; padding: 20px; min-height: 80px; margin-top: 20px; box-sizing: border-box; font-size: 16px; background: #fff8e1; color: #5d4037; resize: none; outline: none; }
        .ledger { background: var(--navy); color: white; border-radius: 20px; padding: 20px; border-left: 6px solid var(--gold); }
        .status-tag { color: var(--gold); font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .btn-exec { background: var(--saffron); color: white; border: none; padding: 15px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; font-size: 16px; }
    </style>
</head>
<body>

<header>
    <div>SAHAY | CHITTI PA</div>
    <div id="cycleStatus" style="color: var(--gold)">SYSTEM READY</div>
</header>

<div class="container">
    <div class="main-card">
        <button id="orb" class="orb" onclick="toggleVoice()">C</button>
        <h3 id="displayHeader">Voice or Type your Command, Sire.</h3>
        
        <textarea id="userInput" placeholder="Speak now or type your command here..."></textarea>
        
        <button class="btn-exec" onclick="manualExecute()">STOP & CERTIFY</button>
    </div>

    <div class="ledger">
        <span class="status-tag">Sire Execution Ledger</span>
        <p id="ledgerTask" style="font-size: 14px; margin-top: 15px; color: #cbd5e0;">Awaiting Input...</p>
        <hr style="border: 0; border-top: 1px solid #2d3748; margin: 15px 0;">
        <span class="status-tag">Current Stage</span>
        <p id="ledgerStage" style="color: var(--gold); font-weight: bold;">IDLE</p>
    </div>
</div>

<script>
    let isListening = false;
    const recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
    recognition.lang = 'en-IN';
    recognition.continuous = true;
    recognition.interimResults = true;

    function toggleVoice() {
        if (!isListening) {
            try {
                recognition.start();
                isListening = true;
                document.getElementById('orb').classList.add('pulse');
                document.getElementById('cycleStatus').innerText = "LISTENING...";
            } catch(e) { console.error(e); }
        } else {
            stopVoice();
        }
    }

    function stopVoice() {
        recognition.stop();
        isListening = false;
        document.getElementById('orb').classList.remove('pulse');
        document.getElementById('cycleStatus').innerText = "VOICE CAPTURED";
    }

    recognition.onresult = (event) => {
        let transcript = "";
        for (let i = 0; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }
        document.getElementById('userInput').value = transcript;
    };

    function manualExecute() {
        if (isListening) stopVoice();
        const cmd = document.getElementById('userInput').value;
        
        if (!cmd.trim()) {
            document.getElementById('cycleStatus').innerText = "NO INPUT DETECTED";
            return;
        }

        document.getElementById('ledgerTask').innerText = cmd;
        document.getElementById('ledgerStage').innerText = "AUDIT: 95% ACCURACY GATE";
        document.getElementById('cycleStatus').innerText = "CERTIFYING...";
        
        speak("Command received. Beginning Master Doc Certification.");

        setTimeout(() => {
            document.getElementById('ledgerStage').innerText = "CERTIFIED & EXECUTED";
        }, 2000);
    }

    function speak(t) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(t));
    }
</script>
</body>
</html>
