<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Chitti Sovereign OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --saffron: #E86A17; --navy: #0E2344; --gold: #D4AF37; --bg: #fdfdfd; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 20px 40px; background: var(--navy); color: white; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); }
        .main-ui { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
        .chitti-core { width: 100%; max-width: 800px; text-align: center; }
        
        /* THE ONE CHITTI PULSE */
        .orb { width: 150px; height: 150px; border-radius: 50%; background: linear-gradient(135deg, var(--saffron), var(--gold)); margin: 0 auto 30px; display: flex; align-items: center; justify-content: center; font-size: 60px; color: white; cursor: pointer; transition: 0.5s; box-shadow: 0 10px 40px rgba(232, 106, 23, 0.4); }
        .orb.update { animation: pulse-alert 2s infinite; }
        @keyframes pulse-alert { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232, 106, 23, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 30px rgba(232, 106, 23, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232, 106, 23, 0); } }

        .chat-area { background: white; border: 1px solid #eee; border-radius: 24px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); min-height: 200px; }
        .input-bar { margin-top: 20px; display: flex; gap: 15px; }
        .input { flex: 1; padding: 15px; border-radius: 12px; border: 1px solid #ddd; font-size: 16px; outline: none; }
        .btn { background: var(--saffron); color: white; border: none; padding: 0 25px; border-radius: 12px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:900; font-size:24px; letter-spacing:1px;">SAHAY <span style="color:var(--gold)">| CHITTI</span></div>
    <div style="font-size:12px; font-weight:800; background:rgba(255,255,255,0.1); padding:5px 15px; border-radius:20px;">FOUNDER MODE ACTIVE</div>
</header>

<main class="main-ui">
    <div class="chitti-core">
        <div id="chittiOrb" class="orb" onclick="startBriefing()">C</div>
        <div class="chat-area">
            <h2 id="status">Namaste, Sire.</h2>
            <p id="msg" style="color:#666; line-height:1.6;">The Skill Update Specialist is monitoring government schemes and weather feeds. I am ready for your command.</p>
        </div>
        <div class="input-bar">
            <input id="command" class="input" placeholder="Speak your command...">
            <button class="btn" onclick="execute()">SEND</button>
        </div>
    </div>
</main>

<script>
    function startBriefing() {
        const orb = document.getElementById('chittiOrb');
        orb.classList.remove('update');
        speak("Sire, the Master Document for the One Chitti system and Skill Update Specialist is ready for your audit. Everything is compliant with the DPDP act.");
        document.getElementById('status').innerText = "Briefing in Progress...";
    }

    function execute() {
        const cmd = document.getElementById('command').value;
        if(cmd.toLowerCase().includes("weather")) {
            document.getElementById('chittiOrb').classList.add('update');
            document.getElementById('status').innerText = "Vigilance Alert";
            document.getElementById('msg').innerText = "I have detected a weather update. Click the Saffron Orb to hear the briefing.";
            speak("I have detected a potential weather event. Tap the orb for the detail.");
        }
    }

    function speak(t) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'en-IN';
        window.speechSynthesis.speak(u);
    }

    // SIMULATE UPDATE AFTER 5 SECONDS
    setTimeout(() => {
        document.getElementById('chittiOrb').classList.add('update');
        document.getElementById('msg').innerText = "✨ The Master Doc is ready for your touch.";
    }, 5000);
</script>

</body>
</html>
