<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahay Chitti | World-Class AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --saffron: #FF6B35;
            --navy: #0F172A;
            --white: #FFFFFF;
            --soft-bg: #F8FAFC;
        }

        body {
            margin: 0;
            background-color: var(--soft-bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--navy);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ELITE BILINGUAL HEADER */
        header {
            padding: 20px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            border-bottom: 2px solid var(--saffron);
        }

        .brand { font-weight: 800; font-size: 24px; color: var(--navy); }
        .status-badge { 
            background: #ECFDF5; color: #10B981; 
            padding: 6px 12px; border-radius: 20px; 
            font-size: 11px; font-weight: 700;
            border: 1px solid #10B981;
        }

        /* THE BILINGUAL DASHBOARD */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 20px;
            flex-grow: 1;
        }

        .tile {
            background: white;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.02);
            transition: 0.3s;
        }

        .tile:active { transform: scale(0.96); background: #FFF9F6; }
        .icon { font-size: 42px; margin-bottom: 12px; }
        .label-en { font-weight: 700; font-size: 16px; }
        .label-hi { font-size: 13px; color: var(--saffron); font-weight: 600; }

        /* THE TALKING PA (SAFFRON ORB) */
        .footer-action {
            background: white;
            padding: 30px 20px 50px;
            border-radius: 40px 40px 0 0;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }

        .orb-btn {
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, #FF6B35, #D4410E);
            border-radius: 50%;
            border: none;
            box-shadow: 0 15px 35px rgba(255, 107, 53, 0.4);
            cursor: pointer;
            position: relative;
            margin-bottom: 15px;
        }

        .orb-btn svg { width: 35px; fill: white; }

        /* PULSE EFFECT FOR TRAINING STATUS */
        .pulse {
            position: absolute;
            inset: 0;
            border: 2px solid var(--saffron);
            border-radius: 50%;
            animation: ripple 2s infinite;
        }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.7); opacity: 0; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand">SAHAY | सहाय</div>
    <div id="connection-status" class="status-badge">CONNECTED TO RENDER</div>
</header>

<div style="padding: 25px 20px 0;">
    <h1 style="font-size: 26px; margin: 0;">Namaste, Sire</h1>
    <p style="opacity: 0.6; font-size: 14px;">Chitti is ready to coordinate. | चिठ्ठी तैयार है।</p>
</div>

<main class="grid">
    <div class="tile" onclick="callSpecialist('Gullak')">
        <div class="icon">💰</div>
        <span class="label-en">Gullak</span>
        <span class="label-hi">गुल्लक</span>
    </div>

    <div class="tile" onclick="window.open('YOUR_COLAB_LINK_HERE')">
        <div class="icon">🎓</div>
        <span class="label-en">Coach</span>
        <span class="label-hi">कोच (Training)</span>
    </div>

    <div class="tile" onclick="callSpecialist('Shield')">
        <div class="icon">🛡️</div>
        <span class="label-en">Shield</span>
        <span class="label-hi">सुरक्षा</span>
    </div>

    <div class="tile" onclick="callSpecialist('Life')">
        <div class="icon">🏠</div>
        <span class="label-en">Life</span>
        <span class="label-hi">जीवन</span>
    </div>
</main>

<div class="footer-action">
    <button class="orb-btn" id="micBtn">
        <div class="pulse"></div>
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
    <p style="font-weight: 800; color: var(--saffron);">Tap to Speak | बोलने के लिए दबाएं</p>
</div>

<script>
    // RENDER BACKEND CONNECTION LOGIC
    const RENDER_BACKEND_URL = "https://your-app-name.onrender.com"; // Replace with your actual Render URL

    function callSpecialist(name) {
        console.log(`Contacting ${name} Specialist via Render...`);
        alert(`Connecting to ${name} Specialist | ${name} विशेषज्ञ से जुड़ रहे हैं...`);
    }

    // MIC ACTIVATION (The Talking PA)
    document.getElementById('micBtn').onclick = function() {
        // This will eventually trigger the Speech SDK connected to your Render backend
        console.log("PA is listening...");
    };
</script>

</body>
</html>
