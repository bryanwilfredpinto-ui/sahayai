<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chitti Bharat Premium AI OS</title>
    <style>
        :root {
            --saffron: #E86A17;
            --navy: #0E2344;
            --gold: #D4AF37;
            --bg: #0A192F; /* Deep Premium Navy */
            --card: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, var(--navy), #050C16);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* PREMIUM HEADER */
        header {
            padding: 20px;
            background: rgba(14, 35, 68, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--gold);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-circle {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--saffron), var(--gold));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 24px;
            box-shadow: 0 0 15px rgba(232, 106, 23, 0.4);
        }

        /* BILINGUAL HERO */
        .hero {
            padding: 30px 20px 10px;
            text-align: center;
        }

        h1 { font-size: 28px; margin: 0; letter-spacing: 1px; }
        .bilingual-sub { color: var(--gold); font-size: 14px; margin-top: 5px; font-weight: 600; }

        /* ELITE TILES */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 20px;
            flex-grow: 1;
        }

        .tile {
            background: var(--card);
            border: 1px solid rgba(212, 175, 85, 0.2);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .tile:active { transform: scale(0.95); border-color: var(--saffron); }
        .icon { font-size: 35px; margin-bottom: 10px; display: block; }
        .t-en { display: block; font-weight: 800; font-size: 15px; }
        .t-hi { display: block; font-size: 12px; opacity: 0.7; color: var(--gold); }

        /* SAFFRON VOICE HUB */
        .voice-hub {
            background: rgba(14, 35, 68, 0.95);
            padding: 30px 20px;
            border-radius: 40px 40px 0 0;
            border-top: 1px solid var(--gold);
            text-align: center;
        }

        .orb {
            width: 75px;
            height: 75px;
            background: radial-gradient(circle, var(--saffron), #C15510);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(232, 106, 23, 0.6);
            border: 3px solid rgba(255,255,255,0.2);
        }

        .pulse {
            position: absolute;
            width: 75px;
            height: 75px;
            border: 2px solid var(--saffron);
            border-radius: 50%;
            animation: ring 2s infinite;
        }

        @keyframes ring {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-circle">C</div>
    <div>
        <div style="font-weight: 900; font-size: 18px;">CHITTI BHARAT</div>
        <div style="font-size: 10px; color: var(--gold); font-weight: bold;">PREMIUM AI OS</div>
    </div>
</header>

<div class="hero">
    <h1>Namaste, Sire</h1>
    <div class="bilingual-sub">Chitti is Live & Auditing | चिठ्ठी सक्रिय है</div>
</div>

<main class="grid">
    <div class="tile" onclick="alert('Opening Gullak...')">
        <span class="icon">💰</span>
        <span class="t-en">GULLAK</span>
        <span class="t-hi">गुल्लक</span>
    </div>
    <div class="tile" onclick="location.href='https://colab.research.google.com/'">
        <span class="icon">🎓</span>
        <span class="t-en">COACH</span>
        <span class="t-hi">कोच</span>
    </div>
    <div class="tile" onclick="alert('Activating Shield...')">
        <span class="icon">🛡️</span>
        <span class="t-en">SHIELD</span>
        <span class="t-hi">सुरक्षा</span>
    </div>
    <div class="tile" onclick="alert('Life Management...')">
        <span class="icon">🏠</span>
        <span class="t-en">LIFE</span>
        <span class="t-hi">जीवन</span>
    </div>
</main>

<div class="voice-hub">
    <div style="position: relative; display: inline-block;">
        <div class="pulse"></div>
        <div class="orb">
            <svg width="30" viewBox="0 0 24 24" fill="white"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </div>
    </div>
    <div style="font-weight: 800; font-size: 14px; margin-top: 10px;">
        TAP TO COMMAND | आदेश दें
    </div>
</div>

</body>
</html>
