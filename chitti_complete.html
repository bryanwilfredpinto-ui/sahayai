<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Chitti Sovereign OS | Sahay</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --saffron: #E86A17; --navy: #0E2344; --gold: #D4AF37; --bg: #fdfdfd; --card: #ffffff; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { padding: 20px 40px; background: var(--navy); color: white; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); }
        .logo-box { width: 45px; height: 45px; background: linear-gradient(135deg, var(--saffron), var(--gold)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 24px; color: white; }
        .status-badge { font-size: 11px; font-weight: 800; color: var(--gold); letter-spacing: 1px; }

        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
        .chitti-panel { width: 100%; max-width: 850px; text-align: center; }

        /* THE SAFFRON ORB */
        .orb { width: 130px; height: 130px; border-radius: 50%; background: linear-gradient(135deg, var(--saffron), var(--gold)); margin: 0 auto 25px; display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: 800; color: white; cursor: pointer; transition: 0.4s ease; box-shadow: 0 10px 30px rgba(232, 106, 23, 0.3); }
        .orb.pulse { animation: saffron-pulse 2s infinite; }
        @keyframes saffron-pulse { 
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232, 106, 23, 0.7); } 
            70% { transform: scale(1.08); box-shadow: 0 0 0 25px rgba(232, 106, 23, 0); } 
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232, 106, 23, 0); } 
        }

        .display-card { background: var(--card); border: 1px solid #eee; border-radius: 28px; padding: 35px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); min-height: 250px; }
        h2 { color: var(--navy); margin-top: 0; font-weight: 800; }
        p { color: #666; font-size: 16px; margin-bottom: 20px; }

        /* DOC VAULT - WHERE THE REQUIREMENTS LIVE */
        #docVault { display: none; text-align: left; background: #fafafa; border: 1px solid #eaeaea; border-radius: 15px; padding: 20px; margin-top: 15px; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .doc-label { font-weight: 800; font-size: 11px; color: var(--saffron); text-transform: uppercase; margin-bottom: 8px; display: block; }
        .doc-body { font-size: 14px; color: #333; line-height: 1.6; white-space: pre-line; font-weight: 500; }

        .controls { margin-top: 25px; display: flex; gap: 12px; }
        .input-field { flex: 1; padding: 15px 20px; border-radius: 15px; border: 1px solid #ddd; font-size: 16px; outline: none; font-family: inherit; }
        .send-btn { background: var(--saffron); color: white; border: none; padding: 0 30px; border-radius: 15px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .send-btn:hover { background: #cf5b12; }
    </style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap:12px;">
        <div class="logo-box">C</div>
        <div style="font-weight:900; font-size:20px;">SAHAY | CHITTI</div>
    </div>
    <div class="status-badge">FOUNDER SYNCED 🛡️</div>
</header>

<main class="container">
    <div class="chitti-panel">
        <div id="orb" class="orb pulse" onclick="triggerBriefing()">C</div>
        
        <div class="display-card">
            <h2 id="headline">Namaste, Sire.</h2>
            <p id="subtext">The Skill Update Specialist is online with your latest requirements.</p>
            
            <div id="docVault">
                <span class="doc-label">Master Doc: Unified Core Requirements</span>
                <div id="docBody" class="doc-body"></div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="userInput" class="input-field" placeholder="Command Chitti...">
            <button class="send-btn" onclick="processInput()">SEND</button>
        </div>
    </div>
</main>

<script>
    function triggerBriefing() {
        const orb = document.getElementById('orb');
        orb.classList.remove('pulse');
        document.getElementById('docVault').style.display = 'block';
        document.getElementById('headline').innerText = "Sire, Intelligence Synced.";
        
        // SYNCING YOUR SPECIFIC REQUIREMENTS
        const masterData = `● FOUNDER REQUIREMENT: Skill Update Specialist Active.
● WEATHER WATCH: Monitoring Vizag/Odisha (Cyclone/Heatwave).
● GOVT SCHEMES: Monitoring PIB & MyGov for live updates.
● REVERIFICATION: CD line active for 95% accuracy gate.
● COMPLIANCE: Fully DPDP 2023 Compliant.`;

        document.getElementById('docBody').innerText = masterData;
        
        // PA VOICE TRIGGER
        speak("Sire, the gap is closed. I have ingested your requirements. The Skill Update Specialist is now live, monitoring Vizag weather and Indian Government schemes. Every update is being filtered through our 95 percent accuracy gate. I will pulse this orb the moment I detect a change.");
    }

    function processInput() {
        const val = document.getElementById('userInput').value;
        if (!val) return;

        if (val.toLowerCase().includes("weather") || val.toLowerCase().includes("vizag")) {
            document.getElementById('orb').classList.add('pulse');
            document.getElementById('headline').innerText = "Vigilance Mode";
            speak("Scanning weather feeds for Vizag and Odisha, Sire. I will alert you if the status changes.");
        }
        document.getElementById('userInput').value = "";
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'en-IN'; // Indian English Accent
        speech.rate = 0.92;    // Professional, steady pace
        window.speechSynthesis.speak(speech);
    }

    // Auto-pulse after 3 seconds to catch the user's attention
    setTimeout(() => { 
        if(document.getElementById('docVault').style.display !== 'block') {
            document.getElementById('orb').classList.add('pulse'); 
        }
    }, 3000);
</script>

</body>
</html>
