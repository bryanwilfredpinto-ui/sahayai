<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chitti Ultimate V1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5;color:#111}
.container{max-width:480px;margin:auto;background:#fff;min-height:100vh}
header{background:linear-gradient(135deg,#ff7a00,#ff9f1c);color:#fff;padding:20px}
.logo{font-size:34px;font-weight:900}
.sub{font-size:14px;opacity:.9}
select,button,input{border:none;border-radius:12px;padding:12px;font-size:15px}
.top-controls{display:flex;gap:10px;margin-top:15px}
select{flex:1}
button{cursor:pointer;font-weight:700}
.mic{background:#fff;color:#ff7a00;flex:1}
.section{padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.card h3{font-size:18px;margin-bottom:8px}
.chatbox{background:#111;color:#fff;border-radius:16px;padding:14px;margin-top:16px;min-height:120px}
input{width:100%;border:1px solid #ddd;margin-top:12px}
.footer{padding:15px;text-align:center;font-size:12px;color:#666}
</style>
</head>
<body>

<div class="container">

<header>
<div class="logo">Chitti</div>
<div class="sub">Bharat's AI Saathi</div>

<div class="top-controls">
<select id="lang">
<option value="en-US">English</option>
<option value="hi-IN">हिंदी</option>
<option value="bn-BD">বাংলা</option>
</select>

<button class="mic" onclick="startListening()">🎤 Speak</button>
</div>
</header>

<div class="section">

<div class="grid">
<div class="card" onclick="talk('money')">
<h3>💰 Money Help</h3>
<p>Bills, savings, loans</p>
</div>

<div class="card" onclick="talk('govt')">
<h3>📜 Govt Help</h3>
<p>Schemes & support</p>
</div>

<div class="card" onclick="talk('health')">
<h3>🏥 Health</h3>
<p>Reminder & support</p>
</div>

<div class="card" onclick="talk('shop')">
<h3>🏪 Shopkeeper</h3>
<p>Inventory & orders</p>
</div>
</div>

<div class="chatbox" id="chat">
Namaste 🙏 Ask Chitti anything.
</div>

<input id="msg" placeholder="Type message..." onkeydown="if(event.key==='Enter')manualSend()">

</div>

<div class="footer">
Chitti Ultimate V1 • English • Hindi • Bangla
</div>

</div>

<script>
function speak(text){
let msg=new SpeechSynthesisUtterance(text);
msg.lang=document.getElementById("lang").value;
speechSynthesis.speak(msg);
}

function show(text){
document.getElementById("chat").innerHTML=text;
speak(text);
}

function talk(type){
if(type==="money") show("I can help you save money and manage bills.");
if(type==="govt") show("I can help you find government schemes.");
if(type==="health") show("Take medicines on time and stay healthy.");
if(type==="shop") show("Track stock, orders and customer payments.");
}

function manualSend(){
let text=document.getElementById("msg").value;
if(text.trim()=="") return;
document.getElementById("chat").innerHTML="You: "+text;
reply(text.toLowerCase());
document.getElementById("msg").value="";
}

function reply(t){
if(t.includes("hello")||t.includes("hi")) show("Hello! How can I help?");
else if(t.includes("money")) show("Save 20 percent income monthly.");
else if(t.includes("job")) show("I can help find nearby jobs.");
else if(t.includes("shop")) show("Let's manage your business.");
else if(t.includes("বাংলা")) show("আমি বাংলা বলতে পারি।");
else show("I understood. Let me help you.");
}

function startListening(){
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("Voice recognition not supported in this browser.");
return;
}

const recog=new SpeechRecognition();
recog.lang=document.getElementById("lang").value;
recog.start();

recog.onresult=function(event){
let text=event.results[0][0].transcript;
document.getElementById("chat").innerHTML="You said: "+text;
reply(text.toLowerCase());
}
}
</script>

</body>
</html>
