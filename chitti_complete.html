<style>
    .update-glow {
        animation: blue-glow 2s infinite;
        border: 2px solid #3b82f6 !important;
        cursor: pointer;
    }
    @keyframes blue-glow {
        0% { box-shadow: 0 0 5px rgba(59, 130, 246, 0.5); }
        50% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.8); }
        100% { box-shadow: 0 0 5px rgba(59, 130, 246, 0.5); }
    }
</style>

<script>
    // This function simulates the PA receiving the Master Doc from the Architect
    function notifySire() {
        const paBox = document.getElementById('msgs');
        const alert = document.createElement('div');
        alert.className = 'bubble ai update-glow';
        alert.innerHTML = "<b>✨ Master Doc Update:</b> Sire, I have received the blueprint. <b>Click here</b> to hear the briefing.<br><small>नया मास्टर डॉक तैयार है। सुनने के लिए यहां क्लिक करें।</small>";
        alert.onclick = () => {
            alert.classList.remove('update-glow');
            speakBriefing();
        };
        paBox.appendChild(alert);
        paBox.scrollTop = paBox.scrollHeight;
    }

    function speakBriefing() {
        speak("Sire, the Master Doc summary is ready. We are focusing on DPDP compliance and the 95% passing standard. The Devil's Advocate is standing by for your approval.");
    }
</script>
