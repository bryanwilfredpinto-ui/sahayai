<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahay AI - Chitti Factory</title>
    <style>
        :root { --gold: #D4A017; --saffron: #FF9933; --black: #000; --green: #00FF41; }
        body { background: var(--black); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        .page { display: none; min-height: 100vh; }
        .page.active { display: block; }
        .factory-console { background: #050505; color: var(--green); font-family: 'Courier New', monospace; padding: 20px; border-radius: 12px; border: 1px solid #333; height: 400px; overflow-y: auto; }
        .cert-badge { border: 2px solid var(--gold); border-radius: 12px; padding: 20px; text-align: center; background: rgba(212,160,23,0.05); }
        .btn { background: var(--saffron); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="page-chat" class="page active" style="padding: 20px; text-align: center;">
    <h1 style="color: var(--gold);">Sahay AI Dashboard</h1>
    <div style="margin: 40px auto; max-width: 400px;">
        <div id="upsell-status" class="cert-badge">
            <div style="font-size: 50px;">🔒</div>
            <h3>Upsell Specialist</h3>
            <p>Awaiting Backend Ingestion...</p>
        </div>
    </div>
    <p style="color: #666;">Ready for 100 Crore Indians</p>
</div>

<div id="page-admin-factory" class="page" style="background:#000; padding:20px; position:fixed; top:0; left:0; width:100%; z-index:9999;">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; margin-bottom:20px;">
        <h2 style="color:var(--gold);">🏭 CHITTI FACTORY: MASTER CONSOLE</h2>
        <button onclick="toggleAdmin()" class="btn">Back to App</button>
    </div>
    <div style="display:grid; grid-template-columns: 2fr 1fr; gap:20px;">
        <div class="factory-console" id="factory-terminal">
            > [PA] AGENTIC BRIDGE INITIALIZED...
            > [PA] LISTENING FOR COLAB UPDATES ON GITHUB...
        </div>
        <div class="cert-badge">
            <div style="font-size:40px;">🏅</div>
            <h3 style="color:var(--gold);">GEMINI CERTIFIED</h3>
            <p id="cert-desc">Status: Ready</p>
        </div>
    </div>
</div>

<div onclick="toggleAdmin()" style="position:fixed; bottom:0; left:0; width:60px; height:60px; z-index:10000; opacity:0; cursor:pointer;"></div>

<script>
    function toggleAdmin() {
        const factory = document.getElementById('page-admin-factory');
        factory.style.display = factory.style.display === 'none' ? 'block' : 'none';
    }

    // AUTO-SYNC LOGIC: FETCHING FROM GITHUB WITHOUT COMMITS
    async function syncFromGithub() {
        const url = 'https://raw.githubusercontent.com/bryanwilfredpinto-ui/sahayai/main/specialist_upsell.json';
        try {
            const response = await fetch(url + '?t=' + new Date().getTime());
            if (response.ok) {
                const data = await response.json();
                document.getElementById('factory-terminal').innerHTML += `<br>> [SYNC] NEW BRAIN DETECTED: ${data.specialist} v${data.logic_version}`;
                document.getElementById('upsell-status').innerHTML = `<div style="font-size:50px;">🏅</div><h3>Upsell Specialist</h3><p>Status: LIVE & CERTIFIED</p>`;
            }
        } catch (e) { console.log("Waiting for data..."); }
    }
    setInterval(syncFromGithub, 5000); // Check every 5 seconds
</script>
</body>
</html>
