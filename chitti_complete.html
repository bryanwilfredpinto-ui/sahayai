<style>
    #docVault {
        display: none;
        background: #fff;
        border-top: 4px solid var(--saffron);
        padding: 25px;
        margin-top: 20px;
        text-align: left;
        border-radius: 12px;
        max-height: 400px;
        overflow-y: auto;
        box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
    }
    .doc-header { color: var(--navy); font-weight: 800; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
</style>

<div class="chat-area">
    <h2 id="status">Namaste, Sire.</h2>
    <p id="msg">The Master Doc is ready for your touch.</p>
    <div id="docVault">
        <div class="doc-header">📂 MASTER DOCUMENT: SAHAY CORE V1.0</div>
        <div id="docContent" style="font-size: 14px; color: #444; white-space: pre-line;">
            Loading official blueprint...
        </div>
    </div>
</div>

<script>
    function startBriefing() {
        const orb = document.getElementById('chittiOrb');
        const vault = document.getElementById('docVault');
        const content = document.getElementById('docContent');
        
        orb.classList.remove('update');
        vault.style.display = 'block';
        
        const docText = `1. TARGET: Unified Chitti OS.
        2. COMPLIANCE: DPDP 2023 🇮🇳 (Audit Passed).
        3. SKILL UPDATER: IMD/Weather, PIB/Govt Schemes.
        4. ACCURACY: 95% Verified.
        5. PROTOCOL: Proactive audio briefing via Sire Touch.`;
        
        content.innerText = docText;
        document.getElementById('status').innerText = "Briefing in Progress...";
        speak("Sire, the Master Document is now visible on your dashboard for audit. I am ready to begin the audio summary.");
    }
</script>
