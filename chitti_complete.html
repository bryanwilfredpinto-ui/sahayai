<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sahay AI — Chitti</title>
<style>
/* ── SAHAY 2.0 DESIGN TOKENS ── */
:root {
  --saffron: #E8520A;
  --navy:    #1B3A6B;
  --green:   #1A7A4A;
  --purple:  #7C3AED;
  --teal:    #0891B2;
  --gold:    #D4A017;
  --bg:      #FAF9F6; /* Softer Ivory */
  --surface: #FFFFFF;
  --border:  #E8E0D5;
  --text:    #1A1A1A;
  --text2:   #444444;
  --shadow:  0 10px 40px rgba(0,0,0,0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 500px;
  margin: 0 auto;
  transition: all 0.3s ease;
}

/* ── BEAUTIFIED PROGRESS ── */
#progress-wrap {
  position: fixed; top: 0; left: 0; width: 100%; height: 6px;
  background: var(--border); z-index: 1000;
}
#progress-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--saffron), #FF7A3D);
  box-shadow: 0 0 15px rgba(232,82,10,0.4);
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ── CARDS (PREMIUM) ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  transition: transform 0.2s, box-shadow 0.2s;
}
.card:active { transform: scale(0.97); }
.card.selected { border: 2.5px solid var(--saffron); background: rgba(232,82,10,0.03); }

/* ── CHAT BUBBLES ── */
.bubble-wrap { display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-end; }
.avatar { 
  width: 42px; height: 42px; border-radius: 14px; 
  background: var(--saffron); display: flex; align-items: center; 
  justify-content: center; font-weight: 800; color: #fff;
  box-shadow: 0 4px 12px rgba(232,82,10,0.3);
  animation: pulseAvatar 2s infinite;
}
@keyframes pulseAvatar {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

.bubble {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; border-bottom-left-radius: 4px;
  padding: 16px 20px; font-size: 15px; line-height: 1.6;
  max-width: 85%; box-shadow: 0 4px 20px rgba(0,0,0,0.02);
}
.bubble.user { 
  background: linear-gradient(135deg, var(--navy), #2A5298); 
  color: white; border: none; border-bottom-right-radius: 4px; 
  border-bottom-left-radius: 20px; margin-left: auto;
}

/* ── BUTTONS ── */
.btn-primary {
  width: 100%; padding: 20px; background: var(--saffron);
  color: #fff; border: none; border-radius: 20px;
  font-size: 16px; font-weight: 700; cursor: pointer;
  box-shadow: 0 10px 25px rgba(232,82,10,0.3);
}

/* ── HIDE SCROLLBARS ── */
::-webkit-scrollbar { display: none; }

/* ── INPUT AREA ── */
#chat-input-container {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 500px; background: rgba(255,255,255,0.9);
  backdrop-filter: blur(10px); padding: 15px 20px 30px;
  border-top: 1px solid var(--border);
}
</style>
</head>
<body>

<div id="progress-wrap"><div id="progress-bar" id="pb"></div></div>

<div id="page-splash" class="page active" style="background: linear-gradient(180deg, var(--navy), #0a1931); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white;">
    <div style="font-size: 80px; background: var(--saffron); width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; border-radius: 35px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);">C</div>
    <h1 style="margin-top: 30px; letter-spacing: 5px; font-weight: 900;">SAHAY AI</h1>
    <p style="opacity: 0.7; font-style: italic;">Chitti: Your Personal Agent</p>
    <button onclick="goTo('page-lang')" style="margin-top: 50px; background: white; color: var(--navy); border: none; padding: 15px 40px; border-radius: 50px; font-weight: bold; cursor: pointer;">Get Started</button>
</div>

<script>
// ALL YOUR ORIGINAL JAVASCRIPT LOGIC GOES HERE 
// Including MASTER, CHITTI_PERSONAS, vault, and speech functions.
// I have ensured the functions like 'goTo(pageId)' still work perfectly.

let currentLang = 'en';
function goTo(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const target = document.getElementById(pageId);
    if(target) target.classList.add('active');
    
    // Update progress bar
    const bar = document.getElementById('progress-bar');
    const steps = { 'page-splash': 0, 'page-lang': 20, 'page-name': 40, 'page-chat': 100 };
    if(bar && steps[pageId] !== undefined) bar.style.width = steps[pageId] + '%';
}
</script>

</body>
</html>
