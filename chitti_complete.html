<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahay Hybrid v44</title>
    <style>
        :root { --gold: #D4AF37; --bg: #0f172a; }
        body { font-family: sans-serif; background: var(--bg); color: white; padding: 20px; }
        .nav { display: flex; gap: 10px; margin-bottom: 20px; border: 1px solid var(--gold); padding: 5px; border-radius: 50px; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; border-radius: 50px; }
        .active { background: var(--gold); color: black; font-weight: bold; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; border-left: 5px solid var(--gold); margin-bottom: 15px; }
        .hidden { display: none; }
        button { background: var(--gold); border: none; padding: 10px; border-radius: 5px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="nav">
        <div id="t1" class="tab active" onclick="sw('P')">INDIVIDUAL PA</div>
        <div id="t2" class="tab" onclick="sw('B')">BUSINESS PRO</div>
    </div>

    <div id="P">
        <div class="card">
            <h3>Morning Ritual</h3>
            <p>"Bhai, ek baat batao — subah uthte hi sabse pehle kya cheez dimag mein aati hai?"</p>
        </div>
    </div>

    <div id="B" class="hidden">
        <div class="card">
            <h3>Supplier Handshake</h3>
            <p>Stock for 'Milk' is Low. Drafted WhatsApp order.</p>
            <button onclick="alert('Order Sent!')">APPROVE ORDER</button>
        </div>
        <div class="card">
            <h3>Upsell Pattern</h3>
            <p>Suggesting 'Ghee' with 'Rice' purchase.</p>
            <button onclick="alert('Pattern Applied')">APPLY UPSELL</button>
        </div>
    </div>

    <script>
        function sw(m) {
            document.getElementById('P').classList.toggle('hidden', m === 'B');
            document.getElementById('B').classList.toggle('hidden', m === 'P');
            document.getElementById('t1').classList.toggle('active', m === 'P');
            document.getElementById('t2').classList.toggle('active', m === 'B');
        }
    </script>
</body>
</html>
