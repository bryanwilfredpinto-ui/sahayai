<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sahay AI — Chitti v45</title>
<style>
/* ── UPDATED DESIGN TOKENS ──────────────────────── */
:root {
  --saffron: #E8520A;
  --navy:    #1B3A6B;
  --green:   #1A7A4A;
  --bg:      #F8F4F0;
  --surface: #FFFFFF;
  --text:    #1A1A1A;
  --shadow:  0 4px 12px rgba(0,0,0,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  max-width: 480px;
  margin: 0 auto;
  overflow-x: hidden;
}

/* ── PAGE SYSTEM ───────────────────────────────── */
.page { 
  display: none; 
  min-height: 100vh; 
  padding: 20px;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.page.active { 
  display: flex; 
  flex-direction: column; 
  opacity: 1; 
}

/* ── COMPONENT: AGENT BUBBLE ───────────────────── */
.agent-node {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  animation: slideUp 0.4s ease;
}
.avatar {
  width: 40px; height: 40px;
  background: var(--saffron);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-weight: 900;
}
.bubble {
  background: var(--surface);
  padding: 16px;
  border-radius: 18px;
  border-top-left-radius: 4px;
  box-shadow: var(--shadow);
  position: relative;
  flex: 1;
}

/* ── ANIMATIONS ────────────────────────────────── */
@keyframes slideUp { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }

.btn-primary {
  width: 100%;
  padding: 18px;
  background: var(--saffron);
  border: none;
  border-radius: 16px;
  font-weight: 800;
  cursor: pointer;
  margin-top: auto;
}
</style>
</head>
<body>

<main id="app-shell">
  <section class="page active" id="pg-lang">
    <div class="agent-node">
       <div class="avatar">C</div>
       <div class="bubble">
          <strong>"Namaste! Main Chitti hoon."</strong>
          <p style="font-size: 0.9rem; margin-top: 4px; color: #666;">Which language do you prefer for our conversation?</p>
       </div>
    </div>
    
    <div class="card" onclick="App.setLang('en')" id="lang-en">
       <strong>English</strong>
       <span>Global Standard</span>
    </div>

    <div class="card" onclick="App.setLang('hi')" id="lang-hi">
       <strong>हिंदी</strong>
       <span>भारत की आवाज़</span>
    </div>

    <button class="btn-primary" onclick="App.nav('pg-privacy')">Continue →</button>
  </section>

  <section class="page" id="pg-privacy">
    <h2 style="margin-bottom: 12px;">Your Data is Yours.</h2>
    <div class="bubble" style="background: #E0F2FE; border: 1px solid #BAE6FD;">
       <p>🔒 Chitti never shares your personal details. Everything stays on your device first.</p>
    </div>
    <button class="btn-primary" onclick="App.nav('pg-dashboard')">I Agree</button>
  </section>
</main>

<script>
/* ── CENTRALIZED STATE ENGINE ─────────────────── */
const App = {
  state: {
    lang: 'en',
    current: 'pg-lang'
  },

  nav(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const next = document.getElementById(id);
    next.classList.add('active');
    this.state.current = id;
    localStorage.setItem('CHITTI_STATE', JSON.stringify(this.state));
  },

  setLang(l) {
    this.state.lang = l;
    console.log("Language updated to:", l);
    // Add visual feedback for selection here
  }
};
</script>
</body>
</html>
