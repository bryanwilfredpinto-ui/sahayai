name: chitti_ingest

on:
  workflow_dispatch:
    inputs:
      specialist:
        description: 'Specialist name (e.g. bangla, ca, legal)'
        required: true
        type: string
      ingest_script:
        description: 'Python script under ingest/ to run (e.g. ingest_bangla.py)'
        required: true
        type: string
      sources_json:
        description: 'JSON array of source URLs/identifiers'
        required: false
        default: '[]'
        type: string

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ingest/requirements.txt ]; then
            pip install -r ingest/requirements.txt
          else
            pip install requests beautifulsoup4 lxml youtube-transcript-api PyPDF2 feedparser
          fi

      - name: Run ingestion script
        env:
          SPECIALIST: ${{ inputs.specialist }}
          SOURCES_JSON: ${{ inputs.sources_json }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -e
          SCRIPT="ingest/${{ inputs.ingest_script }}"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Ingest script not found: $SCRIPT"
            ls -la ingest/ 2>/dev/null || echo "  (ingest/ folder does not exist yet)"
            exit 1
          fi
          echo "Running $SCRIPT for specialist=$SPECIALIST"
          python "$SCRIPT"

      - name: Commit produced brain artifacts
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name  "chitti-devops-bot"
          git config user.email "devops@sahayai.in"
          git add routes/${{ inputs.specialist }}/ || true
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "ingest: refresh brain for chitti_${{ inputs.specialist }} [auto]"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Chitti Ingest Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Specialist: ${{ inputs.specialist }}" >> $GITHUB_STEP_SUMMARY
          echo "- Script: ${{ inputs.ingest_script }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
