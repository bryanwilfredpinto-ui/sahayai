# Render Blueprint for Chitti MedUPI
# ------------------------------------------------------------------
# We REUSE the existing chitti-shares Postgres database (Render free
# tier permits only one free DB per workspace) and isolate every
# MedUPI table under a dedicated `medupi` schema. See
# backend/models/_schema.py for the implementation.
#
# Net effect:
#   - chitti-shares tables live in `public.*`         (default schema)
#   - chitti-medupi tables live in `medupi.*`         (this Blueprint)
#   - Zero risk of name collision; tables share storage but not names.

services:
  - type: web
    name: chitti-medupi-api
    runtime: python
    plan: free
    rootDir: chitti-medupi/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Reuse the chitti-shares-db. Render resolves this at deploy time
      # from any Postgres in the same workspace named `chitti-shares-db`.
      # If you set up chitti-shares manually (not via Blueprint), the DB
      # name might differ — in that case paste the Internal Database URL
      # by hand and remove the fromDatabase block below.
      - key: DATABASE_URL
        fromDatabase:
          name: chitti-shares-db
          property: connectionString

      # ── Anthropic (image scan via vision) ──
      - key: ANTHROPIC_API_KEY
        sync: false        # paste in dashboard after Blueprint creates the service
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6

      # ── CORS / self-URL ──
      - key: ALLOWED_ORIGINS
        value: "https://sahayai.in,https://www.sahayai.in"
      - key: BACKEND_URL
        value: https://chitti-medupi-api.onrender.com

      # ── Brave Search (live pharmacy prices · free 2,000 q/mo) ──
      # Get a key at https://api.search.brave.com/ — without it the
      # /api/medupi/price/live/{name} endpoint returns 'unconfigured'
      # but everything else still works.
      - key: BRAVE_SEARCH_API_KEY
        sync: false

      # ── Scheduler (in-process APScheduler, IST timezone) ──
      - key: SCHEDULER_ENABLED
        value: "true"

      # ── Optional URL overrides for the auto-update wrappers ──
      # Leave blank to use the defaults baked into scripts/auto_update.py.
      - key: JAN_AUSHADHI_PRODUCT_URL
        sync: false
      - key: NPPA_CEILING_URL
        sync: false

      # ── Twilio (phone-call reminders — optional) ──
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

# No `databases:` block — we reuse chitti-shares-db. The startup hook in
# main.py runs `CREATE SCHEMA IF NOT EXISTS medupi` before any
# Base.metadata.create_all() call, so the schema appears the first time
# the service boots.
