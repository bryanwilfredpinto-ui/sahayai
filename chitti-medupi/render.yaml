# Render Blueprint for Chitti MedUPI
# ------------------------------------------------------------------
# Postgres is hosted on Neon. All MedUPI tables live under the
# `medupi` schema (see backend/models/_schema.py); chitti-shares
# uses a separate Neon DB.

services:
  - type: web
    name: chitti-medupi-api
    runtime: python
    plan: free
    rootDir: chitti-medupi/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      # Neon Postgres connection string — paste into the Render
      # dashboard. Format: postgresql://USER:PW@HOST/DB?sslmode=require
      - key: DATABASE_URL
        sync: false

      # ── Anthropic (image scan via vision) ──
      - key: ANTHROPIC_API_KEY
        sync: false        # paste in dashboard after Blueprint creates the service
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6

      # ── CORS / self-URL ──
      - key: ALLOWED_ORIGINS
        value: "https://sahayai.in,https://www.sahayai.in"
      - key: BACKEND_URL
        value: https://chitti-medupi-api.onrender.com

      # ── Brave Search (live pharmacy prices · free 2,000 q/mo) ──
      # Get a key at https://api.search.brave.com/ — without it the
      # /api/medupi/price/live/{name} endpoint returns 'unconfigured'
      # but everything else still works.
      - key: BRAVE_SEARCH_API_KEY
        sync: false

      # ── Scheduler (in-process APScheduler, IST timezone) ──
      - key: SCHEDULER_ENABLED
        value: "true"

      # ── Optional URL overrides for the auto-update wrappers ──
      # Leave blank to use the defaults baked into scripts/auto_update.py.
      - key: JAN_AUSHADHI_PRODUCT_URL
        sync: false
      - key: NPPA_CEILING_URL
        sync: false

      # ── Twilio (phone-call reminders — optional) ──
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

# No `databases:` block — Postgres lives on Neon. The startup hook in
# main.py runs `CREATE SCHEMA IF NOT EXISTS medupi` before any
# Base.metadata.create_all() call, so the schema appears the first
# time the service boots.
