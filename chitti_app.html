<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chitti — Bharat ka Apna AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --border: #2a2a3d;
    --accent: #00e5a0;
    --accent2: #ff6b35;
    --accent3: #7c5cfc;
    --text: #f0f0f8;
    --text-muted: #888899;
    --danger: #ff4444;
    --listening: #ff6b35;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: fixed;
    width: 100%;
    height: 100%;
  }

  /* Ambient background */
  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    pointer-events: none;
    transition: all 1s ease;
  }
  .orb1 { width: 300px; height: 300px; background: var(--accent3); top: -100px; right: -100px; }
  .orb2 { width: 250px; height: 250px; background: var(--accent); bottom: -50px; left: -80px; }
  .orb3 { width: 200px; height: 200px; background: var(--accent2); top: 40%; left: 50%; transform: translateX(-50%); opacity: 0.08; }

  body.listening .orb1 { opacity: 0.35; transform: scale(1.3); background: var(--listening); }
  body.listening .orb2 { opacity: 0.3; transform: scale(1.2); }
  body.speaking .orb1 { opacity: 0.3; background: var(--accent); }
  body.speaking .orb2 { opacity: 0.35; transform: scale(1.4); }

  /* Header */
  .header {
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,15,0.8);
    backdrop-filter: blur(20px);
    z-index: 10;
    position: relative;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent3), var(--accent));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .logo-text {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .logo-sub {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .status-pill {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    border: 1px solid var(--border);
    color: var(--text-muted);
    transition: all 0.3s;
  }

  .status-pill.sleeping { border-color: var(--border); color: var(--text-muted); }
  .status-pill.awake { border-color: var(--accent); color: var(--accent); background: rgba(0,229,160,0.1); }
  .status-pill.listening { border-color: var(--listening); color: var(--listening); background: rgba(255,107,53,0.1); animation: pulse-border 1s infinite; }
  .status-pill.thinking { border-color: var(--accent3); color: var(--accent3); background: rgba(124,92,252,0.1); }
  .status-pill.speaking { border-color: var(--accent); color: var(--accent); background: rgba(0,229,160,0.1); }

  @keyframes pulse-border {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* Chat area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar { width: 3px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .message {
    display: flex;
    gap: 10px;
    animation: msg-in 0.3s ease;
    max-width: 85%;
  }

  @keyframes msg-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  .message.chitti { align-self: flex-start; }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .message.chitti .msg-avatar {
    background: linear-gradient(135deg, var(--accent3), var(--accent));
  }

  .message.user .msg-avatar {
    background: linear-gradient(135deg, #333, #555);
  }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.5;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 400;
  }

  .message.chitti .msg-bubble {
    background: var(--card);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .message.user .msg-bubble {
    background: linear-gradient(135deg, var(--accent3), #5a3fd4);
    border-bottom-right-radius: 4px;
    color: white;
  }

  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 4px 0;
    align-items: center;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: dot-bounce 1.2s infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dot-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* Wake word banner */
  .wake-banner {
    margin: 0 16px 8px;
    padding: 10px 16px;
    background: rgba(124,92,252,0.1);
    border: 1px solid rgba(124,92,252,0.3);
    border-radius: 12px;
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    letter-spacing: 0.5px;
    transition: all 0.3s;
  }

  .wake-banner strong { color: var(--accent3); }

  /* Chitti orb / main button */
  .chitti-orb-container {
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
  }

  .chitti-orb {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent3), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    cursor: pointer;
    position: relative;
    transition: all 0.3s;
    box-shadow: 0 0 30px rgba(124,92,252,0.3);
  }

  .chitti-orb:active { transform: scale(0.95); }

  .chitti-orb.listening {
    background: linear-gradient(135deg, var(--listening), #ff4444);
    box-shadow: 0 0 40px rgba(255,107,53,0.5);
    animation: orb-pulse 1s infinite;
  }

  .chitti-orb.thinking {
    animation: orb-spin 2s linear infinite;
    box-shadow: 0 0 40px rgba(124,92,252,0.6);
  }

  .chitti-orb.speaking {
    background: linear-gradient(135deg, var(--accent), #00b37a);
    box-shadow: 0 0 40px rgba(0,229,160,0.5);
    animation: orb-speak 0.5s ease infinite alternate;
  }

  @keyframes orb-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  @keyframes orb-spin {
    from { filter: hue-rotate(0deg); }
    to { filter: hue-rotate(360deg); }
  }

  @keyframes orb-speak {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
  }

  .orb-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
    animation: ring-expand 2s ease infinite;
  }

  .orb-ring:nth-child(2) { animation-delay: 0.5s; }
  .orb-ring:nth-child(3) { animation-delay: 1s; }

  @keyframes ring-expand {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  .orb-label {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* Text input row */
  .input-row {
    display: flex;
    gap: 8px;
    width: 100%;
  }

  .text-input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.3s;
  }

  .text-input:focus { border-color: var(--accent3); }
  .text-input::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--accent3), var(--accent));
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .send-btn:active { transform: scale(0.95); }

  /* Wake word detected overlay */
  .wake-flash {
    position: fixed;
    inset: 0;
    background: rgba(124,92,252,0.15);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 100;
  }

  .wake-flash.show { opacity: 1; }

  /* Intro message */
  .intro-card {
    background: linear-gradient(135deg, rgba(124,92,252,0.1), rgba(0,229,160,0.05));
    border: 1px solid rgba(124,92,252,0.2);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    margin: 8px 0;
  }

  .intro-card h3 {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  .intro-card p {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .lang-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 10px;
  }

  .lang-chip {
    padding: 3px 10px;
    background: rgba(124,92,252,0.15);
    border: 1px solid rgba(124,92,252,0.3);
    border-radius: 20px;
    font-size: 11px;
    color: var(--accent3);
    letter-spacing: 0.5px;
  }

  .wake-instruction {
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
    padding: 0 4px;
  }

  .wake-instruction strong {
    color: var(--accent3);
    font-size: 16px;
  }
</style>
</head>
<body class="sleeping">

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>
<div class="wake-flash" id="wakeFlash"></div>

<!-- Header -->
<div class="header">
  <div class="logo">
    <div class="logo-icon">🤖</div>
    <div>
      <div class="logo-text">CHITTI</div>
      <div class="logo-sub">Bharat ka Apna AI</div>
    </div>
  </div>
  <div class="status-pill sleeping" id="statusPill">Sleeping</div>
</div>

<!-- Chat -->
<div class="chat-area" id="chatArea">
  <div class="intro-card">
    <h3>Namaste! Main Chitti hoon 🙏</h3>
    <p>Pet. Commando. CA. Lawyer. Doctor. Mentor. Guardian.<br>Aapka apna dost — har pal, har bhasha mein.</p>
    <div class="lang-chips">
      <span class="lang-chip">हिंदी</span>
      <span class="lang-chip">తెలుగు</span>
      <span class="lang-chip">தமிழ்</span>
      <span class="lang-chip">ಕನ್ನಡ</span>
      <span class="lang-chip">मराठी</span>
      <span class="lang-chip">বাংলা</span>
      <span class="lang-chip">ગુજરાતી</span>
      <span class="lang-chip">ਪੰਜਾਬੀ</span>
    </div>
  </div>
</div>

<!-- Wake banner -->
<div class="wake-banner" id="wakeBanner">
  Say <strong>"Chitti"</strong> to wake me up, or tap the button below
</div>

<!-- Bottom controls -->
<div class="chitti-orb-container">
  <div class="wake-instruction" id="orbLabel">Tap to speak with Chitti</div>

  <div class="chitti-orb" id="chittiOrb" onclick="handleOrbClick()">
    <div class="orb-ring"></div>
    <div class="orb-ring"></div>
    <div class="orb-ring"></div>
    🤖
  </div>

  <div class="input-row">
    <input type="text" class="text-input" id="textInput" placeholder="Ya yahan type karein..." onkeydown="handleKeyDown(event)">
    <button class="send-btn" onclick="sendText()">➤</button>
  </div>
</div>

<script>
const VOICEFLOW_API_KEY = 'VF.DM.69d7b45ebece227e89351b25.VY6PU2A3gHl4KT6E';
const PROJECT_ID = '69d7b1db0e890631d2ba9d8c';
const USER_ID = 'chitti_user_' + Math.random().toString(36).substr(2, 9);

let state = 'sleeping'; // sleeping, awake, listening, thinking, speaking
let recognition = null;
let synth = window.speechSynthesis;
let wakeWordListening = false;
let wakeRecognition = null;
let sessionStarted = false;

// ── State management ──────────────────────────────────────
function setState(newState) {
  state = newState;
  document.body.className = newState;
  const pill = document.getElementById('statusPill');
  const orb = document.getElementById('chittiOrb');
  const label = document.getElementById('orbLabel');

  pill.className = 'status-pill ' + newState;

  const states = {
    sleeping: { pill: 'Sleeping 😴', orb: '🤖', label: 'Tap to speak with Chitti' },
    awake:    { pill: 'Awake ✨',    orb: '👂', label: 'Bol Sire, main sun raha hoon...' },
    listening:{ pill: 'Listening 🎤', orb: '🎤', label: 'Bol raha hoon... (tap to stop)' },
    thinking: { pill: 'Thinking 🧠', orb: '⚡', label: 'Chitti soch raha hai...' },
    speaking: { pill: 'Speaking 🔊', orb: '🔊', label: 'Tap to interrupt' },
  };

  const s = states[newState] || states.sleeping;
  pill.textContent = s.pill;
  orb.innerHTML = `<div class="orb-ring"></div><div class="orb-ring"></div><div class="orb-ring"></div>${s.orb}`;
  label.textContent = s.label;
}

// ── Wake word detection ───────────────────────────────────
function startWakeWordDetection() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  wakeRecognition = new SR();
  wakeRecognition.continuous = true;
  wakeRecognition.interimResults = true;
  wakeRecognition.lang = 'hi-IN';

  wakeRecognition.onresult = (e) => {
    const transcript = Array.from(e.results)
      .map(r => r[0].transcript)
      .join(' ')
      .toLowerCase();

    if (transcript.includes('chitti') || transcript.includes('चित्ती') || transcript.includes('चिट्टी')) {
      wakeWordDetected();
    }
  };

  wakeRecognition.onend = () => {
    if (state === 'sleeping') {
      setTimeout(() => { try { wakeRecognition.start(); } catch(e) {} }, 500);
    }
  };

  try { wakeRecognition.start(); wakeWordListening = true; } catch(e) {}
}

function wakeWordDetected() {
  if (state !== 'sleeping') return;
  const flash = document.getElementById('wakeFlash');
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 600);
  setState('awake');
  if (wakeRecognition) { try { wakeRecognition.stop(); } catch(e) {} }
  addMessage('chitti', 'Haan Sire! Main aa gaya. Boliye, kya madad kar sakta hoon? 🙏');
  speak('Haan Sire! Boliye, kya madad kar sakta hoon?', () => startListening());
}

// ── Orb click handler ─────────────────────────────────────
function handleOrbClick() {
  if (state === 'sleeping') {
    setState('awake');
    if (!sessionStarted) {
      sessionStarted = true;
      addMessage('chitti', 'Namaste Sire! Main Chitti hoon. Boliye, kya madad kar sakta hoon? 🙏');
      speak('Namaste Sire! Main Chitti hoon. Boliye kya madad kar sakta hoon?', () => startListening());
    } else {
      startListening();
    }
  } else if (state === 'listening') {
    stopListening();
  } else if (state === 'speaking') {
    synth.cancel();
    setState('awake');
    startListening();
  } else if (state === 'awake') {
    startListening();
  }
}

// ── Speech recognition ────────────────────────────────────
function startListening() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    addMessage('chitti', 'Aapka browser speech recognition support nahi karta. Neeche type karein. 😊');
    return;
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'hi-IN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  setState('listening');

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    addMessage('user', transcript);
    setState('thinking');
    sendToVoiceflow(transcript);
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech') {
      setState('awake');
    } else {
      setState('awake');
    }
  };

  recognition.onend = () => {
    if (state === 'listening') setState('awake');
  };

  try { recognition.start(); } catch(e) { setState('awake'); }
}

function stopListening() {
  if (recognition) { try { recognition.stop(); } catch(e) {} }
  setState('awake');
}

// ── Voiceflow API ─────────────────────────────────────────
async function sendToVoiceflow(message) {
  setState('thinking');
  showTyping();

  try {
    const response = await fetch(`https://general-runtime.voiceflow.com/state/user/${USER_ID}/interact`, {
      method: 'POST',
      headers: {
        'Authorization': VOICEFLOW_API_KEY,
        'Content-Type': 'application/json',
        'versionID': 'production'
      },
      body: JSON.stringify({
        action: { type: 'text', payload: message },
        config: { tts: false, stripSSML: true }
      })
    });

    const data = await response.json();
    hideTyping();

    let fullResponse = '';
    for (const trace of data) {
      if (trace.type === 'text' || trace.type === 'speak') {
        const text = trace.payload?.message || trace.payload?.text || '';
        if (text) fullResponse += text + ' ';
      }
    }

    if (fullResponse.trim()) {
      addMessage('chitti', fullResponse.trim());
      setState('speaking');
      speak(fullResponse.trim(), () => {
        setState('awake');
        setTimeout(() => startListening(), 800);
      });
    } else {
      addMessage('chitti', 'Maafi chahta hoon, kuch samajh nahi aaya. Dobara bolein? 🙏');
      setState('awake');
      setTimeout(() => startListening(), 800);
    }

  } catch (err) {
    hideTyping();
    addMessage('chitti', 'Network mein kuch problem hai. Thodi der mein try karein. 🙏');
    setState('awake');
  }
}

// ── TTS ───────────────────────────────────────────────────
function speak(text, callback) {
  if (!synth) { if (callback) callback(); return; }
  synth.cancel();

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'hi-IN';
  utter.rate = 0.95;
  utter.pitch = 1.0;

  // Try to find Hindi voice
  const voices = synth.getVoices();
  const hindiVoice = voices.find(v => v.lang.includes('hi') || v.name.includes('Hindi'));
  if (hindiVoice) utter.voice = hindiVoice;

  utter.onend = () => { if (callback) callback(); };
  utter.onerror = () => { if (callback) callback(); };

  setState('speaking');
  synth.speak(utter);
}

// ── Text input ────────────────────────────────────────────
function sendText() {
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage('user', text);
  setState('thinking');
  sessionStarted = true;
  if (state !== 'sleeping') stopWakeWord();
  sendToVoiceflow(text);
}

function handleKeyDown(e) {
  if (e.key === 'Enter') sendText();
}

function stopWakeWord() {
  if (wakeRecognition) { try { wakeRecognition.stop(); } catch(e) {} }
}

// ── UI helpers ────────────────────────────────────────────
function addMessage(role, text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const avatar = role === 'chitti' ? '🤖' : '👤';
  div.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div class="msg-bubble">${text}</div>
  `;

  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

let typingEl = null;
function showTyping() {
  const area = document.getElementById('chatArea');
  typingEl = document.createElement('div');
  typingEl.className = 'message chitti';
  typingEl.id = 'typingIndicator';
  typingEl.innerHTML = `
    <div class="msg-avatar">🤖</div>
    <div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
  `;
  area.appendChild(typingEl);
  area.scrollTop = area.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

// ── Init ──────────────────────────────────────────────────
window.onload = () => {
  // Load voices
  synth.onvoiceschanged = () => synth.getVoices();
  synth.getVoices();

  // Start wake word detection
  setTimeout(() => startWakeWordDetection(), 1000);

  setState('sleeping');
};
</script>
</body>
