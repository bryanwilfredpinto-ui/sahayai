# Render Blueprint for Chitti 2-Wheeler
# -----------------------------------------------------------------
# Turso embedded-replica pattern (SAHAYAI_MASTER §2 row 2 — one DB per
# Chitti). Local SQLite file lives at /tmp/chitti_2wheeler.db; bg sync
# loop pushes / pulls every 60 s. Render free tier wipes /tmp on each
# deploy, so we re-sync from Turso on boot — no data loss.
#
# Before first deploy:
#   1. Create Turso DB:  turso db create chitti-2wheeler --group default
#      (aws-ap-south-1 / Mumbai, under bryanwilfredpinto org — matches
#       [[project_turso_db_inventory]])
#   2. Get URL:          turso db show chitti-2wheeler --url
#      Gives:            libsql://chitti-2wheeler-<org>.turso.io
#   3. Get token:        turso db tokens create chitti-2wheeler
#   4. Compose final:    libsql://<host>?authToken=<token>
#   5. Paste into the DATABASE_URL env var in the Render dashboard
#      (sync:false means Render won't try to read it from this file).

services:
  - type: web
    name: chitti-2wheeler-api
    runtime: python
    plan: free
    rootDir: chitti-2wheeler/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10

      # ── Turso (SAHAYAI_MASTER §2 row 2 — one DB per Chitti) ──
      # Compose: libsql://<host>?authToken=<token>
      - key: DATABASE_URL
        sync: false
      # Optional: pin the local replica path. Default /tmp/chitti_2wheeler.db.
      - key: LIBSQL_REPLICA_PATH
        value: /tmp/chitti_2wheeler.db

      # ── DeepSeek ── sole LLM provider (§2 row 1)
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_URL
        value: https://api.deepseek.com/chat/completions
      - key: DEEPSEEK_MAX_TOKENS
        value: "700"
      - key: DEEPSEEK_TEMPERATURE
        value: "0.2"

      # ── CORS / self-URL ──
      - key: ALLOWED_ORIGINS
        value: "https://sahayai.in,https://www.sahayai.in"
      - key: BACKEND_URL
        value: https://chitti-2wheeler-api-production.up.railway.app
